name: Staging database migration

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Source ref to migrate into staging
        required: true
        default: staging
        type: choice
        options:
          - staging
          - master
      seed_mode:
        description: Optional explicitly approved staging seed
        required: true
        default: none
        type: choice
        options:
          - none
          - education-v2-p0
      education_v2_level_code:
        description: Existing Level code required only for the Education V2 seed
        required: false
        type: string
      seed_confirmation:
        description: Type I_HAVE_REVIEWED_EDUCATION_V2_P0 only for the approved staging seed
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: staging-database-migration
  cancel-in-progress: false

jobs:
  staging-migration:
    name: Apply Prisma migrations to staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      APP_ENV: staging
      NODE_ENV: test
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DB_FINGERPRINT_DATABASE_URL: ${{ secrets.DB_FINGERPRINT_DATABASE_URL }}
      DB_FINGERPRINT_ENVIRONMENT: ${{ vars.DB_FINGERPRINT_ENVIRONMENT }}
      DB_FINGERPRINT_APPROVED_TARGET_FINGERPRINT: ${{ vars.DB_FINGERPRINT_APPROVED_TARGET_FINGERPRINT }}
      EXPECTED_STAGING_FINGERPRINT: 18b7c0ef4791f6596fe2e61879df641fb14e5a7f88e3d06c88f634c17af13b38
    steps:
      - name: Verify selected source ref and optional seed approval
        shell: bash
        env:
          TARGET_REF: ${{ inputs.ref }}
          SEED_MODE: ${{ inputs.seed_mode }}
          LEVEL_CODE: ${{ inputs.education_v2_level_code }}
          SEED_CONFIRMATION: ${{ inputs.seed_confirmation }}
        run: |
          set -euo pipefail
          case "$TARGET_REF" in
            staging|master) ;;
            *) echo "unsupported source ref" >&2; exit 1 ;;
          esac
          case "$SEED_MODE" in
            none) ;;
            education-v2-p0)
              test "$TARGET_REF" = "master"
              test -n "$LEVEL_CODE"
              test "$SEED_CONFIRMATION" = "I_HAVE_REVIEWED_EDUCATION_V2_P0"
              ;;
            *) echo "unsupported seed mode" >&2; exit 1 ;;
          esac

      - name: Checkout selected source ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Verify staging database identity
        shell: bash
        run: |
          set -euo pipefail
          test "$APP_ENV" = "staging"
          test "$NODE_ENV" = "test"
          test "$DB_FINGERPRINT_ENVIRONMENT" = "STAGING"
          test -n "$DATABASE_URL"
          test -n "$DB_FINGERPRINT_DATABASE_URL"
          test "$DB_FINGERPRINT_APPROVED_TARGET_FINGERPRINT" = "$EXPECTED_STAGING_FINGERPRINT"

          fingerprint_output="$RUNNER_TEMP/staging-fingerprint-before.json"
          fingerprint_error="$RUNNER_TEMP/staging-fingerprint-before.err"
          if ! npx tsx scripts/db-fingerprint.ts >"$fingerprint_output" 2>"$fingerprint_error"; then
            echo "staging database fingerprint command failed" >&2
            exit 1
          fi

          EXPECTED_STAGING_FINGERPRINT="$EXPECTED_STAGING_FINGERPRINT" \
            TARGET_REF="${{ inputs.ref }}" \
            FINGERPRINT_OUTPUT="$fingerprint_output" \
            npx tsx -e '
          import { readFileSync, writeFileSync } from "node:fs";
          import {
            assertCatalogEnvironmentSafety,
            assertLiveCatalogTargetIdentity,
            parseCatalogTargetUrl,
            targetFingerprint,
          } from "./src/curriculum/catalog-target-verification.ts";

          const expected = process.env.EXPECTED_STAGING_FINGERPRINT;
          const report = JSON.parse(readFileSync(process.env.FINGERPRINT_OUTPUT, "utf8"));
          const pending = report.migrations?.pending;
          const failed = report.migrations?.failed;
          const completedPointEvent = "20260907160000_add_training_session_completed_point_event";
          const foundation = "20260914100000_add_learning_experience_foundation";
          const learningPathDomain = "20260925100000_add_learning_path_domain";
          const commonLearningArea = "20260925110000_add_common_learning_area";
          const allowedPendingMigrationPolicy = [
            completedPointEvent,
            foundation,
            learningPathDomain,
            commonLearningArea,
          ];
          const pendingMigrations = Array.isArray(pending) && pending.every((name) => typeof name === "string")
            ? pending
            : null;
          const allowedPendingMigrations =
            pendingMigrations?.filter((name) => allowedPendingMigrationPolicy.includes(name)) ?? null;
          const unexpectedPendingMigrations =
            pendingMigrations?.filter((name) => !allowedPendingMigrationPolicy.includes(name)) ?? null;
          const formatMigrationList = (names) =>
            names === null ? "NOT_AVAILABLE" : names.length === 0 ? "NONE" : names.join(",");
          const target = parseCatalogTargetUrl(process.env.DB_FINGERPRINT_DATABASE_URL, "STAGING");
          const identity = {
            database: report.database?.database,
            db_user: report.database?.currentUser,
          };
          assertCatalogEnvironmentSafety(target, { rejectTestDatabase: true });
          assertLiveCatalogTargetIdentity(target, identity);
          const actual = targetFingerprint(target, identity);
          const checks = {
            targetEnvironment: report.target?.environment === "STAGING",
            targetFingerprint: actual === expected && /^[a-f0-9]{64}$/u.test(actual),
            migrationCollections: Array.isArray(pending) && Array.isArray(failed),
            pendingMigrationsShape: pendingMigrations !== null,
            noFailedMigrations: Array.isArray(failed) && failed.length === 0,
            allowedPendingMigrations:
              pendingMigrations !== null &&
              pendingMigrations.length <= allowedPendingMigrationPolicy.length &&
              unexpectedPendingMigrations.length === 0,
            noUnexpectedAppliedMigrations:
              report.migrations?.appliedCount <= report.migrations?.repositoryCount,
          };
          const failedChecks = Object.entries(checks)
            .filter(([, passed]) => !passed)
            .map(([name]) => name);
          writeFileSync(
            `${process.env.RUNNER_TEMP}/staging-migration-precondition.json`,
            JSON.stringify(
              {
                result: failedChecks.length === 0 ? "PASS" : "FAIL",
                pendingMigrations,
                allowedPendingMigrations,
                unexpectedPendingMigrations,
                allowedPendingMigrationPolicy,
                failedChecks,
                checks,
              },
              null,
              2,
            ),
          );

          if (failedChecks.length > 0) {
            throw new Error(
              `staging precondition failed: ${failedChecks.join(",")}; pendingMigrations=${formatMigrationList(
                pendingMigrations,
              )}; allowedPendingMigrations=${formatMigrationList(
                allowedPendingMigrations,
              )}; unexpectedPendingMigrations=${formatMigrationList(unexpectedPendingMigrations)}`,
            );
          }

          writeFileSync(
            `${process.env.RUNNER_TEMP}/staging-migration-preflight.json`,
            JSON.stringify(
              {
                environment: "STAGING",
                fingerprint: actual,
                migrationStatus: report.status,
                migrationHistoryCount: report.migrations.appliedCount,
                pendingMigrations,
                allowedPendingMigrations,
                unexpectedPendingMigrations,
                allowedPendingMigrationPolicy,
                failedMigrations: failed.length,
                rolledBackMigrations: failed.filter((migration) => migration.rolledBack).length,
              },
              null,
              2,
            ),
          );
          console.log("staging fingerprint=PASS");
          '

      - name: Apply staging Prisma migrations
        id: apply
        run: npx prisma migrate deploy

      - name: Verify staging migration and schema
        id: verify
        shell: bash
        run: |
          set -euo pipefail

          migration_status="$RUNNER_TEMP/staging-migrate-status.txt"
          if ! npx prisma migrate status --schema=prisma/schema.prisma >"$migration_status" 2>&1; then
            echo "staging migration status check failed" >&2
            exit 1
          fi

          schema_diff="$RUNNER_TEMP/staging-schema-diff.txt"
          set +e
          npx prisma migrate diff \
            --exit-code \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel prisma/schema.prisma >"$schema_diff" 2>&1
          schema_diff_exit=$?
          set -e
          if test "$schema_diff_exit" -eq 2; then
            echo "staging schema drift detected" >&2
            exit 1
          fi
          if test "$schema_diff_exit" -ne 0; then
            echo "staging schema drift check failed" >&2
            exit 1
          fi

          fingerprint_output="$RUNNER_TEMP/staging-fingerprint-after.json"
          fingerprint_error="$RUNNER_TEMP/staging-fingerprint-after.err"
          if ! npx tsx scripts/db-fingerprint.ts >"$fingerprint_output" 2>"$fingerprint_error"; then
            echo "staging post-migration fingerprint command failed" >&2
            exit 1
          fi

          EXPECTED_STAGING_FINGERPRINT="$EXPECTED_STAGING_FINGERPRINT" \
            TARGET_REF="${{ inputs.ref }}" \
            FINGERPRINT_OUTPUT="$fingerprint_output" \
            npx tsx -e '
          import { readdirSync, readFileSync, writeFileSync } from "node:fs";
          import {
            assertCatalogEnvironmentSafety,
            assertLiveCatalogTargetIdentity,
            parseCatalogTargetUrl,
            targetFingerprint,
          } from "./src/curriculum/catalog-target-verification.ts";

          const expected = process.env.EXPECTED_STAGING_FINGERPRINT;
          const report = JSON.parse(readFileSync(process.env.FINGERPRINT_OUTPUT, "utf8"));
          const pending = report.migrations?.pending;
          const failed = report.migrations?.failed;
          const completedPointEvent = "20260907160000_add_training_session_completed_point_event";
          const foundation = "20260914100000_add_learning_experience_foundation";
          const learningPathDomain = "20260925100000_add_learning_path_domain";
          const commonLearningArea = "20260925110000_add_common_learning_area";
          const allowedPendingMigrationPolicy = [
            completedPointEvent,
            foundation,
            learningPathDomain,
            commonLearningArea,
          ];
          const pendingMigrations = Array.isArray(pending) && pending.every((name) => typeof name === "string")
            ? pending
            : null;
          const allowedPendingMigrations =
            pendingMigrations?.filter((name) => allowedPendingMigrationPolicy.includes(name)) ?? null;
          const unexpectedPendingMigrations =
            pendingMigrations?.filter((name) => !allowedPendingMigrationPolicy.includes(name)) ?? null;
          const target = parseCatalogTargetUrl(process.env.DB_FINGERPRINT_DATABASE_URL, "STAGING");
          const identity = {
            database: report.database?.database,
            db_user: report.database?.currentUser,
          };
          assertCatalogEnvironmentSafety(target, { rejectTestDatabase: true });
          assertLiveCatalogTargetIdentity(target, identity);
          const actual = targetFingerprint(target, identity);
          const appliedMigrationNames = readdirSync("prisma/migrations", { withFileTypes: true })
            .filter((entry) => entry.isDirectory())
            .map((entry) => entry.name)
            .sort();
          const expectedMigrationNames = process.env.TARGET_REF === "master"
            ? [foundation, learningPathDomain, commonLearningArea]
            : [foundation];
          const checks = {
            migrationStatusCurrent: report.status === "PASS",
            targetEnvironment: report.target?.environment === "STAGING",
            targetFingerprint: actual === expected && /^[a-f0-9]{64}$/u.test(actual),
            pendingMigrationsShape: pendingMigrations !== null,
            noPendingMigrations: pendingMigrations !== null && pendingMigrations.length === 0,
            noFailedMigrations: Array.isArray(failed) && failed.length === 0,
            expectedMigrationApplied: expectedMigrationNames.every((name) => appliedMigrationNames.includes(name)),
            migrationCountsMatch:
              report.migrations?.appliedCount === report.migrations?.repositoryCount,
          };
          const failedChecks = Object.entries(checks)
            .filter(([, passed]) => !passed)
            .map(([name]) => name);
          writeFileSync(
            `${process.env.RUNNER_TEMP}/staging-migration-postcondition.json`,
            JSON.stringify(
              {
                result: failedChecks.length === 0 ? "PASS" : "FAIL",
                pendingMigrations,
                allowedPendingMigrations,
                unexpectedPendingMigrations,
                allowedPendingMigrationPolicy,
                failedChecks,
                checks,
              },
              null,
              2,
            ),
          );

          if (failedChecks.length > 0) {
            throw new Error(`staging postcondition failed: ${failedChecks.join(",")}`);
          }

          writeFileSync(
            `${process.env.RUNNER_TEMP}/staging-migration-verification.json`,
            JSON.stringify(
              {
                environment: "STAGING",
                fingerprint: actual,
                migrationStatus: report.status,
                migrationHistoryCount: report.migrations.appliedCount,
                appliedMigrationNames,
                failedMigrations: failed.length,
                rolledBackMigrations: failed.filter((migration) => migration.rolledBack).length,
                schema: "PASS",
                schemaDrift: false,
                result: "PASS",
              },
              null,
              2,
            ),
          );
          console.log("staging migration=PASS schema=PASS schemaDrift=FALSE");
          '

      - name: Apply Education V2 P0 staging seed
        id: seed
        if: ${{ inputs.seed_mode == 'education-v2-p0' }}
        env:
          EDUCATION_V2_P0_ENVIRONMENT: STAGING
          EDUCATION_V2_P0_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EDUCATION_V2_P0_LEVEL_CODE: ${{ inputs.education_v2_level_code }}
          EDUCATION_V2_P0_ALLOW_WRITE: ${{ inputs.seed_confirmation }}
        run: |
          set -euo pipefail
          test "$EDUCATION_V2_P0_ENVIRONMENT" = "STAGING"
          test -n "$EDUCATION_V2_P0_DATABASE_URL"
          test -n "$EDUCATION_V2_P0_LEVEL_CODE"
          test "$EDUCATION_V2_P0_ALLOW_WRITE" = "I_HAVE_REVIEWED_EDUCATION_V2_P0"
          npx tsx scripts/seed-education-v2-p0.ts --apply

      - name: Verify Education V2 P0 staging seed
        id: seed-verify
        if: ${{ inputs.seed_mode == 'education-v2-p0' }}
        env:
          EDUCATION_V2_P0_ENVIRONMENT: STAGING
          EDUCATION_V2_P0_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EDUCATION_V2_P0_LEVEL_CODE: ${{ inputs.education_v2_level_code }}
        run: |
          set -euo pipefail
          test "$EDUCATION_V2_P0_ENVIRONMENT" = "STAGING"
          npx tsx scripts/seed-education-v2-p0.ts --dry-run

      - name: Publish sanitized staging migration summary
        if: always()
        shell: bash
        env:
          APPLY_OUTCOME: ${{ steps.apply.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          SEED_OUTCOME: ${{ steps.seed.outcome }}
          SEED_VERIFY_OUTCOME: ${{ steps.seed-verify.outcome }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          import { existsSync, readFileSync } from "node:fs";

          const readJson = (path) => (existsSync(path) ? JSON.parse(readFileSync(path, "utf8")) : null);
          const preflight = readJson(`${process.env.RUNNER_TEMP}/staging-migration-preflight.json`);
          const precondition = readJson(`${process.env.RUNNER_TEMP}/staging-migration-precondition.json`);
          const postcondition = readJson(`${process.env.RUNNER_TEMP}/staging-migration-postcondition.json`);
          const verification = readJson(`${process.env.RUNNER_TEMP}/staging-migration-verification.json`);
          const safe = verification ?? preflight;
          const applied = verification?.appliedMigrationNames ?? [];
          const checks = postcondition?.checks ?? precondition?.checks ?? {};
          const pendingMigrations =
            postcondition?.pendingMigrations ?? precondition?.pendingMigrations ?? preflight?.pendingMigrations ?? null;
          const allowedPendingMigrations =
            postcondition?.allowedPendingMigrations ??
            precondition?.allowedPendingMigrations ??
            preflight?.allowedPendingMigrations ??
            null;
          const unexpectedPendingMigrations =
            postcondition?.unexpectedPendingMigrations ??
            precondition?.unexpectedPendingMigrations ??
            preflight?.unexpectedPendingMigrations ??
            null;
          const formatMigrationList = (names) =>
            Array.isArray(names) ? (names.length ? names.join(", ") : "NONE") : "NOT_AVAILABLE";

          console.log("## Staging database migration");
          console.log(`- sourceRef: ${{ inputs.ref }}`);
          console.log(`- educationV2Seed: ${{ inputs.seed_mode }}`);
          console.log(`- targetEnvironment: ${safe?.environment ?? "STAGING"}`);
          console.log(`- targetFingerprint: ${safe?.fingerprint ?? "NOT_AVAILABLE"}`);
          console.log(`- migrationHistoryCount: ${safe?.migrationHistoryCount ?? "NOT_AVAILABLE"}`);
          console.log(`- migrationStatus: ${verification?.migrationStatus ?? preflight?.migrationStatus ?? "NOT_RUN"}`);
          console.log(`- appliedMigrationNames: ${applied.length ? applied.join(", ") : "NOT_VERIFIED"}`);
          console.log(`- pendingMigrations: ${formatMigrationList(pendingMigrations)}`);
          console.log(`- allowedPendingMigrations: ${formatMigrationList(allowedPendingMigrations)}`);
          console.log(`- unexpectedPendingMigrations: ${formatMigrationList(unexpectedPendingMigrations)}`);
          console.log(`- failedMigrations: ${verification?.failedMigrations ?? preflight?.failedMigrations ?? "NOT_VERIFIED"}`);
          console.log(`- rolledBackMigrations: ${verification?.rolledBackMigrations ?? preflight?.rolledBackMigrations ?? "NOT_VERIFIED"}`);
          console.log(`- schema: ${verification?.schema ?? "NOT_VERIFIED"}`);
          console.log(`- schemaDrift: ${verification?.schemaDrift === false ? "false" : "NOT_VERIFIED"}`);
          console.log(`- migrateDeploy: ${process.env.APPLY_OUTCOME === "success" ? "PASS" : process.env.APPLY_OUTCOME ?? "NOT_RUN"}`);
          console.log(`- verification: ${process.env.VERIFY_OUTCOME === "success" ? "PASS" : process.env.VERIFY_OUTCOME ?? "NOT_RUN"}`);
          console.log(`- seed: ${process.env.SEED_OUTCOME === "success" ? "PASS" : process.env.SEED_OUTCOME ?? "NOT_RUN"}`);
          console.log(`- seedVerification: ${process.env.SEED_VERIFY_OUTCOME === "success" ? "PASS" : process.env.SEED_VERIFY_OUTCOME ?? "NOT_RUN"}`);
          console.log(`- result: ${verification?.result ?? "FAIL_OR_NOT_RUN"}`);
          console.log(`- preconditionResult: ${postcondition?.result ?? precondition?.result ?? "NOT_VERIFIED"}`);
          for (const [key, value] of Object.entries(checks)) console.log(`- precondition.${key}: ${value ? "PASS" : "FAIL"}`);
          console.log(`- failedPreconditions: ${(postcondition?.failedChecks ?? precondition?.failedChecks ?? []).join(", ") || "NONE"}`);
          NODE
