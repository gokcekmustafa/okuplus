name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oku_plus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d oku_plus_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/oku_plus_test?schema=public
      RLS_TEST_DATABASE_URL: postgresql://oku_app:oku_app_pass@localhost:5432/oku_plus_test?schema=public&connection_limit=1
      JWT_SECRET: ci-only-jwt-secret-not-for-deployment
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Prepare non-superuser RLS test role
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            CREATE ROLE oku_app LOGIN PASSWORD 'oku_app_pass';
          EXCEPTION
            WHEN duplicate_object THEN NULL;
          END
          $$;
          GRANT CONNECT ON DATABASE oku_plus_test TO oku_app;
          GRANT USAGE ON SCHEMA public TO oku_app;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO oku_app;
          GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA public TO oku_app;
          SQL

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test -- --reporter=dot
