name: Staging pilot smoke

on:
  workflow_dispatch:
    inputs:
      student_email:
        description: "Optional clean .invalid synthetic student; defaults to staging pilot fixture"
        required: false
        type: string
        default: ""
  push:
    branches:
      - staging

permissions:
  contents: read

jobs:
  staging-pilot-smoke:
    name: Run short authenticated staging pilot smoke
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      APP_ENV: staging
      NODE_ENV: test
      BASE_URL: https://okuplus-git-staging-gokcekmustafas-projects.vercel.app
      STAGING_STUDENT_EMAIL: ${{ inputs.student_email || vars.STAGING_PILOT_SMOKE_STUDENT_EMAIL || vars.STAGING_STUDENT_EMAIL }}
      STAGING_STUDENT_PASSWORD: ${{ secrets.STAGING_STUDENT_PASSWORD }}

    steps:
      - name: Fail closed outside stable staging
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/staging"
          test "$BASE_URL" = "https://okuplus-git-staging-gokcekmustafas-projects.vercel.app"
          if [[ "$BASE_URL" =~ (production|prod) ]]; then
            echo "production URL rejected" >&2
            exit 1
          fi
          if [[ -n "${PRODUCTION_BASE_URL:-}" || -n "${PRODUCTION_DATABASE_URL:-}" || -n "${PRODUCTION_STUDENT_PASSWORD:-}" ]]; then
            echo "production configuration detected" >&2
            exit 1
          fi
          echo "target=staging"
          echo "productionTouched=NO"

      - name: Checkout staging
        uses: actions/checkout@v4
        with:
          ref: staging

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install fast-smoke dependencies
        shell: bash
        run: |
          set -euo pipefail
          started=$SECONDS
          npm ci --include=dev --ignore-scripts --prefer-offline
          duration=$((SECONDS - started))
          echo "installDurationSeconds=$duration"
          echo "- install duration: ${duration}s" >> "$GITHUB_STEP_SUMMARY"
          if (( duration > 10 )); then echo "::warning title=Slow staging smoke step::install took ${duration}s"; fi

      - name: Validate staging configuration
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const value = process.env.BASE_URL?.trim();
          if (!value) throw new Error("BASE_URL is not configured");
          const url = new URL(value);
          if (url.protocol !== "https:" || !/^okuplus-[a-z0-9-]+-gokcekmustafas-projects\.vercel\.app$/u.test(url.hostname)) {
            throw new Error("BASE_URL is not an approved staging deployment URL");
          }
          const email = process.env.STAGING_STUDENT_EMAIL?.trim().toLowerCase();
          if (!email || !/^[^@\s]+@[^@\s]+\.invalid$/u.test(email)) {
            throw new Error("STAGING_STUDENT_EMAIL must be a .invalid synthetic email");
          }
          if (!process.env.STAGING_STUDENT_PASSWORD) throw new Error("STAGING_STUDENT_PASSWORD is not configured");
          console.log("staging configuration=present");
          console.log("student fixture=synthetic .invalid (value hidden)");
          console.log("student password=protected secret (value hidden)");
          NODE

      - name: Check staging health
        shell: bash
        run: |
          set -euo pipefail
          started=$SECONDS
          pids=()
          for path in /health /health/db /ready; do
            curl --fail --silent --show-error --location --max-time 20 -o "/tmp/okuplus-health-${path//\//_}" -w "%{http_code}" "${BASE_URL}${path}" > "/tmp/okuplus-status-${path//\//_}" &
            pids+=("$!")
          done
          for index in "${!pids[@]}"; do
            wait "${pids[$index]}"
            path="$(printf '%s\n' /health /health/db /ready | sed -n "$((index + 1))p")"
            status="$(cat "/tmp/okuplus-status-${path//\//_}")"
            test "$status" = "200"
            echo "${path}=200"
          done
          duration=$((SECONDS - started))
          echo "healthDurationSeconds=$duration"
          echo "- health duration: ${duration}s" >> "$GITHUB_STEP_SUMMARY"
          if (( duration > 10 )); then echo "::warning title=Slow staging smoke step::health took ${duration}s"; fi

      - name: Locate Chromium
        shell: bash
        run: |
          set -euo pipefail
          browser="$(command -v chromium || command -v google-chrome || command -v chromium-browser || true)"
          test -n "$browser"
          printf 'CHROME_PATH=%s\n' "$browser" >> "$GITHUB_ENV"
          echo "browser=available"

      - name: Run fast authenticated browser smoke
        shell: bash
        run: |
          set -euo pipefail
          started=$SECONDS
          set +e
          output="$(npx tsx scripts/browser-staging-pilot-smoke.ts 2>&1)"
          exit_code=$?
          set -e
          duration=$((SECONDS - started))
          set +e
          SMOKE_EXIT_CODE="$exit_code" SMOKE_DURATION_SECONDS="$duration" SMOKE_OUTPUT="$output" node --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";
          const raw = process.env.SMOKE_OUTPUT ?? "";
          const parseJson = (text) => {
            for (const line of text.trim().split("\n").reverse()) {
              try {
                const parsed = JSON.parse(line);
                if (parsed && typeof parsed === "object") return parsed;
              } catch {}
            }
            return null;
          };
          const result = parseJson(raw) ?? { status: "FAIL" };
          const redact = (value) => String(value)
            .replace(/https?:\/\/\S+/gu, "[url]")
            .replace(/(?:password|token|cookie|authorization)\s*[:=]?\s*\S+/giu, "[redacted]")
            .slice(0, 240);
          const safe = {
            status: result.status === "PASS" ? "PASS" : "FAIL",
            auth: result.auth ?? "NOT_RUN",
            authMe: result.authMe ?? "NOT_RUN",
            dashboard: result.dashboard ?? "NOT_RUN",
            training: result.training ?? "NOT_RUN",
            exercise: result.exercise ?? "NOT_RUN",
            answerFeedback: result.answerFeedback ?? "NOT_RUN",
            mobile: Array.isArray(result.mobile) ? result.mobile : [],
            support: result.support ?? "NOT_RUN",
            bugReport: result.bugReport ?? "NOT_RUN",
            consoleErrors: Number(result.consoleErrors ?? 0),
            pageErrors: Number(result.pageErrors ?? 0),
            networkErrors: Number(result.networkErrors ?? 0),
            unexpectedHttpErrors: Number(result.unexpectedHttpErrors ?? 0),
            duplicateAnswerRequests: Number(result.duplicateAnswerRequests ?? 0),
            totalDurationMs: Number(result.totalDurationMs ?? 0),
            stepDurations: Array.isArray(result.stepDurations) ? result.stepDurations : [],
            slowStages: Array.isArray(result.slowStages) ? result.slowStages : [],
            performanceWarnings: Array.isArray(result.performanceWarnings) ? result.performanceWarnings : [],
            failedStage: typeof result.failedStage === "string" ? result.failedStage : null,
            selector: typeof result.selector === "string" ? result.selector.slice(0, 200) : null,
            currentRoute: typeof result.currentRoute === "string" && result.currentRoute.startsWith("/")
              ? result.currentRoute.slice(0, 120)
              : null,
            errorType: typeof result.errorType === "string" ? result.errorType : null,
            error: typeof result.message === "string" ? redact(result.message) : null,
            productionTouched: "NO",
            fullE2e: "NOT_RUN",
          };
          writeFileSync("staging-pilot-smoke-summary.json", JSON.stringify(safe, null, 2));
          console.log(`pilotSmoke=${safe.status}`);
          console.log(`mobile=${safe.mobile.join(",")}`);
          console.log(`support=${safe.support} bugReport=${safe.bugReport}`);
          console.log(`consoleErrors=${safe.consoleErrors} pageErrors=${safe.pageErrors}`);
          console.log(`networkErrors=${safe.networkErrors} unexpectedHttpErrors=${safe.unexpectedHttpErrors}`);
          console.log(`duplicateAnswerRequests=${safe.duplicateAnswerRequests}`);
          console.log(`totalDurationMs=${safe.totalDurationMs}`);
          console.log(`slowStages=${safe.slowStages.join(",") || "none"}`);
          console.log(`performanceWarnings=${safe.performanceWarnings.join(",") || "none"}`);
          console.log(`failedStage=${safe.failedStage ?? "none"}`);
          console.log(`selector=${safe.selector ?? "none"}`);
          console.log(`currentRoute=${safe.currentRoute ?? "unknown"}`);
          console.log(`errorType=${safe.errorType ?? "unknown"}`);
          console.log("fullE2E=NOT_RUN");
          if (safe.error) console.log(`pilotSmoke.error=${safe.error}`);
          const duration = Math.max(0, Number(process.env.SMOKE_DURATION_SECONDS ?? 0));
          console.log(`workflowSmokeDurationSeconds=${duration}`);
          if (Number(process.env.SMOKE_EXIT_CODE) !== 0 || safe.status !== "PASS") process.exitCode = 1;
          NODE
          summary_exit_code=$?
          set -e

          echo "workflowSmokeDurationSeconds=$duration"
          echo "- browser smoke duration: ${duration}s" >> "$GITHUB_STEP_SUMMARY"
          if (( duration > 10 )); then echo "::warning title=Slow staging smoke step::browser smoke took ${duration}s"; fi
          if (( exit_code != 0 )); then exit "$exit_code"; fi
          if (( summary_exit_code != 0 )); then exit "$summary_exit_code"; fi

      - name: Verify secret redaction and staging-only output
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readdir, readFile } from "node:fs/promises";
          const secret = process.env.STAGING_STUDENT_PASSWORD;
          if (!secret) throw new Error("STAGING_STUDENT_PASSWORD is not configured");
          for (const name of await readdir(".", { withFileTypes: false })) {
            if (!name.endsWith("summary.json")) continue;
            const contents = await readFile(name, "utf8");
            if (contents.includes(secret)) throw new Error(`secret found in ${name}`);
          }
          console.log("secret-redaction=PASS");
          console.log("productionTouched=NO");
          NODE

      - name: Publish sanitized summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Fast staging pilot smoke"
            echo "- health: /health /health/db /ready = 200"
            echo "- Full E2E: NOT RUN"
            echo "- production touched: NO"
            for file in staging-pilot-smoke-summary.json; do
              if test -f "$file"; then
                SUMMARY_FILE="$file" node --input-type=module - <<'NODE'
          import { readFileSync } from "node:fs";
          const result = JSON.parse(readFileSync(process.env.SUMMARY_FILE, "utf8"));
          for (const [key, value] of Object.entries(result)) {
            console.log(`- ${key}: ${typeof value === "object" ? JSON.stringify(value) : value}`);
          }
          NODE
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-pilot-smoke-summary
          path: staging-pilot-smoke-summary.json
          if-no-files-found: warn
          retention-days: 7
