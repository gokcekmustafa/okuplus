name: Staging migration recovery audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-migration-recovery-audit
  cancel-in-progress: false

jobs:
  staging-migration-recovery-audit:
    name: Audit staging migration state (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      APP_ENV: staging
      NODE_ENV: test
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DB_FINGERPRINT_DATABASE_URL: ${{ secrets.DB_FINGERPRINT_DATABASE_URL }}
      DB_FINGERPRINT_ENVIRONMENT: ${{ vars.DB_FINGERPRINT_ENVIRONMENT }}
      DB_FINGERPRINT_APPROVED_TARGET_FINGERPRINT: ${{ vars.DB_FINGERPRINT_APPROVED_TARGET_FINGERPRINT }}
    steps:
      - name: Verify workflow ref
        shell: bash
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$WORKFLOW_REF" = "refs/heads/master"

      - name: Checkout audit code from master
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Verify staging fingerprint (read-only)
        shell: bash
        run: |
          set -euo pipefail
          test "$APP_ENV" = "staging"
          test "$NODE_ENV" = "test"
          test "$DB_FINGERPRINT_ENVIRONMENT" = "STAGING"
          test -n "$DATABASE_URL"
          test -n "$DB_FINGERPRINT_DATABASE_URL"
          test -n "$DB_FINGERPRINT_APPROVED_TARGET_FINGERPRINT"

          fingerprint_output="$RUNNER_TEMP/staging-fingerprint.json"
          fingerprint_error="$RUNNER_TEMP/staging-fingerprint.err"
          if ! npx tsx scripts/db-fingerprint.ts >"$fingerprint_output" 2>"$fingerprint_error"; then
            echo "staging read-only fingerprint failed" >&2
            exit 1
          fi

          FINGERPRINT_OUTPUT="$fingerprint_output" \
            npx tsx scripts/staging-migration-recovery-audit.ts \
            >"$RUNNER_TEMP/staging-migration-recovery-audit.json"

      - name: Publish sanitized recovery audit summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          audit_output="$RUNNER_TEMP/staging-migration-recovery-audit.json"
          if test ! -f "$audit_output"; then
            echo "## Staging migration recovery audit" >> "$GITHUB_STEP_SUMMARY"
            echo "- status: NOT_AVAILABLE" >> "$GITHUB_STEP_SUMMARY"
            echo "- readOnlyAudit: FAIL" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          AUDIT_OUTPUT="$audit_output" node --input-type=module <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          import { readFileSync } from "node:fs";

          const report = JSON.parse(readFileSync(process.env.AUDIT_OUTPUT, "utf8"));
          const required = [
            "status",
            "targetEnvironment",
            "targetFingerprint",
            "fingerprintConfirmed",
            "enum",
            "migration",
            "migrationDefinition",
            "schemaEffectCheck",
            "safeToResolveApplied",
            "recoveryClass",
            "writeOperations",
            "productionTouched",
          ];
          for (const key of required) {
            if (!(key in report)) throw new Error(`audit output missing ${key}`);
          }

          console.log("## Staging migration recovery audit");
          console.log(`- status: ${report.status}`);
          console.log(`- targetEnvironment: ${report.targetEnvironment}`);
          console.log(`- targetFingerprint: ${report.targetFingerprint}`);
          console.log(`- fingerprintConfirmed: ${report.fingerprintConfirmed ? "YES" : "NO"}`);
          console.log(`- databaseIdentityMatch: ${report.databaseIdentityMatch ? "YES" : "NO"}`);
          console.log(`- enumType: ${report.enum.typeName}`);
          console.log(`- enumTypeExists: ${report.enum.typeExists ? "YES" : "NO"}`);
          console.log(`- enumLabel: ${report.enum.label}`);
          console.log(`- enumLabelPresent: ${report.enum.labelPresent ? "YES" : "NO"}`);
          console.log(`- migration: ${report.migration.name}`);
          console.log(`- migrationHistoryState: ${report.migration.state}`);
          console.log(`- migrationRecordExists: ${report.migration.exists ? "YES" : "NO"}`);
          console.log(`- appliedStepsCount: ${report.migration.appliedStepsCount ?? "NOT_AVAILABLE"}`);
          console.log(`- startedAt: ${report.migration.startedAt ?? "NOT_AVAILABLE"}`);
          console.log(`- finishedAt: ${report.migration.finishedAt ?? "NOT_AVAILABLE"}`);
          console.log(`- rolledBackAt: ${report.migration.rolledBackAt ?? "NOT_AVAILABLE"}`);
          console.log(`- logsPresent: ${report.migration.logsPresent ? "YES" : "NO"}`);
          console.log(`- errorStatus: ${report.migration.errorStatus}`);
          console.log(`- migrationDefinition: ${report.migrationDefinition.effect}`);
          console.log(`- otherSchemaEffects: ${report.migrationDefinition.otherSchemaEffects}`);
          console.log(`- schemaEffectCheck: ${report.schemaEffectCheck}`);
          console.log(`- safeToResolveApplied: ${report.safeToResolveApplied ? "YES" : "NO"}`);
          console.log(`- recoveryClass: ${report.recoveryClass}`);
          console.log(`- writeOperations: ${report.writeOperations}`);
          console.log(`- productionTouched: ${report.productionTouched}`);
          NODE
