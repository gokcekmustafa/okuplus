name: Manual production database migration

on:
  workflow_dispatch:
    inputs:
      confirm_migrate:
        description: "Type MIGRATE to allow the protected production migration step"
        required: true
        type: string
      seed_p0:
        description: "Explicitly select the Education V2 P0 production seed"
        required: true
        type: choice
        options:
          - none
          - education-v2-p0
        default: none
      seed_p1_a:
        description: "Explicitly select the Education V2 P1-A production curriculum seed"
        required: true
        type: choice
        options:
          - none
          - education-v2-p1-a
        default: none
      seed_p1_bcd:
        description: "Explicitly select the Education V2 P1-B/C/D production curriculum seed"
        required: true
        type: choice
        options:
          - none
          - education-v2-p1-bcd
        default: none
      education_v2_level_code:
        description: "Existing production Level.code required only for Education V2 P0"
        required: false
        type: string
        default: G8_12
      education_v2_production_release_id:
        description: "Approved immutable Education V2 P0 production release identifier"
        required: false
        type: string
      education_v2_production_approval:
        description: "Type I_HAVE_REVIEWED_EDUCATION_V2_P0_PRODUCTION_EDITORIAL_RELEASE only for the approved production seed"
        required: false
        type: string
      education_v2_p1_a_production_release_id:
        description: "Approved immutable Education V2 P1-A production release identifier"
        required: false
        type: string
      education_v2_p1_a_production_approval:
        description: "Type I_HAVE_REVIEWED_EDUCATION_V2_P1_A_PRODUCTION_EDITORIAL_RELEASE only for the approved P1-A seed"
        required: false
        type: string
      education_v2_p1_bcd_production_release_id:
        description: "Approved immutable Education V2 P1-B/C/D production release identifier"
        required: false
        type: string
      education_v2_p1_bcd_production_approval:
        description: "Type I_HAVE_REVIEWED_EDUCATION_V2_P1_BCD_PRODUCTION_EDITORIAL_RELEASE only for the approved production seed"
        required: false
        type: string
      production_backup_confirmation:
        description: "Confirm the approved production backup and rollback plan before any write"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-migration
  cancel-in-progress: false

jobs:
  production-migration:
    name: Apply production Prisma migrations
    runs-on: ubuntu-latest
    environment:
      name: production-migration
    timeout-minutes: 20
    env:
      APP_ENV: production
      NODE_ENV: production
      DB_FINGERPRINT_ENVIRONMENT: PRODUCTION
      PRODUCTION_DB_APPROVED_TARGET_FINGERPRINT: ${{ vars.PRODUCTION_DB_APPROVED_TARGET_FINGERPRINT }}
      PRODUCTION_DB_APPROVED_HISTORICAL_MIGRATION_CHECKSUMS: ${{ vars.PRODUCTION_DB_APPROVED_HISTORICAL_MIGRATION_CHECKSUMS }}

    steps:
      - name: Checkout selected master release
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Verify production migration gate
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          PRODUCTION_DB_APPROVED_TARGET_FINGERPRINT: ${{ vars.PRODUCTION_DB_APPROVED_TARGET_FINGERPRINT }}
          CONFIRM_MIGRATE: ${{ inputs.confirm_migrate }}
          SEED_P0: ${{ inputs.seed_p0 }}
          SEED_P1_A: ${{ inputs.seed_p1_a }}
          SEED_P1_BCD: ${{ inputs.seed_p1_bcd }}
          EDUCATION_V2_LEVEL_CODE: ${{ inputs.education_v2_level_code }}
          EDUCATION_V2_PRODUCTION_RELEASE_ID: ${{ inputs.education_v2_production_release_id }}
          EDUCATION_V2_PRODUCTION_APPROVAL: ${{ inputs.education_v2_production_approval }}
          EDUCATION_V2_P1_A_PRODUCTION_RELEASE_ID: ${{ inputs.education_v2_p1_a_production_release_id }}
          EDUCATION_V2_P1_A_PRODUCTION_APPROVAL: ${{ inputs.education_v2_p1_a_production_approval }}
          EDUCATION_V2_P1_BCD_PRODUCTION_RELEASE_ID: ${{ inputs.education_v2_p1_bcd_production_release_id }}
          EDUCATION_V2_P1_BCD_PRODUCTION_APPROVAL: ${{ inputs.education_v2_p1_bcd_production_approval }}
          PRODUCTION_BACKUP_CONFIRMATION: ${{ inputs.production_backup_confirmation }}
          PRODUCTION_DATABASE_NAME: ${{ vars.PRODUCTION_DATABASE_NAME }}
          PRODUCTION_DATABASE_HOST: ${{ vars.PRODUCTION_DATABASE_HOST }}
          COMMON_REINFORCEMENT_TEMPLATE_VERSION_ID: ${{ vars.EDUCATION_V2_COMMON_REINFORCEMENT_TEMPLATE_VERSION_ID }}
          COMMON_ASSESSMENT_ID: ${{ vars.EDUCATION_V2_COMMON_ASSESSMENT_ID }}
        shell: bash
        run: |
          set -euo pipefail

          test "${GITHUB_EVENT_NAME}" = "workflow_dispatch" || {
            echo "FAIL: workflow_dispatch is required"
            exit 1
          }
          test "${GITHUB_REF}" = "refs/heads/master" || {
            echo "FAIL: this job only accepts the master branch"
            exit 1
          }
          test "${APP_ENV}" = "production" || {
            echo "FAIL: APP_ENV must be production"
            exit 1
          }
          test "${NODE_ENV}" = "production" || {
            echo "FAIL: NODE_ENV must be production"
            exit 1
          }
          test "${CONFIRM_MIGRATE}" = "MIGRATE" || {
            echo "FAIL: explicit MIGRATE confirmation is required"
            exit 1
          }
          test "${PRODUCTION_BACKUP_CONFIRMATION}" = "I_HAVE_VERIFIED_PRODUCTION_BACKUP_AND_ROLLBACK" || {
            echo "FAIL: approved production backup and rollback confirmation is required"
            exit 1
          }
          test -n "${PRODUCTION_DATABASE_URL}" || {
            echo "FAIL: production database secret is missing"
            exit 1
          }
          [[ "${PRODUCTION_DB_APPROVED_TARGET_FINGERPRINT}" =~ ^[0-9a-fA-F]{64}$ ]] || {
            echo "FAIL: approved production database fingerprint is missing or invalid"
            exit 1
          }
          test "${SEED_P0}" = "none" || test "${SEED_P0}" = "education-v2-p0" || {
            echo "FAIL: unsupported production seed selection"
            exit 1
          }
          test "${SEED_P1_A}" = "none" || test "${SEED_P1_A}" = "education-v2-p1-a" || {
            echo "FAIL: unsupported production seed selection"
            exit 1
          }
          test "${SEED_P1_BCD}" = "none" || test "${SEED_P1_BCD}" = "education-v2-p1-bcd" || {
            echo "FAIL: unsupported production seed selection"
            exit 1
          }
          if [ "${SEED_P0}" = "education-v2-p0" ]; then
            test -n "${EDUCATION_V2_LEVEL_CODE}" || { echo "FAIL: Education V2 Level.code is missing"; exit 1; }
            test -n "${EDUCATION_V2_PRODUCTION_RELEASE_ID}" || { echo "FAIL: Education V2 production release identifier is missing"; exit 1; }
            test -n "${PRODUCTION_DATABASE_NAME}" || { echo "FAIL: production database name variable is missing"; exit 1; }
            test -n "${PRODUCTION_DATABASE_HOST}" || { echo "FAIL: production database host variable is missing"; exit 1; }
            test -n "${COMMON_REINFORCEMENT_TEMPLATE_VERSION_ID}" || { echo "FAIL: approved common reinforcement template variable is missing"; exit 1; }
            test -n "${COMMON_ASSESSMENT_ID}" || { echo "FAIL: approved common assessment variable is missing"; exit 1; }
            test "${EDUCATION_V2_PRODUCTION_APPROVAL}" = "I_HAVE_REVIEWED_EDUCATION_V2_P0_PRODUCTION_EDITORIAL_RELEASE" || {
              echo "FAIL: explicit Education V2 production editorial approval is required"
              exit 1
            }
          fi
          if [ "${SEED_P1_A}" = "education-v2-p1-a" ]; then
            test -n "${EDUCATION_V2_P1_A_PRODUCTION_RELEASE_ID}" || { echo "FAIL: P1-A production release identifier is missing"; exit 1; }
            test -n "${PRODUCTION_DATABASE_NAME}" || { echo "FAIL: production database name variable is missing"; exit 1; }
            test -n "${PRODUCTION_DATABASE_HOST}" || { echo "FAIL: production database host variable is missing"; exit 1; }
            test "${EDUCATION_V2_P1_A_PRODUCTION_APPROVAL}" = "I_HAVE_REVIEWED_EDUCATION_V2_P1_A_PRODUCTION_EDITORIAL_RELEASE" || {
              echo "FAIL: explicit Education V2 P1-A production editorial approval is required"
              exit 1
            }
          fi
          if [ "${SEED_P1_BCD}" = "education-v2-p1-bcd" ]; then
            test -n "${EDUCATION_V2_P1_BCD_PRODUCTION_RELEASE_ID}" || { echo "FAIL: P1-B/C/D production release identifier is missing"; exit 1; }
            test -n "${PRODUCTION_DATABASE_NAME}" || { echo "FAIL: production database name variable is missing"; exit 1; }
            test -n "${PRODUCTION_DATABASE_HOST}" || { echo "FAIL: production database host variable is missing"; exit 1; }
            test "${EDUCATION_V2_P1_BCD_PRODUCTION_APPROVAL}" = "I_HAVE_REVIEWED_EDUCATION_V2_P1_BCD_PRODUCTION_EDITORIAL_RELEASE" || {
              echo "FAIL: explicit Education V2 P1-B/C/D production editorial approval is required"
              exit 1
            }
          fi

          if git grep -n -i -E 'DROP[[:space:]]+(DATABASE|SCHEMA|TABLE)|TRUNCATE([[:space:]]|;)|DELETE[[:space:]]+FROM|ALTER[[:space:]]+TABLE[^;]*[[:space:]]DROP' -- \
            prisma/migrations/20260905090000_add_exercise_template_version_config/migration.sql \
            prisma/migrations/20260907150000_add_training_session_models/migration.sql \
            prisma/migrations/20260914100000_add_learning_experience_foundation/migration.sql \
            prisma/migrations/20260917120000_reconcile_release_0_6_schema/migration.sql \
            prisma/migrations/20260927100000_add_persistent_learning_path/migration.sql; then
            echo "FAIL: destructive SQL found in the production candidate migrations"
            exit 1
          fi
          echo "MIGRATION_SQL_SAFETY=PASS"

      - name: Verify production database identity and pre-migration state
        env:
          DB_FINGERPRINT_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          report="$(npx tsx scripts/db-fingerprint.ts)"
          read -r target_identity unresolved_failed_count <<EOF
          $(printf '%s' "${report}" | node -e '
            let input = "";
            process.stdin.on("data", (chunk) => { input += chunk; });
            process.stdin.on("end", () => {
              const value = JSON.parse(input);
              const failed = Array.isArray(value.migrations?.failed) ? value.migrations.failed : [];
              const unresolved = failed.filter((entry) => !entry?.rolledBack);
              process.stdout.write(`${value.targetIdentityFingerprint ?? ""} ${unresolved.length}`);
            });
          ')
          EOF
          test -n "${target_identity}" || { echo "FAIL: production identity was not returned"; exit 1; }
          test "${target_identity}" = "${PRODUCTION_DB_APPROVED_TARGET_FINGERPRINT}" || {
            echo "FAIL: production database identity does not match the approved target"
            exit 1
          }
          test "${unresolved_failed_count}" = "0" || {
            echo "FAIL: unresolved production migration exists"
            exit 1
          }
          echo "PRODUCTION_DB_IDENTITY=PASS"

      - name: Verify production migration history integrity
        env:
          DB_FINGERPRINT_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          PRODUCTION_DB_APPROVED_HISTORICAL_MIGRATION_CHECKSUMS: ${{ vars.PRODUCTION_DB_APPROVED_HISTORICAL_MIGRATION_CHECKSUMS }}
        shell: bash
        run: |
          set -euo pipefail
          report="$(npx tsx scripts/production-migration-forensics.ts)"
          read -r migrate_deploy_safe unresolved_count backfill_preflight_safe resolved_target_history <<EOF
          $(printf '%s' "${report}" | node -e '
            let input = "";
            process.stdin.on("data", (chunk) => { input += chunk; });
            process.stdin.on("end", () => {
              const value = JSON.parse(input);
              const failed = Array.isArray(value.failedMigrations) ? value.failedMigrations : [];
              const target = "20260907170000_add_gp_achievement_metadata";
              const targetHasAppliedRow = Array.isArray(value.migrationHistory)
                && value.migrationHistory.some((entry) => entry?.migrationName === target && entry?.state === "APPLIED");
              const resolvedTargetHistory = failed.length === 1
                && failed[0]?.migrationName === target
                && failed[0]?.state === "ROLLED_BACK"
                && targetHasAppliedRow
                && value.forwardFixRequired === false
                && value.schemaDrift === false;
              const migrationSafe = value.migrateDeploySafe || resolvedTargetHistory;
              process.stdout.write(`${migrationSafe ? "true" : "false"} ${value.unresolvedChecksumMismatches?.length ?? -1} ${value.releaseMigration1?.dataPreflight?.status === "PASS" ? "true" : "false"} ${resolvedTargetHistory ? "true" : "false"}`);
            });
          ')
          EOF
          test "${migrate_deploy_safe}" = "true" || {
            echo "FAIL: production migration history integrity is not approved"
            exit 1
          }
          test "${unresolved_count}" = "0" || {
            echo "FAIL: unresolved production migration checksum mismatch exists"
            exit 1
          }
          test "${backfill_preflight_safe}" = "true" || {
            echo "FAIL: migration 1 backfill data preflight requires review"
            exit 1
          }
          if [ "${resolved_target_history}" = "true" ]; then
            echo "PRODUCTION_MIGRATION_HISTORY=RESOLVED_TARGET_ROLLBACK_ACKNOWLEDGED"
          fi
          echo "PRODUCTION_MIGRATION_HISTORY_INTEGRITY=PASS"

      - name: Validate Prisma schema
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: npx prisma validate --schema=prisma/schema.prisma

      - name: Apply production migrations
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: npx prisma migrate deploy --schema=prisma/schema.prisma

      - name: Verify production migration status
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: npx prisma migrate status --schema=prisma/schema.prisma

      - name: Verify production database identity and post-migration state
        env:
          DB_FINGERPRINT_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          report="$(npx tsx scripts/db-fingerprint.ts)"
          read -r status pending_count unresolved_failed_count target_identity <<EOF
          $(printf '%s' "${report}" | node -e '
            let input = "";
            process.stdin.on("data", (chunk) => { input += chunk; });
            process.stdin.on("end", () => {
              const value = JSON.parse(input);
              const pending = Array.isArray(value.migrations?.pending) ? value.migrations.pending : [];
              const failed = Array.isArray(value.migrations?.failed) ? value.migrations.failed : [];
              const unresolved = failed.filter((entry) => !entry?.rolledBack);
              const effectiveStatus = pending.length === 0 && unresolved.length === 0 ? "PASS" : value.status ?? "";
              process.stdout.write(`${effectiveStatus} ${pending.length} ${unresolved.length} ${value.targetIdentityFingerprint ?? ""}`);
            });
          ')
          EOF
          test "${status}" = "PASS" || { echo "FAIL: production migration report is not PASS"; exit 1; }
          test "${pending_count}" = "0" || { echo "FAIL: pending production migrations remain"; exit 1; }
          test "${unresolved_failed_count}" = "0" || { echo "FAIL: unresolved production migrations remain"; exit 1; }
          test "${target_identity}" = "${PRODUCTION_DB_APPROVED_TARGET_FINGERPRINT}" || {
            echo "FAIL: production database identity changed unexpectedly"
            exit 1
          }
          echo "PRODUCTION_MIGRATIONS=CURRENT"
          echo "PRODUCTION_DB_IDENTITY_AFTER=PASS"

      - name: Seed Education V2 P0 production published content graph
        id: education-v2-content-seed
        if: ${{ inputs.seed_p0 == 'education-v2-p0' }}
        env:
          DB_FINGERPRINT_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          EDUCATION_V2_P0_ENVIRONMENT: PRODUCTION
          EDUCATION_V2_P0_PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          EDUCATION_V2_P0_PRODUCTION_DATABASE_NAME: ${{ vars.PRODUCTION_DATABASE_NAME }}
          EDUCATION_V2_P0_PRODUCTION_DATABASE_HOST: ${{ vars.PRODUCTION_DATABASE_HOST }}
          EDUCATION_V2_P0_PRODUCTION_RELEASE_ID: ${{ inputs.education_v2_production_release_id }}
          EDUCATION_V2_P0_PRODUCTION_APPROVAL: ${{ inputs.education_v2_production_approval }}
          EDUCATION_V2_P0_APPROVED_TARGET_FINGERPRINT: ${{ vars.PRODUCTION_DB_APPROVED_TARGET_FINGERPRINT }}
          EDUCATION_V2_P0_LEVEL_CODE: ${{ inputs.education_v2_level_code }}
        run: |
          set -euo pipefail
          test "$EDUCATION_V2_P0_ENVIRONMENT" = "PRODUCTION"
          test -n "$EDUCATION_V2_P0_PRODUCTION_DATABASE_URL"
          test -n "$EDUCATION_V2_P0_LEVEL_CODE"
          test "$EDUCATION_V2_P0_PRODUCTION_APPROVAL" = "I_HAVE_REVIEWED_EDUCATION_V2_P0_PRODUCTION_EDITORIAL_RELEASE"
          npx tsx scripts/seed-education-v2-p0.ts --dry-run --content-only
          npx tsx scripts/seed-education-v2-p0.ts --apply --content-only

      - name: Seed Education V2 P0 production academic lesson content
        id: education-v2-lesson-seed
        if: ${{ inputs.seed_p0 == 'education-v2-p0' }}
        env:
          DB_FINGERPRINT_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          EDUCATION_V2_P0_ENVIRONMENT: PRODUCTION
          EDUCATION_V2_P0_PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          EDUCATION_V2_P0_PRODUCTION_DATABASE_NAME: ${{ vars.PRODUCTION_DATABASE_NAME }}
          EDUCATION_V2_P0_PRODUCTION_DATABASE_HOST: ${{ vars.PRODUCTION_DATABASE_HOST }}
          EDUCATION_V2_P0_PRODUCTION_RELEASE_ID: ${{ inputs.education_v2_production_release_id }}
          EDUCATION_V2_P0_PRODUCTION_APPROVAL: ${{ inputs.education_v2_production_approval }}
          EDUCATION_V2_P0_APPROVED_TARGET_FINGERPRINT: ${{ vars.PRODUCTION_DB_APPROVED_TARGET_FINGERPRINT }}
          EDUCATION_V2_P0_LEVEL_CODE: ${{ inputs.education_v2_level_code }}
        run: |
          set -euo pipefail
          npx tsx scripts/seed-education-v2-p0-lessons.ts --dry-run
          npx tsx scripts/seed-education-v2-p0-lessons.ts --apply

      - name: Provision Education V2 P0 production persistent learning path
        id: education-v2-provision
        if: ${{ inputs.seed_p0 == 'education-v2-p0' }}
        env:
          DB_FINGERPRINT_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          EDUCATION_V2_P0_ENVIRONMENT: PRODUCTION
          EDUCATION_V2_P0_PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          EDUCATION_V2_P0_PRODUCTION_DATABASE_NAME: ${{ vars.PRODUCTION_DATABASE_NAME }}
          EDUCATION_V2_P0_PRODUCTION_DATABASE_HOST: ${{ vars.PRODUCTION_DATABASE_HOST }}
          EDUCATION_V2_P0_PRODUCTION_RELEASE_ID: ${{ inputs.education_v2_production_release_id }}
          EDUCATION_V2_P0_PRODUCTION_APPROVAL: ${{ inputs.education_v2_production_approval }}
          EDUCATION_V2_P0_APPROVED_TARGET_FINGERPRINT: ${{ vars.PRODUCTION_DB_APPROVED_TARGET_FINGERPRINT }}
          EDUCATION_V2_P0_LEVEL_CODE: ${{ inputs.education_v2_level_code }}
          EDUCATION_V2_COMMON_REINFORCEMENT_TEMPLATE_VERSION_ID: ${{ vars.EDUCATION_V2_COMMON_REINFORCEMENT_TEMPLATE_VERSION_ID }}
          EDUCATION_V2_COMMON_ASSESSMENT_ID: ${{ vars.EDUCATION_V2_COMMON_ASSESSMENT_ID }}
        run: |
          set -euo pipefail
          npx tsx scripts/provision-education-v2-p0-learning-path.ts --dry-run
          npx tsx scripts/provision-education-v2-p0-learning-path.ts --apply

      - name: Verify Education V2 P0 production postconditions
        id: education-v2-verify
        if: ${{ inputs.seed_p0 == 'education-v2-p0' }}
        env:
          DB_FINGERPRINT_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          EDUCATION_V2_P0_ENVIRONMENT: PRODUCTION
          EDUCATION_V2_P0_PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          EDUCATION_V2_P0_PRODUCTION_DATABASE_NAME: ${{ vars.PRODUCTION_DATABASE_NAME }}
          EDUCATION_V2_P0_PRODUCTION_DATABASE_HOST: ${{ vars.PRODUCTION_DATABASE_HOST }}
          EDUCATION_V2_P0_PRODUCTION_RELEASE_ID: ${{ inputs.education_v2_production_release_id }}
          EDUCATION_V2_P0_PRODUCTION_APPROVAL: ${{ inputs.education_v2_production_approval }}
          EDUCATION_V2_P0_APPROVED_TARGET_FINGERPRINT: ${{ vars.PRODUCTION_DB_APPROVED_TARGET_FINGERPRINT }}
          EDUCATION_V2_P0_LEVEL_CODE: ${{ inputs.education_v2_level_code }}
          EDUCATION_V2_COMMON_REINFORCEMENT_TEMPLATE_VERSION_ID: ${{ vars.EDUCATION_V2_COMMON_REINFORCEMENT_TEMPLATE_VERSION_ID }}
          EDUCATION_V2_COMMON_ASSESSMENT_ID: ${{ vars.EDUCATION_V2_COMMON_ASSESSMENT_ID }}
        run: |
          set -euo pipefail
          npx tsx scripts/seed-education-v2-p0.ts --dry-run --content-only
          npx tsx scripts/seed-education-v2-p0-lessons.ts --dry-run
          npx tsx scripts/provision-education-v2-p0-learning-path.ts --dry-run
          echo "EDUCATION_V2_P0_PRODUCTION_POSTCONDITIONS=PASS"

      - name: Provision Education V2 P1-A production curriculum
        id: education-v2-p1-a-seed
        if: ${{ inputs.seed_p1_a == 'education-v2-p1-a' }}
        env:
          DB_FINGERPRINT_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          EDUCATION_V2_P1_A_ENVIRONMENT: PRODUCTION
          EDUCATION_V2_P1_A_PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          EDUCATION_V2_P1_A_PRODUCTION_DATABASE_NAME: ${{ vars.PRODUCTION_DATABASE_NAME }}
          EDUCATION_V2_P1_A_PRODUCTION_DATABASE_HOST: ${{ vars.PRODUCTION_DATABASE_HOST }}
          EDUCATION_V2_P1_A_PRODUCTION_RELEASE_ID: ${{ inputs.education_v2_p1_a_production_release_id }}
          EDUCATION_V2_P1_A_PRODUCTION_APPROVAL: ${{ inputs.education_v2_p1_a_production_approval }}
          EDUCATION_V2_P1_A_APPROVED_TARGET_FINGERPRINT: ${{ vars.PRODUCTION_DB_APPROVED_TARGET_FINGERPRINT }}
        run: |
          set -euo pipefail
          npx tsx scripts/seed-education-v2-p1-a.ts --dry-run
          npx tsx scripts/seed-education-v2-p1-a.ts --apply

      - name: Verify Education V2 P1-A production postconditions
        id: education-v2-p1-a-verify
        if: ${{ inputs.seed_p1_a == 'education-v2-p1-a' }}
        env:
          DB_FINGERPRINT_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          EDUCATION_V2_P1_A_ENVIRONMENT: PRODUCTION
          EDUCATION_V2_P1_A_PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          EDUCATION_V2_P1_A_PRODUCTION_DATABASE_NAME: ${{ vars.PRODUCTION_DATABASE_NAME }}
          EDUCATION_V2_P1_A_PRODUCTION_DATABASE_HOST: ${{ vars.PRODUCTION_DATABASE_HOST }}
          EDUCATION_V2_P1_A_PRODUCTION_RELEASE_ID: ${{ inputs.education_v2_p1_a_production_release_id }}
          EDUCATION_V2_P1_A_PRODUCTION_APPROVAL: ${{ inputs.education_v2_p1_a_production_approval }}
          EDUCATION_V2_P1_A_APPROVED_TARGET_FINGERPRINT: ${{ vars.PRODUCTION_DB_APPROVED_TARGET_FINGERPRINT }}
        run: |
          set -euo pipefail
          npx tsx scripts/seed-education-v2-p1-a.ts --dry-run
          echo "EDUCATION_V2_P1_A_PRODUCTION_POSTCONDITIONS=PASS"

      - name: Provision Education V2 P1-B/C/D production curriculum
        id: education-v2-p1-bcd-seed
        if: ${{ inputs.seed_p1_bcd == 'education-v2-p1-bcd' }}
        env:
          DB_FINGERPRINT_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          EDUCATION_V2_P1_BCD_ENVIRONMENT: PRODUCTION
          EDUCATION_V2_P1_BCD_PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          EDUCATION_V2_P1_BCD_PRODUCTION_DATABASE_NAME: ${{ vars.PRODUCTION_DATABASE_NAME }}
          EDUCATION_V2_P1_BCD_PRODUCTION_DATABASE_HOST: ${{ vars.PRODUCTION_DATABASE_HOST }}
          EDUCATION_V2_P1_BCD_PRODUCTION_RELEASE_ID: ${{ inputs.education_v2_p1_bcd_production_release_id }}
          EDUCATION_V2_P1_BCD_PRODUCTION_APPROVAL: ${{ inputs.education_v2_p1_bcd_production_approval }}
          EDUCATION_V2_P1_BCD_APPROVED_TARGET_FINGERPRINT: ${{ vars.PRODUCTION_DB_APPROVED_TARGET_FINGERPRINT }}
        run: |
          set -euo pipefail
          npx tsx scripts/seed-education-v2-p1-bcd.ts --dry-run
          npx tsx scripts/seed-education-v2-p1-bcd.ts --apply

      - name: Verify Education V2 P1-B/C/D production postconditions
        id: education-v2-p1-bcd-verify
        if: ${{ inputs.seed_p1_bcd == 'education-v2-p1-bcd' }}
        env:
          DB_FINGERPRINT_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          EDUCATION_V2_P1_BCD_ENVIRONMENT: PRODUCTION
          EDUCATION_V2_P1_BCD_PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          EDUCATION_V2_P1_BCD_PRODUCTION_DATABASE_NAME: ${{ vars.PRODUCTION_DATABASE_NAME }}
          EDUCATION_V2_P1_BCD_PRODUCTION_DATABASE_HOST: ${{ vars.PRODUCTION_DATABASE_HOST }}
          EDUCATION_V2_P1_BCD_PRODUCTION_RELEASE_ID: ${{ inputs.education_v2_p1_bcd_production_release_id }}
          EDUCATION_V2_P1_BCD_PRODUCTION_APPROVAL: ${{ inputs.education_v2_p1_bcd_production_approval }}
          EDUCATION_V2_P1_BCD_APPROVED_TARGET_FINGERPRINT: ${{ vars.PRODUCTION_DB_APPROVED_TARGET_FINGERPRINT }}
        run: |
          set -euo pipefail
          npx tsx scripts/seed-education-v2-p1-bcd.ts --dry-run
          echo "EDUCATION_V2_P1_BCD_PRODUCTION_POSTCONDITIONS=PASS"

      - name: Migration summary
        if: always()
        env:
          P0_CONTENT_OUTCOME: ${{ steps.education-v2-content-seed.outcome }}
          P0_LESSON_OUTCOME: ${{ steps.education-v2-lesson-seed.outcome }}
          P0_PROVISION_OUTCOME: ${{ steps.education-v2-provision.outcome }}
          P0_VERIFY_OUTCOME: ${{ steps.education-v2-verify.outcome }}
          P1_A_SEED_OUTCOME: ${{ steps.education-v2-p1-a-seed.outcome }}
          P1_A_VERIFY_OUTCOME: ${{ steps.education-v2-p1-a-verify.outcome }}
          P1_BCD_SEED_OUTCOME: ${{ steps.education-v2-p1-bcd-seed.outcome }}
          P1_BCD_VERIFY_OUTCOME: ${{ steps.education-v2-p1-bcd-verify.outcome }}
        run: |
          echo "PRODUCTION_MIGRATION=PASS"
          echo "EDUCATION_V2_P0_CONTENT_SEED=${P0_CONTENT_OUTCOME:-NOT_RUN}"
          echo "EDUCATION_V2_P0_LESSON_SEED=${P0_LESSON_OUTCOME:-NOT_RUN}"
          echo "EDUCATION_V2_P0_PROVISION=${P0_PROVISION_OUTCOME:-NOT_RUN}"
          echo "EDUCATION_V2_P0_VERIFY=${P0_VERIFY_OUTCOME:-NOT_RUN}"
          echo "EDUCATION_V2_P1_A_SEED=${P1_A_SEED_OUTCOME:-NOT_RUN}"
          echo "EDUCATION_V2_P1_A_VERIFY=${P1_A_VERIFY_OUTCOME:-NOT_RUN}"
          echo "EDUCATION_V2_P1_BCD_SEED=${P1_BCD_SEED_OUTCOME:-NOT_RUN}"
          echo "EDUCATION_V2_P1_BCD_VERIFY=${P1_BCD_VERIFY_OUTCOME:-NOT_RUN}"
          echo "PRODUCTION_SMOKE=NOT_RUN"
