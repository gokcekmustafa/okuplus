name: Manual production targeted curriculum repair

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type APPLY_OKUPRATIK_SKILL_REPAIR_AND_P0_STATION9_V3"
        required: true
        type: string
      production_release_id:
        description: "Exact P0 station 9 v3 content fingerprint"
        required: true
        type: string
      production_release_commit:
        description: "Exact master commit selected for this operation"
        required: true
        type: string
      product_owner_approval:
        description: "Exact approval token bound to this release fingerprint and commit"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-targeted-curriculum-repair
  cancel-in-progress: false

jobs:
  repair:
    name: Add only verified ContentSkill pairs and release P0 station 9 v3
    runs-on: ubuntu-latest
    environment:
      name: production-migration
    timeout-minutes: 20
    env:
      APP_ENV: production
      NODE_ENV: production
      DB_FINGERPRINT_ENVIRONMENT: PRODUCTION
      PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      DB_FINGERPRINT_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      PRODUCTION_DB_APPROVED_TARGET_FINGERPRINT: ${{ vars.PRODUCTION_DB_APPROVED_TARGET_FINGERPRINT }}
      PRODUCTION_DB_APPROVED_PROVIDER: ${{ vars.PRODUCTION_DB_APPROVED_PROVIDER }}
      PRODUCTION_DB_APPROVED_HOST: ${{ vars.PRODUCTION_DB_APPROVED_HOST }}
      PRODUCTION_DB_APPROVED_PORT: ${{ vars.PRODUCTION_DB_APPROVED_PORT }}
      PRODUCTION_DB_APPROVED_DATABASE: ${{ vars.PRODUCTION_DB_APPROVED_DATABASE }}
      PRODUCTION_DB_APPROVED_USER: ${{ vars.PRODUCTION_DB_APPROVED_USER }}
      PRODUCTION_CURRICULUM_REPAIR_CONFIRMATION: ${{ inputs.confirmation }}
      PRODUCTION_CURRICULUM_REPAIR_RELEASE_ID: ${{ inputs.production_release_id }}
      PRODUCTION_CURRICULUM_REPAIR_COMMIT: ${{ inputs.production_release_commit }}
      PRODUCTION_CURRICULUM_REPAIR_OWNER_APPROVAL: ${{ inputs.product_owner_approval }}
      PRODUCTION_CURRICULUM_REPAIR_REPORT_PATH: ${{ runner.temp }}/production-curriculum-repair.json

    steps:
      - name: Checkout exact master revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify protected dispatch and scoped approval
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = "workflow_dispatch"
          test "${GITHUB_REF}" = "refs/heads/master"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "${APP_ENV}" = "production"
          test "${NODE_ENV}" = "production"
          test "${DB_FINGERPRINT_ENVIRONMENT}" = "PRODUCTION"
          test "${PRODUCTION_CURRICULUM_REPAIR_COMMIT}" = "${GITHUB_SHA}"
          test "${PRODUCTION_CURRICULUM_REPAIR_CONFIRMATION}" = "APPLY_OKUPRATIK_SKILL_REPAIR_AND_P0_STATION9_V3"
          test -n "${PRODUCTION_DATABASE_URL}"
          test -n "${PRODUCTION_DB_APPROVED_PROVIDER}"
          test -n "${PRODUCTION_DB_APPROVED_HOST}"
          test -n "${PRODUCTION_DB_APPROVED_PORT}"
          test -n "${PRODUCTION_DB_APPROVED_DATABASE}"
          test -n "${PRODUCTION_DB_APPROVED_USER}"
          [[ "${PRODUCTION_DB_APPROVED_TARGET_FINGERPRINT}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${PRODUCTION_CURRICULUM_REPAIR_RELEASE_ID}" =~ ^[0-9a-f]{64}$ ]]
          echo "SOURCE_COMMIT=${GITHUB_SHA}" >> "${GITHUB_STEP_SUMMARY}"
          echo "DATABASE_MIGRATIONS=NOT_RUN" >> "${GITHUB_STEP_SUMMARY}"
          echo "STUDENT_PROGRESS_AND_ANSWERS=NOT_TOUCHED" >> "${GITHUB_STEP_SUMMARY}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: npm

      - name: Install locked dependencies and generate Prisma client
        run: |
          npm ci --include=dev
          npx --no-install prisma generate --schema=prisma/schema.prisma

      - name: Verify release fingerprint and owner approval
        shell: bash
        run: |
          set -euo pipefail
          expected_release="$(npx --no-install tsx -e 'import { p0Station9V3ReleaseFingerprint } from "./src/curriculum/p0-station9-question-release.js"; process.stdout.write(p0Station9V3ReleaseFingerprint())')"
          test "${expected_release}" = "${PRODUCTION_CURRICULUM_REPAIR_RELEASE_ID}"
          expected_approval="$(npx --no-install tsx -e 'import { p0Station9OwnerApprovalToken } from "./src/curriculum/p0-station9-question-release.js"; process.stdout.write(p0Station9OwnerApprovalToken(process.env.GITHUB_SHA ?? ""))')"
          test "${expected_approval}" = "${PRODUCTION_CURRICULUM_REPAIR_OWNER_APPROVAL}"
          echo "P0_STATION9_RELEASE_FINGERPRINT=PASS" >> "${GITHUB_STEP_SUMMARY}"
          echo "PRODUCT_OWNER_APPROVAL=PASS_FOR_STATION_9_V3_ONLY" >> "${GITHUB_STEP_SUMMARY}"

      - name: Apply one atomic, source-verified production transaction
        run: npx --no-install tsx scripts/repair-production-content-skills-and-p0-station9.ts

      - name: Upload sanitized operation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-targeted-curriculum-repair
          path: ${{ runner.temp }}/production-curriculum-repair.json
          if-no-files-found: ignore
