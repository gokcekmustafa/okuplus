name: Manual production A-D learning route audit (read-only)

on:
  workflow_dispatch:
    inputs:
      confirm_audit:
        description: "Type LEARNING_ROUTE_AUDIT to run the protected read-only audit"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-learning-route-audit
  cancel-in-progress: false

jobs:
  production-learning-route-audit:
    name: Audit production A/B/C/D learning route graphs
    runs-on: ubuntu-latest
    environment:
      name: production-migration
    timeout-minutes: 30
    env:
      APP_ENV: production
      NODE_ENV: production
      DB_FINGERPRINT_ENVIRONMENT: PRODUCTION
      PRODUCTION_DB_APPROVED_TARGET_FINGERPRINT: ${{ vars.PRODUCTION_DB_APPROVED_TARGET_FINGERPRINT }}
      PRODUCTION_DB_APPROVED_PROVIDER: ${{ vars.PRODUCTION_DB_APPROVED_PROVIDER }}
      PRODUCTION_DB_APPROVED_HOST: ${{ vars.PRODUCTION_DB_APPROVED_HOST }}
      PRODUCTION_DB_APPROVED_PORT: ${{ vars.PRODUCTION_DB_APPROVED_PORT }}
      PRODUCTION_DB_APPROVED_DATABASE: ${{ vars.PRODUCTION_DB_APPROVED_DATABASE }}
      PRODUCTION_DB_APPROVED_USER: ${{ vars.PRODUCTION_DB_APPROVED_USER }}
      PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}

    steps:
      - name: Checkout audited master revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify audited source revision
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Verify protected read-only audit gate
        env:
          CONFIRM_AUDIT: ${{ inputs.confirm_audit }}
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = "workflow_dispatch"
          test "${GITHUB_REF}" = "refs/heads/master"
          test "${APP_ENV}" = "production"
          test "${NODE_ENV}" = "production"
          test "${CONFIRM_AUDIT}" = "LEARNING_ROUTE_AUDIT"
          test -n "${PRODUCTION_DATABASE_URL}"
          [[ "${PRODUCTION_DB_APPROVED_TARGET_FINGERPRINT}" =~ ^[0-9a-fA-F]{64}$ ]]
          test -n "${PRODUCTION_DB_APPROVED_PROVIDER}"
          test -n "${PRODUCTION_DB_APPROVED_HOST}"
          test -n "${PRODUCTION_DB_APPROVED_PORT}"
          test -n "${PRODUCTION_DB_APPROVED_DATABASE}"
          test -n "${PRODUCTION_DB_APPROVED_USER}"

      - name: Audit all production P1 route graphs in a read-only transaction
        shell: bash
        run: |
          set -euo pipefail
          set +e
          npx tsx scripts/audit-learning-routes-production.ts > production-learning-route-audit.json
          audit_exit_code=$?
          set -e
          cat production-learning-route-audit.json >> "${GITHUB_STEP_SUMMARY}"
          if [ "${audit_exit_code}" -ne 0 ]; then
            echo "Production route audit is blocked or found incomplete routes; no write was attempted."
            exit "${audit_exit_code}"
          fi

      - name: Upload sanitized route audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-learning-route-audit
          path: production-learning-route-audit.json
          if-no-files-found: error
