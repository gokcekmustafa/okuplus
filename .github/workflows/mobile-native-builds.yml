name: Mobile native builds

on:
  pull_request:
    paths:
      - "mobile/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/mobile-native-builds.yml"
  push:
    branches:
      - master
    paths:
      - "mobile/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/mobile-native-builds.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android debug, instrumentation-test, and release validation
    # android-emulator-runner has a reported boot hang on newer GitHub Linux runners.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36"

      - name: Install mobile dependencies
        run: npm ci --prefix mobile

      - name: Sync Capacitor web assets
        run: npm run sync --prefix mobile

      - name: Build Android debug APK, instrumentation test APK, and unsigned release bundle
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew assembleDebug assembleDebugAndroidTest bundleRelease --no-daemon --stacktrace --console=plain 2>&1 | tee "$RUNNER_TEMP/android-gradle.log"; then
            diagnostic="$(awk '/^\* What went wrong:/ { print; for (i = 0; i < 8; i++) { if (getline) print; else exit } }' "$RUNNER_TEMP/android-gradle.log" | head -n 9 | tr '\n' ' ' | sed -E 's#https?://[^[:space:]]+#\[URL\]#g; s#(password|token|secret)[=:][^[:space:]]+#\1=[REDACTED]#Ig')"
            if [ -z "$diagnostic" ]; then
              diagnostic="Gradle failed; detailed diagnostic section was unavailable."
            fi
            diagnostic="${diagnostic//'%'/'%25'}"
            diagnostic="${diagnostic//$'\r'/'%0D'}"
            diagnostic="${diagnostic//$'\n'/'%0A'}"
            echo "::error title=Android Gradle failure::$diagnostic"
            exit 1
          fi

      - name: Run Secure Storage instrumentation test on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 20
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: true
          emulator-boot-timeout: 180
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            ./mobile/android/gradlew -p mobile/android connectedDebugAndroidTest --no-daemon --console=plain

      - name: Locate generated Android debug APK
        id: debug-apk
        shell: bash
        run: |
          apk="$(find mobile/android/app/build/outputs -type f -name 'app-debug.apk' -print -quit 2>/dev/null || true)"
          if [ -z "$apk" ] || [ ! -s "$apk" ]; then
            echo "::error::Gradle completed but no non-empty app-debug.apk was found. Available APK outputs:"
            find mobile/android/app/build/outputs -type f -name '*.apk' -print 2>/dev/null || true
            exit 1
          fi
          printf 'path=%s\n' "$apk" >> "$GITHUB_OUTPUT"

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: okupratik-android-debug-${{ github.sha }}
          path: ${{ steps.debug-apk.outputs.path }}
          if-no-files-found: error

  ios:
    name: iOS simulator build
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm ci --prefix mobile

      - name: Sync Capacitor web assets
        run: npm run sync --prefix mobile

      - name: Build iOS simulator app
        run: |
          xcodebuild \
            -project mobile/ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath mobile/ios/build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build unsigned iOS release archive for validation
        run: |
          xcodebuild \
            -project mobile/ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath mobile/ios/build/Archive/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Upload iOS simulator app
        uses: actions/upload-artifact@v4
        with:
          name: okupratik-ios-simulator-${{ github.sha }}
          path: mobile/ios/build/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: error
