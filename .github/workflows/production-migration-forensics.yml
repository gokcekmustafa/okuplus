name: Manual production migration read-only forensics

on:
  workflow_dispatch:
    inputs:
      confirm_forensics:
        description: "Type FORENSICS to allow the protected read-only production history check"
        required: true
        type: string
      source_ref:
        description: "Approved source ref for the read-only forensics code"
        required: true
        default: master
        type: choice
        options:
          - master
          - codex/education-v2-p0-release-candidate

permissions:
  contents: read

concurrency:
  group: production-migration-forensics
  cancel-in-progress: false

jobs:
  production-migration-forensics:
    name: Read production migration history and schema
    runs-on: ubuntu-latest
    environment:
      name: production-migration
    timeout-minutes: 20
    env:
      APP_ENV: production
      NODE_ENV: production
      DB_FINGERPRINT_ENVIRONMENT: PRODUCTION
      PRODUCTION_DB_APPROVED_TARGET_FINGERPRINT: ${{ vars.PRODUCTION_DB_APPROVED_TARGET_FINGERPRINT }}
      PRODUCTION_DB_APPROVED_HISTORICAL_MIGRATION_CHECKSUMS: ${{ vars.PRODUCTION_DB_APPROVED_HISTORICAL_MIGRATION_CHECKSUMS }}

    steps:
      - name: Checkout selected approved release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Verify protected read-only forensic gate
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          CONFIRM_FORENSICS: ${{ inputs.confirm_forensics }}
          SOURCE_REF: ${{ inputs.source_ref }}
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = "workflow_dispatch"
          case "${SOURCE_REF}" in
            master|codex/education-v2-p0-release-candidate) ;;
            *)
              echo "FAIL: source ref is not approved for read-only forensics"
              exit 1
              ;;
          esac
          test "${GITHUB_REF}" = "refs/heads/${SOURCE_REF}"
          test "${APP_ENV}" = "production"
          test "${NODE_ENV}" = "production"
          test "${CONFIRM_FORENSICS}" = "FORENSICS"
          test -n "${PRODUCTION_DATABASE_URL}"
          [[ "${PRODUCTION_DB_APPROVED_TARGET_FINGERPRINT}" =~ ^[0-9a-fA-F]{64}$ ]]

      - name: Verify historical acknowledgement binding
        env:
          PRODUCTION_DB_APPROVED_HISTORICAL_MIGRATION_CHECKSUMS: ${{ vars.PRODUCTION_DB_APPROVED_HISTORICAL_MIGRATION_CHECKSUMS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${PRODUCTION_DB_APPROVED_HISTORICAL_MIGRATION_CHECKSUMS}" || {
            echo "FAIL: historical migration acknowledgement variable is missing"
            exit 1
          }
          node --input-type=module <<'NODE'
          const raw = process.env.PRODUCTION_DB_APPROVED_HISTORICAL_MIGRATION_CHECKSUMS?.trim();
          if (!raw) throw new Error("historical acknowledgement variable is missing");

          let parsed;
          try {
            parsed = JSON.parse(raw);
          } catch {
            throw new Error("historical acknowledgement variable must be valid JSON");
          }

          const migrationName = "20260817000000_init";
          if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) {
            throw new Error("historical acknowledgement variable must be a JSON object");
          }
          const keys = Object.keys(parsed);
          if (keys.length !== 1 || keys[0] !== migrationName) {
            throw new Error("historical acknowledgement migration scope is invalid");
          }
          if (
            typeof parsed[migrationName] !== "string" ||
            !/^[a-f0-9]{64}$/u.test(parsed[migrationName])
          ) {
            throw new Error("historical acknowledgement checksum shape is invalid");
          }
          NODE
          echo "HISTORICAL_ACK_BINDING=PASS"

      - name: Read production migration history and schema
        env:
          DB_FINGERPRINT_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          PRODUCTION_DB_APPROVED_HISTORICAL_MIGRATION_CHECKSUMS: ${{ vars.PRODUCTION_DB_APPROVED_HISTORICAL_MIGRATION_CHECKSUMS }}
          PRODUCTION_DB_APPROVED_PROVIDER: ${{ vars.PRODUCTION_DB_APPROVED_PROVIDER }}
          PRODUCTION_DB_APPROVED_HOST: ${{ vars.PRODUCTION_DB_APPROVED_HOST }}
          PRODUCTION_DB_APPROVED_PORT: ${{ vars.PRODUCTION_DB_APPROVED_PORT }}
          PRODUCTION_DB_APPROVED_DATABASE: ${{ vars.PRODUCTION_DB_APPROVED_DATABASE }}
          PRODUCTION_DB_APPROVED_USER: ${{ vars.PRODUCTION_DB_APPROVED_USER }}
        shell: bash
        run: |
          set -euo pipefail
          FORENSICS_OUTPUT_FILE="${RUNNER_TEMP}/production-migration-forensics.json"
          set +e
          npx tsx scripts/production-migration-forensics.ts > "${FORENSICS_OUTPUT_FILE}"
          FORENSICS_EXIT_CODE=$?

          node --input-type=module - "${FORENSICS_OUTPUT_FILE}" <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";

          const sourcePath = process.argv[2];
          const report = JSON.parse(readFileSync(sourcePath, "utf8"));
          const requiredFields = [
            "migrationHistoryCount",
            "migrationHistory",
            "failedMigrations",
            "rolledBackMigrations",
            "checksumMismatch",
            "repositoryOnlyMigrations",
            "productionOnlyMigrations",
            "schemaDrift",
            "partialSchemaState",
            "partialDataState",
            "releaseMigration1",
            "releaseMigration2",
            "remediationClass",
            "migrateDeploySafe",
            "resolveRequired",
            "forwardFixRequired",
            "schemaSummary",
            "migrationFileHistory",
            "initSchemaCompatibility",
            "targetIdentityMatch",
            "targetIdentityDiagnostics",
          ];

           for (const field of requiredFields) {
             if (!(field in report)) {
               throw new Error(`missing forensic output field: ${field}`);
             }
           }
           if (!report.releaseMigration1?.dataPreflight) {
             throw new Error("missing migration 1 data preflight output");
           }

          const identityStatuses = ["MATCH", "MISMATCH", "UNVERIFIED"];
          const identityDiagnostics = report.targetIdentityDiagnostics;
          if (
            typeof report.targetIdentityMatch !== "boolean" ||
            !identityDiagnostics?.actual ||
            !identityDiagnostics?.comparison ||
            !identityDiagnostics?.neon ||
            !["MATCH", "MISMATCH"].includes(identityDiagnostics.comparison.fingerprint)
          ) {
            throw new Error("invalid target identity diagnostics");
          }
          for (const field of ["provider", "host", "port", "database", "currentUser"]) {
            if (!identityStatuses.includes(identityDiagnostics.comparison[field])) {
              throw new Error(`invalid target identity status: ${field}`);
            }
          }

          const migrationSummary = (rows) => rows.map((row) => ({
            migrationName: row.migrationName,
            state: row.state,
            checksum: row.checksum,
            appliedStepsCount: row.appliedStepsCount,
            startedAt: row.startedAt,
            finishedAt: row.finishedAt,
            rolledBackAt: row.rolledBackAt,
          }));

          const schemaSummary = (schema) => ({
            columns: schema.columns.map(({ table_name, column_name, data_type, udt_name }) => ({
              table_name,
              column_name,
              data_type,
              udt_name,
            })),
            indexes: schema.indexes.map(({ tablename, indexname }) => ({ tablename, indexname })),
            constraints: schema.constraints.map(({ table_name, constraint_name, constraint_type, columns }) => ({
              table_name,
              constraint_name,
              constraint_type,
              columns,
            })),
            enums: schema.enums.map(({ type_name, enum_value }) => ({ type_name, enum_value })),
            policies: schema.policies.map(({ tablename, policyname, cmd }) => ({
              tablename,
              policyname,
              cmd,
            })),
          });

          const hex64 = (value, label) => {
            if (typeof value !== "string" || !/^[0-9a-f]{64}$/u.test(value)) {
              throw new Error(`invalid ${label}`);
            }
            return value;
          };

          const initMigration = report.migrationHistory.find(
            ({ migrationName }) => migrationName === "20260817000000_init",
          );
          if (!initMigration) {
            throw new Error("missing init migration history row");
          }

          const productionChecksum = hex64(
            initMigration.checksum,
            "production init migration checksum",
          );
          const repositoryChecksum = hex64(
            initMigration.repositoryChecksum,
            "repository init migration checksum",
          );
          const fileHistory = report.migrationFileHistory;
          if (
            fileHistory.path !== "prisma/migrations/20260817000000_init/migration.sql" ||
            (fileHistory.creationCommit !== null &&
              !/^[0-9a-f]{7,40}$/u.test(fileHistory.creationCommit)) ||
            !Number.isInteger(fileHistory.changeCommitCount) ||
            fileHistory.changeCommitCount < 0 ||
            !["YES", "NO", "UNKNOWN"].includes(fileHistory.contentChangedAfterCreation)
          ) {
            throw new Error("invalid init migration file history");
          }

          const initMigrationChecksumAudit = {
            migrationName: initMigration.migrationName,
            productionChecksum,
            repositoryChecksum,
            match: initMigration.checksumMatchesRepository ? "YES" : "NO",
            productionState: initMigration.state,
            startedAt: initMigration.startedAt,
            finishedAt: initMigration.finishedAt,
            rolledBackAt: initMigration.rolledBackAt,
            appliedStepsCount: initMigration.appliedStepsCount,
            migrationFileExists: initMigration.migrationFileExists,
          };

          const safe = {
            targetIdentityMatch: report.targetIdentityMatch ? "MATCH" : "MISMATCH",
            targetIdentityDiagnostics: {
              actual: identityDiagnostics.actual,
              comparison: identityDiagnostics.comparison,
              neon: identityDiagnostics.neon,
            },
            migrationHistoryCount: report.migrationHistoryCount,
            initMigrationChecksumAudit,
            migrationFileHistory: {
              path: fileHistory.path,
              creationCommit: fileHistory.creationCommit,
              changeCommitCount: fileHistory.changeCommitCount,
              contentChangedAfterCreation: fileHistory.contentChangedAfterCreation,
            },
            failedMigrations: migrationSummary(report.failedMigrations),
            rolledBackMigrations: migrationSummary(report.rolledBackMigrations),
            checksumMismatch: report.checksumMismatch,
            checksumMismatches: report.checksumMismatches,
            historicalChecksumAcknowledgements: report.historicalChecksumAcknowledgements,
            unresolvedChecksumMismatches: report.unresolvedChecksumMismatches,
            repositoryOnlyMigrations: report.repositoryOnlyMigrations,
            productionOnlyMigrations: report.productionOnlyMigrations,
            schemaDrift: report.schemaDrift,
            partialSchemaState: report.partialSchemaState,
            partialDataState: report.partialDataState,
            releaseMigration1: {
              history: report.releaseMigration1.history,
              schema: report.releaseMigration1.schema,
              dataState: report.releaseMigration1.dataState,
              partial: report.releaseMigration1.partial,
              dataPreflight: report.releaseMigration1.dataPreflight,
            },
            releaseMigration2: {
              history: report.releaseMigration2.history,
              schema: report.releaseMigration2.schema,
              partial: report.releaseMigration2.partial,
            },
            remediationClass: report.remediationClass,
            migrateDeploySafe: report.migrateDeploySafe,
            resolveRequired: report.resolveRequired,
            forwardFixRequired: report.forwardFixRequired,
            currentSchemaSummary: schemaSummary(report.schemaSummary),
            initSchemaCompatibility: report.initSchemaCompatibility,
          };

          const json = `${JSON.stringify(safe, null, 2)}\n`;
          writeFileSync("production-migration-forensics-summary.json", json, "utf8");

          const lines = [
            "## Production migration forensics",
            "",
            "**PRODUCTION_DB:** CONNECTED_READ_ONLY = YES",
            `**TARGET_IDENTITY:** ${safe.targetIdentityMatch}`,
            `**TARGET_IDENTITY_FIELDS:** ${JSON.stringify(safe.targetIdentityDiagnostics.comparison)}`,
            `**TARGET_IDENTITY_ACTUAL_MASKED:** ${JSON.stringify(safe.targetIdentityDiagnostics.actual)}`,
            `**NEON_METADATA:** ${JSON.stringify(safe.targetIdentityDiagnostics.neon)}`,
            "",
            `**MIGRATION_HISTORY_COUNT:** ${safe.migrationHistoryCount}`,
            `**FAILED_MIGRATIONS:** ${JSON.stringify(safe.failedMigrations)}`,
            `**ROLLED_BACK_MIGRATIONS:** ${JSON.stringify(safe.rolledBackMigrations)}`,
            `**CHECKSUM_MISMATCH:** ${safe.checksumMismatch}`,
            `**REPOSITORY_ONLY:** ${JSON.stringify(safe.repositoryOnlyMigrations)}`,
            `**PRODUCTION_ONLY:** ${JSON.stringify(safe.productionOnlyMigrations)}`,
            `**HISTORICAL_CHECKSUM_ACKNOWLEDGEMENTS:** ${JSON.stringify(safe.historicalChecksumAcknowledgements)}`,
            `**UNRESOLVED_CHECKSUM_MISMATCHES:** ${JSON.stringify(safe.unresolvedChecksumMismatches)}`,
            `**SCHEMA_DRIFT:** ${safe.schemaDrift}`,
            `**BACKFILL_TARGET_COUNT:** ${safe.releaseMigration1.dataPreflight.backfillTargetCount}`,
            `**ALREADY_CONFIGURED:** ${safe.releaseMigration1.dataPreflight.alreadyConfigured}`,
            `**MISSING_PARENT:** ${safe.releaseMigration1.dataPreflight.missingParent}`,
            `**PARENT_CONFIG_MISSING:** ${safe.releaseMigration1.dataPreflight.parentConfigMissing}`,
            `**DATA_PRECHECK:** ${safe.releaseMigration1.dataPreflight.status}`,
            `**PARTIAL_SCHEMA_STATE:** ${safe.partialSchemaState}`,
            `**PARTIAL_DATA_STATE:** ${safe.partialDataState}`,
            "",
            "**INIT_MIGRATION_CHECKSUM_AUDIT:**",
            `**MIGRATION:** ${safe.initMigrationChecksumAudit.migrationName}`,
            `**PRODUCTION_CHECKSUM:** ${safe.initMigrationChecksumAudit.productionChecksum}`,
            `**REPOSITORY_CHECKSUM:** ${safe.initMigrationChecksumAudit.repositoryChecksum}`,
            `**MATCH:** ${safe.initMigrationChecksumAudit.match}`,
            `**PRODUCTION_STATE:** ${safe.initMigrationChecksumAudit.productionState}`,
            `**APPLIED_STEPS:** ${safe.initMigrationChecksumAudit.appliedStepsCount}`,
            `**MIGRATION_FILE_EXISTS:** ${safe.initMigrationChecksumAudit.migrationFileExists}`,
            `**MIGRATION_FILE_HISTORY:** ${JSON.stringify(safe.migrationFileHistory)}`,
            `**CONTENT_CHANGED_AFTER_CREATION:** ${safe.migrationFileHistory.contentChangedAfterCreation}`,
            `**LINE_ENDING_FACTOR:** ${safe.historicalChecksumAcknowledgements.length > 0 && safe.historicalChecksumAcknowledgements.every(({ lineEndingEquivalent }) => lineEndingEquivalent) ? "YES" : "UNKNOWN"}`,
            `**SCHEMA_COMPATIBILITY:** ${safe.initSchemaCompatibility}`,
            `**CLASSIFICATION:** ${safe.remediationClass}`,
            `**MIGRATION_FILE_REWRITE_REQUIRED:** ${safe.migrationFileHistory.contentChangedAfterCreation === "NO" ? "NO" : "UNKNOWN"}`,
            "",
            "**RELEASE_MIGRATION_1:**",
            `- history_state: ${safe.releaseMigration1.history}`,
            `- schema_state: ${safe.releaseMigration1.schema.status}`,
            `- data_state: ${safe.releaseMigration1.dataState}`,
            `- partial: ${safe.releaseMigration1.partial}`,
            "",
            "**RELEASE_MIGRATION_2:**",
            `- history_state: ${safe.releaseMigration2.history}`,
            `- schema_state: ${safe.releaseMigration2.schema.status}`,
            `- partial: ${safe.releaseMigration2.partial}`,
            "",
            `**REMEDIATION_CLASS:** ${safe.remediationClass}`,
            `**MIGRATE_DEPLOY_SAFE:** ${safe.migrateDeploySafe}`,
            `**RESOLVE_REQUIRED:** ${safe.resolveRequired}`,
            `**FORWARD_FIX_REQUIRED:** ${safe.forwardFixRequired}`,
            "",
            "**CURRENT_SCHEMA_SUMMARY:**",
            "```json",
            JSON.stringify(safe.currentSchemaSummary, null, 2),
            "```",
          ];
          writeFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join("\n")}\n`, "utf8");
          if (safe.targetIdentityMatch !== "MATCH") {
            throw new Error("production target identity mismatch; see field-level diagnostic summary");
          }
          NODE
          SUMMARY_EXIT_CODE=$?
          set -e
          if [ "${FORENSICS_EXIT_CODE}" -ne 0 ] || [ "${SUMMARY_EXIT_CODE}" -ne 0 ]; then
            echo "Production forensics completed with a blocked or failed result; see the sanitized summary."
            exit 1
          fi

      - name: Upload sanitized forensic summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-migration-forensics-summary
          path: production-migration-forensics-summary.json
          if-no-files-found: error
