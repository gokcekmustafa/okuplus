name: Manual Education V2 P1-A Cycles 9–12 production provision

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "PLAN_ONLY is read-only; APPLY creates only missing Cycle 9–12 graphs after same-run PITR verification"
        required: true
        type: choice
        options:
          - PLAN_ONLY
          - APPLY
        default: PLAN_ONLY
      confirm_cycle9_12:
        description: "Type the exact operation confirmation for Cycles 9–12"
        required: true
        type: string
      production_release_id:
        description: "Exact content-addressed Cycle 9–12 release ID"
        required: true
        type: string
      production_release_commit:
        description: "Exact master commit selected for this run (must equal GITHUB_SHA)"
        required: true
        type: string
      production_editorial_approval:
        description: "For APPLY, exact product-owner approval containing release fingerprint and commit"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: production-education-v2-p1-a-cycle-9-12
  cancel-in-progress: false

jobs:
  provision-cycle-9-12:
    name: Plan or apply Education V2 P1-A Cycles 9–12 only
    runs-on: ubuntu-latest
    environment:
      name: production-migration
    timeout-minutes: 45
    env:
      APP_ENV: production
      NODE_ENV: production
      DB_FINGERPRINT_ENVIRONMENT: PRODUCTION
      EDUCATION_V2_P1_A_CYCLE_9_12_ENVIRONMENT: PRODUCTION
      PRODUCTION_DB_APPROVED_TARGET_FINGERPRINT: ${{ vars.PRODUCTION_DB_APPROVED_TARGET_FINGERPRINT }}
      PRODUCTION_DB_APPROVED_PROVIDER: ${{ vars.PRODUCTION_DB_APPROVED_PROVIDER }}
      PRODUCTION_DB_APPROVED_HOST: ${{ vars.PRODUCTION_DB_APPROVED_HOST }}
      PRODUCTION_DB_APPROVED_PORT: ${{ vars.PRODUCTION_DB_APPROVED_PORT }}
      PRODUCTION_DB_APPROVED_DATABASE: ${{ vars.PRODUCTION_DB_APPROVED_DATABASE }}
      PRODUCTION_DB_APPROVED_USER: ${{ vars.PRODUCTION_DB_APPROVED_USER }}
      PRODUCTION_DB_APPROVED_HISTORICAL_MIGRATION_CHECKSUMS: ${{ vars.PRODUCTION_DB_APPROVED_HISTORICAL_MIGRATION_CHECKSUMS }}
      EDUCATION_V2_P1_A_CYCLE_9_12_PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      DB_FINGERPRINT_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      EDUCATION_V2_P1_A_CYCLE_9_12_PRODUCTION_DATABASE_NAME: ${{ vars.PRODUCTION_DB_APPROVED_DATABASE }}
      EDUCATION_V2_P1_A_CYCLE_9_12_PRODUCTION_DATABASE_HOST: ${{ vars.PRODUCTION_DB_APPROVED_HOST }}
      EDUCATION_V2_P1_A_CYCLE_9_12_PRODUCTION_RELEASE_ID: ${{ inputs.production_release_id }}
      EDUCATION_V2_P1_A_CYCLE_9_12_PRODUCTION_RELEASE_COMMIT: ${{ inputs.production_release_commit }}
      EDUCATION_V2_P1_A_CYCLE_9_12_PRODUCTION_APPROVAL: ${{ inputs.production_editorial_approval }}
      EDUCATION_V2_P1_A_CYCLE_9_12_APPROVED_TARGET_FINGERPRINT: ${{ vars.PRODUCTION_DB_APPROVED_TARGET_FINGERPRINT }}
      CYCLE912_OPERATION: ${{ inputs.operation }}
      CYCLE912_GRAPH_SCOPE: CYCLES_9_TO_12
      CYCLE912_CONFIRMATION: ${{ inputs.confirm_cycle9_12 }}
      CYCLE912_RELEASE_ID: ${{ inputs.production_release_id }}
      CYCLE912_RELEASE_COMMIT: ${{ inputs.production_release_commit }}
      CYCLE912_PRODUCTION_APPROVAL: ${{ inputs.production_editorial_approval }}
      CYCLE912_PITR_EVIDENCE_PATH: cycle9-12-pitr-restore-evidence.json
      CYCLE_PITR_SCOPE: cycle9-12
      CYCLE_PITR_EVIDENCE_PATH: cycle9-12-pitr-restore-evidence.json

    steps:
      - name: Checkout selected master release
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Verify protected dispatch and immutable release approval
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "FAIL: $1" >&2; exit 1; }
          require_equal() { [[ "$2" == "$3" ]] || fail "$1"; }
          require_present() { [[ -n "$2" ]] || fail "$1"; }
          require_equal "workflow must be manually dispatched" "${GITHUB_EVENT_NAME}" "workflow_dispatch"
          require_equal "workflow ref must be master" "${GITHUB_REF}" "refs/heads/master"
          checked_out_commit="$(git rev-parse HEAD)"
          require_equal "checked-out commit must match the dispatched commit" "${checked_out_commit}" "${GITHUB_SHA}"
          require_equal "application environment must be production" "${APP_ENV}" "production"
          require_equal "node environment must be production" "${NODE_ENV}" "production"
          require_equal "database fingerprint environment must be production" "${DB_FINGERPRINT_ENVIRONMENT}" "PRODUCTION"
          require_equal "provisioner environment must be production" "${EDUCATION_V2_P1_A_CYCLE_9_12_ENVIRONMENT}" "PRODUCTION"
          require_present "production database secret is missing" "${EDUCATION_V2_P1_A_CYCLE_9_12_PRODUCTION_DATABASE_URL}"
          require_present "approved production database name is missing" "${EDUCATION_V2_P1_A_CYCLE_9_12_PRODUCTION_DATABASE_NAME}"
          require_present "approved production database host is missing" "${EDUCATION_V2_P1_A_CYCLE_9_12_PRODUCTION_DATABASE_HOST}"
          require_present "approved production provider is missing" "${PRODUCTION_DB_APPROVED_PROVIDER}"
          require_present "approved production port is missing" "${PRODUCTION_DB_APPROVED_PORT}"
          require_present "approved production database variable is missing" "${PRODUCTION_DB_APPROVED_DATABASE}"
          require_present "approved production database user variable is missing" "${PRODUCTION_DB_APPROVED_USER}"
          [[ "${PRODUCTION_DB_APPROVED_TARGET_FINGERPRINT}" =~ ^[0-9a-fA-F]{64}$ ]] || fail "approved production target fingerprint is missing or malformed"
          [[ "${CYCLE912_RELEASE_COMMIT}" =~ ^[0-9a-fA-F]{40}$ ]] || fail "selected release commit is not a full Git SHA"
          require_equal "selected release commit must match the dispatched commit" "${CYCLE912_RELEASE_COMMIT,,}" "${GITHUB_SHA,,}"
          if ! release_meta="$(npx --no-install tsx -e 'import { EDUCATION_V2_P1_A_CYCLE_9_12_RELEASE_ID, EDUCATION_V2_P1_A_CYCLE_9_12_RELEASE_FINGERPRINT } from "./src/curriculum/education-v2-p1-a-cycle-9-12-release.ts"; process.stdout.write(`${EDUCATION_V2_P1_A_CYCLE_9_12_RELEASE_ID} ${EDUCATION_V2_P1_A_CYCLE_9_12_RELEASE_FINGERPRINT}`)')"; then
            fail "could not calculate the immutable Cycle 9–12 release identity"
          fi
          read -r expected_release_id release_fingerprint <<< "${release_meta}"
          require_equal "submitted release ID does not match the current source fingerprint" "${CYCLE912_RELEASE_ID}" "${expected_release_id}"
          require_equal "provisioner release ID differs from the submitted release ID" "${EDUCATION_V2_P1_A_CYCLE_9_12_PRODUCTION_RELEASE_ID}" "${expected_release_id}"
          require_equal "graph scope must be exactly CYCLES_9_TO_12" "${CYCLE912_GRAPH_SCOPE}" "CYCLES_9_TO_12"
          case "${CYCLE912_OPERATION}" in
            PLAN_ONLY)
              require_equal "PLAN_ONLY confirmation text is invalid" "${CYCLE912_CONFIRMATION}" "PLAN_EDUCATION_V2_P1_A_CYCLES_9_TO_12"
              echo "BACKUP_RESTORE_EVIDENCE=NOT_REQUIRED_FOR_READ_ONLY_PLAN" >> "${GITHUB_STEP_SUMMARY}"
              ;;
            APPLY)
              require_equal "APPLY confirmation text is invalid" "${CYCLE912_CONFIRMATION}" "APPLY_EDUCATION_V2_P1_A_CYCLES_9_TO_12"
              expected_approval="I_HAVE_REVIEWED_EDUCATION_V2_P1_A_CYCLES_9_TO_12_PRODUCTION_RELEASE_${release_fingerprint^^}_AT_${GITHUB_SHA^^}"
              require_equal "product-owner approval does not match the current release and commit" "${CYCLE912_PRODUCTION_APPROVAL}" "${expected_approval}"
              if ! npx --no-install tsx -e 'import { EDUCATION_V2_P1_A_CYCLE_9_12_RELEASE_DECISIONS } from "./src/curriculum/education-v2-p1-a-cycle-9-12-release.ts"; if (EDUCATION_V2_P1_A_CYCLE_9_12_RELEASE_DECISIONS.length !== 4 || EDUCATION_V2_P1_A_CYCLE_9_12_RELEASE_DECISIONS.some((item) => item.status !== "OWNER_RELEASE_APPROVED" || item.explicitPublicationApproved !== true)) process.exit(1)'; then
                fail "all four Cycle 9–12 owner release decisions must be explicitly approved"
              fi
              echo "BACKUP_RESTORE_EVIDENCE=REQUIRED_FROM_SAME_RUN_PITR" >> "${GITHUB_STEP_SUMMARY}"
              ;;
            *) echo "FAIL: invalid operation"; exit 1 ;;
          esac
          echo "CYCLE912_RELEASE_ID=${expected_release_id}" >> "${GITHUB_STEP_SUMMARY}"
          echo "CYCLE912_RELEASE_COMMIT=${GITHUB_SHA}" >> "${GITHUB_STEP_SUMMARY}"
          echo "CYCLE912_GRAPH_SCOPE=${CYCLE912_GRAPH_SCOPE}" >> "${GITHUB_STEP_SUMMARY}"
          echo "CYCLE912_SELECTED_SEQUENCES=9 10 11 12" >> "${GITHUB_STEP_SUMMARY}"
          echo "PREVIOUS_72_STATIONS=NOT_TOUCHED" >> "${GITHUB_STEP_SUMMARY}"
          echo "STUDENT_ASSIGNMENTS_AND_PROGRESS=NOT_TOUCHED" >> "${GITHUB_STEP_SUMMARY}"
          echo "MIGRATIONS=NOT_RUN" >> "${GITHUB_STEP_SUMMARY}"

      - name: Revalidate production target and migration policy
        env:
          DB_FINGERPRINT_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          PRODUCTION_DB_APPROVED_HISTORICAL_MIGRATION_CHECKSUMS: ${{ vars.PRODUCTION_DB_APPROVED_HISTORICAL_MIGRATION_CHECKSUMS }}
        shell: bash
        run: |
          set -euo pipefail
          fingerprint_report="$(npx --no-install tsx scripts/db-fingerprint.ts)"
          read -r status target_identity <<EOF
          $(printf '%s' "${fingerprint_report}" | node --input-type=commonjs -e '
            let input = "";
            process.stdin.on("data", (chunk) => { input += chunk; });
            process.stdin.on("end", () => {
              const value = JSON.parse(input);
              process.stdout.write(`${value.status ?? ""} ${value.targetIdentityFingerprint ?? ""}`);
            });
          ')
          EOF
          if [ "${status}" = "PASS" ]; then
            echo "GENERAL_MIGRATION_FINGERPRINT=PASS" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "GENERAL_MIGRATION_FINGERPRINT=REVIEW_REQUIRED" >> "${GITHUB_STEP_SUMMARY}"
          fi
          test "${target_identity}" = "${PRODUCTION_DB_APPROVED_TARGET_FINGERPRINT}" || {
            echo "FAIL: production target fingerprint changed"
            exit 1
          }
          echo "PRODUCTION_TARGET_FINGERPRINT=PASS" >> "${GITHUB_STEP_SUMMARY}"
          migration_report_file="$RUNNER_TEMP/cycle9-12-production-migration-forensics.json"
          npx --no-install tsx scripts/production-migration-forensics.ts >"${migration_report_file}"
          cp "${migration_report_file}" cycle9-12-production-migration-forensics.json
          migration_gate_report_file="$RUNNER_TEMP/cycle9-12-migration-gate.json"
          MIGRATION_FORENSICS_REPORT_FILE="${migration_report_file}" \
          CYCLE912_OPERATION="${CYCLE912_OPERATION}" \
            npx --no-install tsx scripts/verify-cycle5-8-production-migration-gate.ts \
              >"${migration_gate_report_file}"
          cat "${migration_gate_report_file}" >> "${GITHUB_STEP_SUMMARY}"
          MIGRATION_GATE_REPORT="${migration_gate_report_file}" node --input-type=commonjs -e '
            const fs = require("node:fs");
            const report = JSON.parse(fs.readFileSync(process.env.MIGRATION_GATE_REPORT, "utf8"));
            if (report.operation === "PLAN_ONLY" && report.decision === "READ_ONLY_PLAN_ALLOWED") {
              console.log(`PLAN_ONLY_MIGRATION_POLICY=${report.migrationPolicyStatus}`);
              console.log(`PENDING_MIGRATIONS=${report.pendingMigrations.join(",") || "NONE"}`);
              console.log(`MIGRATION_POLICY_REASONS=${report.reasons.join(",") || "NONE"}`);
              if (report.migrationPolicyStatus === "REVIEW_REQUIRED") {
                fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
                  "\n**PLAN_ONLY note:** migration review is required; read-only curriculum planning continues. No write step is authorized.\n");
              }
            } else if (report.operation === "APPLY" && report.decision === "APPLY_PREFLIGHT_ALLOWED") {
              if (report.migrationPolicyStatus === "PASS" && report.graphOnlyExceptionApplied === false) {
                console.log("APPLY_PREFLIGHT=PASS");
                console.log("MIGRATIONS=NOT_RUN");
              } else if (report.migrationPolicyStatus === "REVIEW_REQUIRED" && report.graphOnlyExceptionApplied === true) {
                console.log("APPLY_PREFLIGHT=GRAPH_ONLY_WITH_HASH_PINNED_UNRELATED_MIGRATIONS");
                console.log(`PENDING_MIGRATIONS_NOT_RUN=${report.pendingMigrations.join(",")}`);
              } else {
                process.exit(1);
              }
            } else {
              process.exit(1);
            }
          '

      - name: Run read-only plan for Cycles 9–12
        shell: bash
        run: |
          set -euo pipefail
          for sequence in 9 10 11 12; do
            export CYCLE912_SEQUENCE="${sequence}"
            npx --no-install tsx scripts/seed-education-v2-p1-a-cycle-5-8.ts --dry-run >"cycle${sequence}-plan-before.json"
            node --input-type=commonjs -e '
              const fs = require("node:fs");
              const sequence = Number(process.env.CYCLE912_SEQUENCE);
              const report = JSON.parse(fs.readFileSync(`cycle${sequence}-plan-before.json`, "utf8"));
            const fail = (reason) => { console.error(`FAIL: Cycle ${sequence} ${reason}`); process.exit(1); };
            if (report.status !== "PASS") fail("read-only plan did not pass");
            if (report.dbChanged !== false) fail("plan reports a database change");
            if (report.immutableReleaseId !== process.env.CYCLE912_RELEASE_ID) fail("immutable release ID mismatch");
            if (report.expectedSourceCommit !== process.env.CYCLE912_RELEASE_COMMIT) fail("source commit mismatch");
            if (report.state === "CONFLICT") fail("graph state is CONFLICT; refusing to overwrite it");
            if (!["MISSING", "EXISTING", "SKILL_LINKS_MISSING"].includes(report.state)) fail("graph state is unrecognized; refusing to write");
            if (report.stepCount !== 5) fail("expected five learning steps");
            if (report.contentCount !== 5) fail("expected five content versions");
            if (report.exerciseCount !== 5) fail("expected five exercises");
            if (report.questionCount !== 15) fail("expected fifteen questions");
            if (report.assessmentCount !== 1) fail("expected one assessment");
            console.log(`CYCLE_${sequence}_GRAPH_STATE=${report.state}`);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `\nCYCLE_${sequence}_GRAPH_STATE=${report.state}\n`);
            '
            cat "cycle${sequence}-plan-before.json" >> "${GITHUB_STEP_SUMMARY}"
          done

      - name: Create and verify isolated Neon PITR restore evidence for Cycles 9–12
        if: ${{ inputs.operation == 'APPLY' }}
        env:
          NEON_MANAGEMENT_API_KEY: ${{ secrets.NEON_API_KEY }}
        shell: bash
        run: npx --no-install tsx scripts/production-cycle4-pitr-restore-evidence.ts

      - name: Enforce same-run Cycle 9–12 PITR evidence
        if: ${{ inputs.operation == 'APPLY' }}
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install tsx scripts/verify-cycle9-12-pitr-evidence.ts
          echo "PITR_RESTORE_EVIDENCE=PASS" >> "${GITHUB_STEP_SUMMARY}"

      - name: Store Cycle 9–12 PITR evidence before cleanup
        id: store-pitr-evidence
        if: ${{ inputs.operation == 'APPLY' }}
        uses: actions/upload-artifact@v4
        with:
          name: pitr-evidence-cycle9-12-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CYCLE_PITR_EVIDENCE_PATH }}
          if-no-files-found: error
          retention-days: 90

      - name: Delete only this run's verified Cycle 9–12 PITR branch
        if: ${{ inputs.operation == 'APPLY' && steps.store-pitr-evidence.outcome == 'success' }}
        env:
          NEON_MANAGEMENT_API_KEY: ${{ secrets.NEON_API_KEY }}
          PITR_EVIDENCE_ARTIFACT_URL: ${{ steps.store-pitr-evidence.outputs.artifact-url }}
        shell: bash
        run: npx --no-install tsx scripts/verified-cycle-pitr-branch-cleanup.ts

      - name: Apply only missing Cycle 9–12 graphs
        if: ${{ inputs.operation == 'APPLY' }}
        shell: bash
        run: |
          set -euo pipefail
          for sequence in 9 10 11 12; do
            export CYCLE912_SEQUENCE="${sequence}"
            npx --no-install tsx scripts/seed-education-v2-p1-a-cycle-5-8.ts --apply >"cycle${sequence}-apply.json"
            node --input-type=commonjs -e '
              const fs = require("node:fs");
              const sequence = Number(process.env.CYCLE912_SEQUENCE);
              const report = JSON.parse(fs.readFileSync(`cycle${sequence}-apply.json`, "utf8"));
              const fail = (reason) => { console.error(`FAIL: Cycle ${sequence} ${reason}`); process.exit(1); };
              if (report.status !== "PASS") fail("apply did not pass");
              if (!((report.dbChanged === true && ["MISSING", "SKILL_LINKS_REPAIRED"].includes(report.state)) ||
                    (report.dbChanged === false && report.state === "EXISTING"))) fail("graph neither created/repaired nor already present");
            '
            cat "cycle${sequence}-apply.json" >> "${GITHUB_STEP_SUMMARY}"
          done

      - name: Verify Cycle 9–12 graph postconditions
        if: ${{ inputs.operation == 'APPLY' }}
        shell: bash
        run: |
          set -euo pipefail
          for sequence in 9 10 11 12; do
            export CYCLE912_SEQUENCE="${sequence}"
            npx --no-install tsx scripts/seed-education-v2-p1-a-cycle-5-8.ts --dry-run >"cycle${sequence}-plan-after.json"
            node --input-type=commonjs -e '
              const fs = require("node:fs");
              const sequence = Number(process.env.CYCLE912_SEQUENCE);
              const report = JSON.parse(fs.readFileSync(`cycle${sequence}-plan-after.json`, "utf8"));
              const fail = (reason) => { console.error(`FAIL: Cycle ${sequence} ${reason}`); process.exit(1); };
              if (report.status !== "PASS") fail("post-apply read-only verification did not pass");
              if (report.dbChanged !== false) fail("post-apply verification reports a database change");
              if (report.state !== "EXISTING") fail("expected graph is not present after apply");
            '
            cat "cycle${sequence}-plan-after.json" >> "${GITHUB_STEP_SUMMARY}"
          done
          echo "CYCLE912_GRAPH_POSTCONDITION=EXISTING" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload sanitized Cycle 9–12 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-education-v2-p1-a-cycle-9-12
          path: |
            cycle9-12-*.json
            cycle9-*.json
            cycle10-*.json
            cycle11-*.json
            cycle12-*.json
          if-no-files-found: ignore
          retention-days: 7
