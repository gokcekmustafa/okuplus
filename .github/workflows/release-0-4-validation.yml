name: Release 0.4 isolated PostgreSQL validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "prisma/**"
      - "src/app.ts"
      - "src/lib/calendar.ts"
      - "src/modules/assessments/**"
      - "src/modules/entitlements/**"
      - "src/modules/gamification/**"
      - "src/modules/onboarding/**"
      - "src/modules/progress/**"
      - "src/modules/questions/**"
      - "src/modules/sessions/**"
      - "src/modules/student-learning/**"
      - "src/modules/templates/**"
      - "src/modules/training/**"
      - "test/**"
      - ".github/workflows/release-0-4-validation.yml"

permissions:
  contents: read

jobs:
  release-04-db:
    name: Disposable PostgreSQL release gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oku_plus_release_04
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d oku_plus_release_04"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      APP_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/oku_plus_release_04?schema=public
      PSQL_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/oku_plus_release_04
      RLS_TEST_DATABASE_URL: postgresql://oku_app:oku_app_pass@127.0.0.1:5432/oku_plus_release_04?schema=public&connection_limit=1
      JWT_SECRET: ci-release-04-only-not-for-deployment-9f31!xQ

    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Reject non-local database target
        shell: bash
        run: |
          node <<'NODE'
          const url = new URL(process.env.DATABASE_URL);
          const host = url.hostname.toLowerCase();
          const allowedHosts = new Set(['127.0.0.1', 'localhost']);
          const blocked = /neon\.tech|vercel|production|staging|supabase|amazonaws/i.test(host);
          if (!allowedHosts.has(host) || blocked || url.port !== '5432') {
            throw new Error('Release validation requires disposable localhost PostgreSQL');
          }
          console.log('DATABASE_TARGET=LOCAL_DISPOSABLE_POSTGRES');
          NODE

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Verify migration status and schema
        run: |
          npx prisma migrate status
          npx prisma validate --schema=prisma/schema.prisma
          npx prisma generate --schema=prisma/schema.prisma

      - name: Prepare non-superuser RLS role
        run: |
          psql "$PSQL_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            CREATE ROLE oku_app LOGIN PASSWORD 'oku_app_pass';
          EXCEPTION
            WHEN duplicate_object THEN NULL;
          END
          $$;
          GRANT CONNECT ON DATABASE oku_plus_release_04 TO oku_app;
          GRANT USAGE ON SCHEMA public TO oku_app;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO oku_app;
          GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA public TO oku_app;
          SQL

      - name: Run Release 0.4 database-backed validation
        run: >-
          npx vitest run
          test/student-learning.test.ts
          test/student-progress.test.ts
          test/individual-account.test.ts
          test/gamification.test.ts
          test/entitlements.test.ts
          test/attempt.test.ts
          test/exercise-session.test.ts
          test/training-daily-session.test.ts
          test/rls-security.test.ts
          test/student-dashboard-ui.test.ts
          --no-file-parallelism
          --maxWorkers=1
          --reporter=dot

      - name: Run full database-backed test suite
        run: npm test -- --no-file-parallelism --maxWorkers=1 --reporter=dot

      - name: Verify migration repeatability
        run: |
          npx prisma migrate deploy
          npx prisma migrate status

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Release-scope format check
        shell: bash
        run: |
          base="${GITHUB_BASE_SHA:-$(git merge-base HEAD origin/master)}"
          files="$(git diff --name-only "$base" "$GITHUB_SHA" -- '*.ts' '*.js' '*.json' '*.css' '*.html' '*.prisma' '*.sql' '*.yml' '*.yaml')"
          test -n "$files"
          # The repository-wide baseline has known formatting drift; only the
          # candidate diff is a release gate here.
          printf '%s\n' "$files" | xargs npx prettier --check --end-of-line crlf --ignore-unknown
