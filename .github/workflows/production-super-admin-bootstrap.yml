name: Manual production Super Admin bootstrap

on:
  workflow_dispatch:
    inputs:
      target_email:
        description: "The owner-approved email for the initial production Super Admin"
        required: true
        type: string
      confirm_bootstrap:
        description: "Type BOOTSTRAP_PRODUCTION_SUPER_ADMIN to allow the protected one-time bootstrap"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-super-admin-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Bootstrap production Super Admin
    runs-on: ubuntu-latest
    environment:
      name: production-migration
    timeout-minutes: 15
    env:
      APP_ENV: production
      NODE_ENV: production
      PRODUCTION_DB_APPROVED_TARGET_FINGERPRINT: ${{ vars.PRODUCTION_DB_APPROVED_TARGET_FINGERPRINT }}
      PRODUCTION_DB_APPROVED_PROVIDER: ${{ vars.PRODUCTION_DB_APPROVED_PROVIDER }}
      PRODUCTION_DB_APPROVED_HOST: ${{ vars.PRODUCTION_DB_APPROVED_HOST }}
      PRODUCTION_DB_APPROVED_PORT: ${{ vars.PRODUCTION_DB_APPROVED_PORT }}
      PRODUCTION_DB_APPROVED_DATABASE: ${{ vars.PRODUCTION_DB_APPROVED_DATABASE }}
      PRODUCTION_DB_APPROVED_USER: ${{ vars.PRODUCTION_DB_APPROVED_USER }}

    steps:
      - name: Checkout master only
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Verify protected bootstrap gate
        env:
          PRODUCTION_BOOTSTRAP_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          PRODUCTION_BOOTSTRAP_EMAIL: ${{ inputs.target_email }}
          PRODUCTION_BOOTSTRAP_PASSWORD: ${{ secrets.PRODUCTION_SUPER_ADMIN_BOOTSTRAP_PASSWORD }}
          PRODUCTION_BOOTSTRAP_CONFIRMATION: ${{ inputs.confirm_bootstrap }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/master"
          test "$APP_ENV" = "production"
          test "$NODE_ENV" = "production"
          test -n "$PRODUCTION_BOOTSTRAP_DATABASE_URL"
          test -n "$PRODUCTION_BOOTSTRAP_PASSWORD"
          npx tsx scripts/bootstrap-production-super-admin.ts
