name: Manual Education V2 P1-A Cycle 2 production provision

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Use PLAN_ONLY for a read-only live plan; APPLY requires all production gates"
        required: true
        type: choice
        options:
          - PLAN_ONLY
          - APPLY
        default: PLAN_ONLY
      confirm_cycle2:
        description: "Type PLAN_EDUCATION_V2_P1_A_CYCLE_V2 or APPLY_EDUCATION_V2_P1_A_CYCLE_V2"
        required: true
        type: string
      production_release_id:
        description: "Immutable approved Cycle 2 production release identifier"
        required: true
        type: string
      production_editorial_approval:
        description: "Type I_HAVE_REVIEWED_EDUCATION_V2_P1_A_CYCLE_V2_PRODUCTION_EDITORIAL_RELEASE"
        required: false
        type: string
      production_backup_confirmation:
        description: "PLAN_ONLY: READ_ONLY_NO_WRITE. APPLY: I_HAVE_VERIFIED_PRODUCTION_BACKUP_AND_ROLLBACK"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-education-v2-p1-a-cycle-v2
  cancel-in-progress: false

jobs:
  production-education-v2-p1-a-cycle-v2:
    name: Plan or apply Education V2 P1-A Cycle 2 only
    runs-on: ubuntu-latest
    environment:
      name: production-migration
    timeout-minutes: 20
    env:
      APP_ENV: production
      NODE_ENV: production
      DB_FINGERPRINT_ENVIRONMENT: PRODUCTION
      EDUCATION_V2_P1_A_CYCLE_V2_ENVIRONMENT: PRODUCTION
      PRODUCTION_DB_APPROVED_TARGET_FINGERPRINT: ${{ vars.PRODUCTION_DB_APPROVED_TARGET_FINGERPRINT }}
      PRODUCTION_DB_APPROVED_PROVIDER: ${{ vars.PRODUCTION_DB_APPROVED_PROVIDER }}
      PRODUCTION_DB_APPROVED_HOST: ${{ vars.PRODUCTION_DB_APPROVED_HOST }}
      PRODUCTION_DB_APPROVED_PORT: ${{ vars.PRODUCTION_DB_APPROVED_PORT }}
      PRODUCTION_DB_APPROVED_DATABASE: ${{ vars.PRODUCTION_DB_APPROVED_DATABASE }}
      PRODUCTION_DB_APPROVED_USER: ${{ vars.PRODUCTION_DB_APPROVED_USER }}
      PRODUCTION_DB_APPROVED_HISTORICAL_MIGRATION_CHECKSUMS: ${{ vars.PRODUCTION_DB_APPROVED_HISTORICAL_MIGRATION_CHECKSUMS }}
      EDUCATION_V2_P1_A_CYCLE_V2_PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      DB_FINGERPRINT_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      EDUCATION_V2_P1_A_CYCLE_V2_PRODUCTION_DATABASE_NAME: ${{ vars.PRODUCTION_DB_APPROVED_DATABASE }}
      EDUCATION_V2_P1_A_CYCLE_V2_PRODUCTION_DATABASE_HOST: ${{ vars.PRODUCTION_DB_APPROVED_HOST }}
      EDUCATION_V2_P1_A_CYCLE_V2_PRODUCTION_RELEASE_ID: ${{ inputs.production_release_id }}
      EDUCATION_V2_P1_A_CYCLE_V2_PRODUCTION_APPROVAL: ${{ inputs.production_editorial_approval }}
      EDUCATION_V2_P1_A_CYCLE_V2_APPROVED_TARGET_FINGERPRINT: ${{ vars.PRODUCTION_DB_APPROVED_TARGET_FINGERPRINT }}
      EDUCATION_V2_P1_A_CYCLE_V2_BACKUP_CONFIRMATION: ${{ inputs.production_backup_confirmation }}

    steps:
      - name: Checkout selected master release
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Verify Cycle 2 production gate
        env:
          CYCLE2_OPERATION: ${{ inputs.operation }}
          CYCLE2_CONFIRMATION: ${{ inputs.confirm_cycle2 }}
          CYCLE2_BACKUP_CONFIRMATION: ${{ inputs.production_backup_confirmation }}
          CYCLE2_EDITORIAL_APPROVAL: ${{ inputs.production_editorial_approval }}
          CYCLE2_RELEASE_ID: ${{ inputs.production_release_id }}
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = "workflow_dispatch"
          test "${GITHUB_REF}" = "refs/heads/master"
          test "${APP_ENV}" = "production"
          test "${NODE_ENV}" = "production"
          test "${DB_FINGERPRINT_ENVIRONMENT}" = "PRODUCTION"
          test "${EDUCATION_V2_P1_A_CYCLE_V2_ENVIRONMENT}" = "PRODUCTION"
          test -n "${EDUCATION_V2_P1_A_CYCLE_V2_PRODUCTION_DATABASE_URL}"
          test -n "${EDUCATION_V2_P1_A_CYCLE_V2_PRODUCTION_DATABASE_NAME}"
          test -n "${EDUCATION_V2_P1_A_CYCLE_V2_PRODUCTION_DATABASE_HOST}"
          test -n "${PRODUCTION_DB_APPROVED_PROVIDER}"
          test -n "${PRODUCTION_DB_APPROVED_PORT}"
          test -n "${PRODUCTION_DB_APPROVED_DATABASE}"
          test -n "${PRODUCTION_DB_APPROVED_USER}"
          test -n "${CYCLE2_RELEASE_ID}"
          [[ "${PRODUCTION_DB_APPROVED_TARGET_FINGERPRINT}" =~ ^[0-9a-fA-F]{64}$ ]]
          case "${CYCLE2_OPERATION}" in
            PLAN_ONLY)
              test "${CYCLE2_CONFIRMATION}" = "PLAN_EDUCATION_V2_P1_A_CYCLE_V2"
              test "${CYCLE2_BACKUP_CONFIRMATION}" = "READ_ONLY_NO_WRITE"
              echo "BACKUP_RESTORE_EVIDENCE=NOT_REQUIRED_FOR_READ_ONLY_PLAN" >> "${GITHUB_STEP_SUMMARY}"
              ;;
            APPLY)
              test "${CYCLE2_CONFIRMATION}" = "APPLY_EDUCATION_V2_P1_A_CYCLE_V2"
              test "${CYCLE2_EDITORIAL_APPROVAL}" = "I_HAVE_REVIEWED_EDUCATION_V2_P1_A_CYCLE_V2_PRODUCTION_EDITORIAL_RELEASE"
              test "${CYCLE2_BACKUP_CONFIRMATION}" = "I_HAVE_VERIFIED_PRODUCTION_BACKUP_AND_ROLLBACK"
              echo "BACKUP_RESTORE_EVIDENCE=OPERATOR_VERIFIED" >> "${GITHUB_STEP_SUMMARY}"
              ;;
            *)
              echo "FAIL: invalid Cycle 2 operation"
              exit 1
              ;;
          esac
          echo "CYCLE2_SCOPE=CANONICAL_GRAPH_ONLY" >> "${GITHUB_STEP_SUMMARY}"
          echo "STUDENT_ASSIGNMENTS=NOT_TOUCHED" >> "${GITHUB_STEP_SUMMARY}"
          echo "MIGRATIONS=NOT_RUN" >> "${GITHUB_STEP_SUMMARY}"

      - name: Revalidate production target before Cycle 2 plan
        env:
          DB_FINGERPRINT_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          PRODUCTION_DB_APPROVED_HISTORICAL_MIGRATION_CHECKSUMS: ${{ vars.PRODUCTION_DB_APPROVED_HISTORICAL_MIGRATION_CHECKSUMS }}
        shell: bash
        run: |
          set -euo pipefail
          fingerprint_report="$(npx --no-install tsx scripts/db-fingerprint.ts)"
          read -r status target_identity <<EOF
          $(printf '%s' "${fingerprint_report}" | node --input-type=commonjs -e '
            let input = "";
            process.stdin.on("data", (chunk) => { input += chunk; });
            process.stdin.on("end", () => {
              const value = JSON.parse(input);
              process.stdout.write(`${value.status ?? ""} ${value.targetIdentityFingerprint ?? ""}`);
            });
          ')
          EOF
          if [ "${status}" = "PASS" ]; then
            echo "GENERAL_MIGRATION_FINGERPRINT=PASS" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "GENERAL_MIGRATION_FINGERPRINT=REVIEW_REQUIRED; evaluating explicit migration policy"
            echo "GENERAL_MIGRATION_FINGERPRINT=REVIEW_REQUIRED" >> "${GITHUB_STEP_SUMMARY}"
          fi
          test "${target_identity}" = "${PRODUCTION_DB_APPROVED_TARGET_FINGERPRINT}" || {
            echo "FAIL: production target fingerprint changed"
            exit 1
          }
          echo "PRODUCTION_TARGET_FINGERPRINT=PASS" >> "${GITHUB_STEP_SUMMARY}"
          migration_report_file="$RUNNER_TEMP/cycle2-production-migration-forensics.json"
          npx --no-install tsx scripts/production-migration-forensics.ts >"${migration_report_file}"
          # Keep the read-only, already-sanitized forensics report available even
          # when the following migration policy gate blocks the run.
          cp "${migration_report_file}" cycle2-production-migration-forensics.json
          MIGRATION_FORENSICS_REPORT_FILE="${migration_report_file}" \
            npx --no-install tsx scripts/verify-canonical-placement-migration-policy.ts
          echo "PRODUCTION_MIGRATION_POLICY=PASS" >> "${GITHUB_STEP_SUMMARY}"

      - name: Run live read-only Cycle 2 plan
        env:
          CYCLE2_OPERATION: ${{ inputs.operation }}
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install tsx scripts/seed-education-v2-p1-a-cycle-v2.ts --dry-run \
            > cycle2-plan-before.json
          node --input-type=commonjs -e '
            const fs = require("node:fs");
            const report = JSON.parse(fs.readFileSync("cycle2-plan-before.json", "utf8"));
            if (report.status !== "PASS" || report.dbChanged !== false) process.exit(1);
            if (!["MISSING", "EXISTING"].includes(report.state)) process.exit(1);
          '
          cat cycle2-plan-before.json >> "${GITHUB_STEP_SUMMARY}"

      - name: Apply Cycle 2 graph only
        if: ${{ inputs.operation == 'APPLY' }}
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install tsx scripts/seed-education-v2-p1-a-cycle-v2.ts --apply \
            > cycle2-apply.json
          node --input-type=commonjs -e '
            const fs = require("node:fs");
            const report = JSON.parse(fs.readFileSync("cycle2-apply.json", "utf8"));
            if (report.status !== "PASS" || report.dbChanged !== true && report.state !== "EXISTING") process.exit(1);
          '
          cat cycle2-apply.json >> "${GITHUB_STEP_SUMMARY}"

      - name: Verify Cycle 2 graph postconditions
        if: ${{ inputs.operation == 'APPLY' }}
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install tsx scripts/seed-education-v2-p1-a-cycle-v2.ts --dry-run \
            > cycle2-plan-after.json
          node --input-type=commonjs -e '
            const fs = require("node:fs");
            const report = JSON.parse(fs.readFileSync("cycle2-plan-after.json", "utf8"));
            if (report.status !== "PASS" || report.dbChanged !== false || report.state !== "EXISTING") process.exit(1);
          '
          cat cycle2-plan-after.json >> "${GITHUB_STEP_SUMMARY}"
          echo "CYCLE2_GRAPH_POSTCONDITION=EXISTING" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload sanitized Cycle 2 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-education-v2-p1-a-cycle-v2
          path: cycle2-*.json
          if-no-files-found: ignore
