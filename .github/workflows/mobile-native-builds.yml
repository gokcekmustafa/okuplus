name: Mobile native builds

on:
  pull_request:
    paths:
      - "mobile/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/mobile-native-builds.yml"
  push:
    branches:
      - master
    paths:
      - "mobile/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/mobile-native-builds.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android debug, instrumentation-test, and release validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36"

      - name: Install mobile dependencies
        run: npm ci --prefix mobile

      - name: Sync Capacitor web assets
        run: npm run sync --prefix mobile

      - name: Build Android debug APK, instrumentation test APK, and unsigned release bundle
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleDebugAndroidTest bundleRelease --no-daemon --stacktrace

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: okupratik-android-debug-${{ github.sha }}
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ios:
    name: iOS simulator build
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm ci --prefix mobile

      - name: Sync Capacitor web assets
        run: npm run sync --prefix mobile

      - name: Build iOS simulator app
        run: |
          xcodebuild \
            -project mobile/ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath mobile/ios/build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build unsigned iOS release archive for validation
        run: |
          xcodebuild \
            -project mobile/ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath mobile/ios/build/Archive/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Upload iOS simulator app
        uses: actions/upload-artifact@v4
        with:
          name: okupratik-ios-simulator-${{ github.sha }}
          path: mobile/ios/build/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: error
