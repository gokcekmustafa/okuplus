name: Manual Education V2 P1-A Cycles 5–8 production provision

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "PLAN_ONLY is read-only; APPLY creates only the selected prepared cycle graphs after same-run PITR verification"
        required: true
        type: choice
        options:
          - PLAN_ONLY
          - APPLY
        default: PLAN_ONLY
      graph_scope:
        description: "Limit this run to the first new station cycle unless a wider release is explicitly selected"
        required: true
        type: choice
        options:
          - CYCLE_5_ONLY
          - CYCLES_5_TO_8
        default: CYCLE_5_ONLY
      confirm_cycle5_8:
        description: "Type the operation confirmation for the selected graph scope"
        required: true
        type: string
      production_release_id:
        description: "Exact content-addressed Cycle 5–8 release ID shown by the plan"
        required: true
        type: string
      production_release_commit:
        description: "Exact master commit selected for this run (must equal GITHUB_SHA)"
        required: true
        type: string
      production_editorial_approval:
        description: "For APPLY, type the exact product-owner approval containing release fingerprint and commit"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: production-education-v2-p1-a-cycle-5-8
  cancel-in-progress: false

jobs:
  provision-cycle-5-8:
    name: Plan or apply Education V2 P1-A Cycles 5–8 only
    runs-on: ubuntu-latest
    environment:
      name: production-migration
    timeout-minutes: 40
    env:
      APP_ENV: production
      NODE_ENV: production
      DB_FINGERPRINT_ENVIRONMENT: PRODUCTION
      EDUCATION_V2_P1_A_CYCLE_5_8_ENVIRONMENT: PRODUCTION
      PRODUCTION_DB_APPROVED_TARGET_FINGERPRINT: ${{ vars.PRODUCTION_DB_APPROVED_TARGET_FINGERPRINT }}
      PRODUCTION_DB_APPROVED_PROVIDER: ${{ vars.PRODUCTION_DB_APPROVED_PROVIDER }}
      PRODUCTION_DB_APPROVED_HOST: ${{ vars.PRODUCTION_DB_APPROVED_HOST }}
      PRODUCTION_DB_APPROVED_PORT: ${{ vars.PRODUCTION_DB_APPROVED_PORT }}
      PRODUCTION_DB_APPROVED_DATABASE: ${{ vars.PRODUCTION_DB_APPROVED_DATABASE }}
      PRODUCTION_DB_APPROVED_USER: ${{ vars.PRODUCTION_DB_APPROVED_USER }}
      PRODUCTION_DB_APPROVED_HISTORICAL_MIGRATION_CHECKSUMS: ${{ vars.PRODUCTION_DB_APPROVED_HISTORICAL_MIGRATION_CHECKSUMS }}
      EDUCATION_V2_P1_A_CYCLE_5_8_PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      DB_FINGERPRINT_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      EDUCATION_V2_P1_A_CYCLE_5_8_PRODUCTION_DATABASE_NAME: ${{ vars.PRODUCTION_DB_APPROVED_DATABASE }}
      EDUCATION_V2_P1_A_CYCLE_5_8_PRODUCTION_DATABASE_HOST: ${{ vars.PRODUCTION_DB_APPROVED_HOST }}
      EDUCATION_V2_P1_A_CYCLE_5_8_PRODUCTION_RELEASE_ID: ${{ inputs.production_release_id }}
      EDUCATION_V2_P1_A_CYCLE_5_8_PRODUCTION_RELEASE_COMMIT: ${{ inputs.production_release_commit }}
      EDUCATION_V2_P1_A_CYCLE_5_8_PRODUCTION_APPROVAL: ${{ inputs.production_editorial_approval }}
      EDUCATION_V2_P1_A_CYCLE_5_8_APPROVED_TARGET_FINGERPRINT: ${{ vars.PRODUCTION_DB_APPROVED_TARGET_FINGERPRINT }}
      CYCLE58_OPERATION: ${{ inputs.operation }}
      CYCLE58_GRAPH_SCOPE: ${{ inputs.graph_scope }}
      CYCLE58_CONFIRMATION: ${{ inputs.confirm_cycle5_8 }}
      CYCLE58_RELEASE_ID: ${{ inputs.production_release_id }}
      CYCLE58_RELEASE_COMMIT: ${{ inputs.production_release_commit }}
      CYCLE58_PRODUCTION_APPROVAL: ${{ inputs.production_editorial_approval }}
      CYCLE58_PITR_EVIDENCE_PATH: cycle5-8-pitr-restore-evidence.json
      CYCLE_PITR_SCOPE: cycle5-8
      CYCLE_PITR_EVIDENCE_PATH: cycle5-8-pitr-restore-evidence.json

    steps:
      - name: Checkout selected master release
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Verify protected dispatch and immutable release approval
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = "workflow_dispatch"
          test "${GITHUB_REF}" = "refs/heads/master"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "${APP_ENV}" = "production"
          test "${NODE_ENV}" = "production"
          test "${DB_FINGERPRINT_ENVIRONMENT}" = "PRODUCTION"
          test "${EDUCATION_V2_P1_A_CYCLE_5_8_ENVIRONMENT}" = "PRODUCTION"
          test -n "${EDUCATION_V2_P1_A_CYCLE_5_8_PRODUCTION_DATABASE_URL}"
          test -n "${EDUCATION_V2_P1_A_CYCLE_5_8_PRODUCTION_DATABASE_NAME}"
          test -n "${EDUCATION_V2_P1_A_CYCLE_5_8_PRODUCTION_DATABASE_HOST}"
          test -n "${PRODUCTION_DB_APPROVED_PROVIDER}"
          test -n "${PRODUCTION_DB_APPROVED_PORT}"
          test -n "${PRODUCTION_DB_APPROVED_DATABASE}"
          test -n "${PRODUCTION_DB_APPROVED_USER}"
          [[ "${PRODUCTION_DB_APPROVED_TARGET_FINGERPRINT}" =~ ^[0-9a-fA-F]{64}$ ]]
          [[ "${CYCLE58_RELEASE_COMMIT}" =~ ^[0-9a-fA-F]{40}$ ]]
          test "${CYCLE58_RELEASE_COMMIT,,}" = "${GITHUB_SHA,,}"
          case "${CYCLE58_GRAPH_SCOPE}" in
            CYCLE_5_ONLY)
              approval_scope="CYCLE_5"
              CYCLE58_SEQUENCES="5"
              echo "CYCLE58_SEQUENCES=${CYCLE58_SEQUENCES}" >> "${GITHUB_ENV}"
              ;;
            CYCLES_5_TO_8)
              approval_scope="CYCLE_5_8"
              CYCLE58_SEQUENCES="5 6 7 8"
              echo "CYCLE58_SEQUENCES=${CYCLE58_SEQUENCES}" >> "${GITHUB_ENV}"
              ;;
            *) echo "FAIL: invalid graph scope"; exit 1 ;;
          esac
          release_meta="$(npx --no-install tsx -e 'import { EDUCATION_V2_P1_A_CYCLE_5_8_RELEASE_ID, EDUCATION_V2_P1_A_CYCLE_5_8_RELEASE_FINGERPRINT } from "./src/curriculum/education-v2-p1-a-cycle-5-8-release.ts"; process.stdout.write(`${EDUCATION_V2_P1_A_CYCLE_5_8_RELEASE_ID} ${EDUCATION_V2_P1_A_CYCLE_5_8_RELEASE_FINGERPRINT}`)')"
          read -r expected_release_id release_fingerprint <<< "${release_meta}"
          test "${CYCLE58_RELEASE_ID}" = "${expected_release_id}"
          case "${CYCLE58_OPERATION}" in
            PLAN_ONLY)
              test "${CYCLE58_CONFIRMATION}" = "PLAN_EDUCATION_V2_P1_A_${approval_scope}"
              echo "BACKUP_RESTORE_EVIDENCE=NOT_REQUIRED_FOR_READ_ONLY_PLAN" >> "${GITHUB_STEP_SUMMARY}"
              ;;
            APPLY)
              test "${CYCLE58_CONFIRMATION}" = "APPLY_EDUCATION_V2_P1_A_${approval_scope}"
              expected_approval="I_HAVE_REVIEWED_EDUCATION_V2_P1_A_${approval_scope}_PRODUCTION_RELEASE_${release_fingerprint^^}_AT_${GITHUB_SHA^^}"
              test "${CYCLE58_PRODUCTION_APPROVAL}" = "${expected_approval}"
              echo "BACKUP_RESTORE_EVIDENCE=REQUIRED_FROM_SAME_RUN_PITR" >> "${GITHUB_STEP_SUMMARY}"
              ;;
            *) echo "FAIL: invalid operation"; exit 1 ;;
          esac
          echo "CYCLE58_RELEASE_ID=${expected_release_id}" >> "${GITHUB_STEP_SUMMARY}"
          echo "CYCLE58_RELEASE_COMMIT=${GITHUB_SHA}" >> "${GITHUB_STEP_SUMMARY}"
          echo "CYCLE58_GRAPH_SCOPE=${CYCLE58_GRAPH_SCOPE}" >> "${GITHUB_STEP_SUMMARY}"
          echo "CYCLE58_SELECTED_SEQUENCES=${CYCLE58_SEQUENCES}" >> "${GITHUB_STEP_SUMMARY}"
          echo "PREVIOUS_52_STATIONS=NOT_TOUCHED" >> "${GITHUB_STEP_SUMMARY}"
          echo "STUDENT_ASSIGNMENTS_AND_PROGRESS=NOT_TOUCHED" >> "${GITHUB_STEP_SUMMARY}"
          echo "MIGRATIONS=NOT_RUN" >> "${GITHUB_STEP_SUMMARY}"

      - name: Revalidate production target and migration policy
        env:
          DB_FINGERPRINT_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          PRODUCTION_DB_APPROVED_HISTORICAL_MIGRATION_CHECKSUMS: ${{ vars.PRODUCTION_DB_APPROVED_HISTORICAL_MIGRATION_CHECKSUMS }}
        shell: bash
        run: |
          set -euo pipefail
          fingerprint_report="$(npx --no-install tsx scripts/db-fingerprint.ts)"
          read -r status target_identity <<EOF
          $(printf '%s' "${fingerprint_report}" | node --input-type=commonjs -e '
            let input = "";
            process.stdin.on("data", (chunk) => { input += chunk; });
            process.stdin.on("end", () => {
              const value = JSON.parse(input);
              process.stdout.write(`${value.status ?? ""} ${value.targetIdentityFingerprint ?? ""}`);
            });
          ')
          EOF
          if [ "${status}" = "PASS" ]; then
            echo "GENERAL_MIGRATION_FINGERPRINT=PASS" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "GENERAL_MIGRATION_FINGERPRINT=REVIEW_REQUIRED; evaluating explicit migration policy"
            echo "GENERAL_MIGRATION_FINGERPRINT=REVIEW_REQUIRED" >> "${GITHUB_STEP_SUMMARY}"
          fi
          test "${target_identity}" = "${PRODUCTION_DB_APPROVED_TARGET_FINGERPRINT}" || {
            echo "FAIL: production target fingerprint changed"
            exit 1
          }
          echo "PRODUCTION_TARGET_FINGERPRINT=PASS" >> "${GITHUB_STEP_SUMMARY}"
          migration_report_file="$RUNNER_TEMP/cycle5-8-production-migration-forensics.json"
          npx --no-install tsx scripts/production-migration-forensics.ts >"${migration_report_file}"
          cp "${migration_report_file}" cycle5-8-production-migration-forensics.json
          migration_gate_report_file="$RUNNER_TEMP/cycle5-8-migration-gate.json"
          MIGRATION_FORENSICS_REPORT_FILE="${migration_report_file}" \
          CYCLE58_OPERATION="${CYCLE58_OPERATION}" \
            npx --no-install tsx scripts/verify-cycle5-8-production-migration-gate.ts \
              >"${migration_gate_report_file}"
          cat "${migration_gate_report_file}" >> "${GITHUB_STEP_SUMMARY}"
          MIGRATION_GATE_REPORT="${migration_gate_report_file}" node --input-type=commonjs -e '
            const fs = require("node:fs");
            const report = JSON.parse(fs.readFileSync(process.env.MIGRATION_GATE_REPORT, "utf8"));
            if (report.operation === "PLAN_ONLY" && report.decision === "READ_ONLY_PLAN_ALLOWED") {
              console.log(`PLAN_ONLY_MIGRATION_POLICY=${report.migrationPolicyStatus}`);
              console.log(`PENDING_MIGRATIONS=${report.pendingMigrations.join(",") || "NONE"}`);
              console.log(`MIGRATION_POLICY_REASONS=${report.reasons.join(",") || "NONE"}`);
              if (report.migrationPolicyStatus === "REVIEW_REQUIRED") {
                fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
                  "\n**PLAN_ONLY note:** migration review is required; read-only curriculum planning continues. No write step is authorized.\n");
              }
            } else if (report.operation === "APPLY" && report.decision === "APPLY_PREFLIGHT_ALLOWED") {
              if (report.migrationPolicyStatus === "PASS" && report.graphOnlyExceptionApplied === false) {
                console.log("APPLY_PREFLIGHT=PASS");
                console.log("MIGRATIONS=NOT_RUN");
              } else if (report.migrationPolicyStatus === "REVIEW_REQUIRED" && report.graphOnlyExceptionApplied === true) {
                console.log("APPLY_PREFLIGHT=GRAPH_ONLY_WITH_HASH_PINNED_UNRELATED_MIGRATIONS");
                console.log(`PENDING_MIGRATIONS_NOT_RUN=${report.pendingMigrations.join(",")}`);
              } else {
                process.exit(1);
              }
            } else {
              process.exit(1);
            }
          '
          if [ "${CYCLE58_OPERATION}" = "PLAN_ONLY" ]; then
            echo "PLAN_ONLY_MIGRATION_PREFLIGHT=READ_ONLY_CONTINUES; APPLY_REMAINS_BLOCKED_UNLESS_POLICY_AND_SAME_RUN_PITR_PASS" >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Run read-only plan for selected Cycle 5–8 graph scope
        shell: bash
        run: |
          set -euo pipefail
          read -r -a sequences <<< "${CYCLE58_SEQUENCES}"
          for sequence in "${sequences[@]}"; do
            export CYCLE58_SEQUENCE="${sequence}"
            npx --no-install tsx scripts/seed-education-v2-p1-a-cycle-5-8.ts --dry-run \
              > "cycle${sequence}-plan-before.json"
            node --input-type=commonjs -e '
              const fs = require("node:fs");
              const sequence = Number(process.env.CYCLE58_SEQUENCE);
              const report = JSON.parse(fs.readFileSync(`cycle${sequence}-plan-before.json`, "utf8"));
              if (report.status !== "PASS" || report.dbChanged !== false ||
                  report.immutableReleaseId !== process.env.CYCLE58_RELEASE_ID ||
                  report.expectedSourceCommit !== process.env.CYCLE58_RELEASE_COMMIT ||
                  !["MISSING", "EXISTING"].includes(report.state)) process.exit(1);
              if (report.stepCount !== 5 || report.contentCount !== 5 ||
                  report.exerciseCount !== 5 || report.questionCount !== 15 ||
                  report.assessmentCount !== 1) process.exit(1);
            '
            cat "cycle${sequence}-plan-before.json" >> "${GITHUB_STEP_SUMMARY}"
          done

      - name: Create and verify isolated Neon PITR restore evidence for Cycles 5–8
        if: ${{ inputs.operation == 'APPLY' }}
        env:
          NEON_MANAGEMENT_API_KEY: ${{ secrets.NEON_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install tsx scripts/production-cycle4-pitr-restore-evidence.ts

      - name: Enforce Cycle 5–8 PITR evidence
        if: ${{ inputs.operation == 'APPLY' }}
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install tsx scripts/verify-cycle5-8-pitr-evidence.ts
          echo "PITR_RESTORE_EVIDENCE=PASS" >> "${GITHUB_STEP_SUMMARY}"

      - name: Apply only selected Cycle 5–8 graph scope
        if: ${{ inputs.operation == 'APPLY' }}
        shell: bash
        run: |
          set -euo pipefail
          read -r -a sequences <<< "${CYCLE58_SEQUENCES}"
          for sequence in "${sequences[@]}"; do
            export CYCLE58_SEQUENCE="${sequence}"
            npx --no-install tsx scripts/seed-education-v2-p1-a-cycle-5-8.ts --apply \
              > "cycle${sequence}-apply.json"
            node --input-type=commonjs -e '
              const fs = require("node:fs");
              const sequence = Number(process.env.CYCLE58_SEQUENCE);
              const report = JSON.parse(fs.readFileSync(`cycle${sequence}-apply.json`, "utf8"));
              if (report.status !== "PASS" ||
                  (report.dbChanged !== true && report.state !== "EXISTING")) process.exit(1);
            '
            cat "cycle${sequence}-apply.json" >> "${GITHUB_STEP_SUMMARY}"
          done

      - name: Verify selected Cycle 5–8 graph postconditions
        if: ${{ inputs.operation == 'APPLY' }}
        shell: bash
        run: |
          set -euo pipefail
          read -r -a sequences <<< "${CYCLE58_SEQUENCES}"
          for sequence in "${sequences[@]}"; do
            export CYCLE58_SEQUENCE="${sequence}"
            npx --no-install tsx scripts/seed-education-v2-p1-a-cycle-5-8.ts --dry-run \
              > "cycle${sequence}-plan-after.json"
            node --input-type=commonjs -e '
              const fs = require("node:fs");
              const sequence = Number(process.env.CYCLE58_SEQUENCE);
              const report = JSON.parse(fs.readFileSync(`cycle${sequence}-plan-after.json`, "utf8"));
              if (report.status !== "PASS" || report.dbChanged !== false || report.state !== "EXISTING") process.exit(1);
            '
            cat "cycle${sequence}-plan-after.json" >> "${GITHUB_STEP_SUMMARY}"
          done
          echo "CYCLE58_GRAPH_POSTCONDITION=EXISTING_FOR_SCOPE=${CYCLE58_GRAPH_SCOPE}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload sanitized Cycle 5–8 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-education-v2-p1-a-cycle-5-8
          path: |
            cycle5-8-*.json
            cycle5-*.json
            cycle6-*.json
            cycle7-*.json
            cycle8-*.json
          if-no-files-found: ignore
          retention-days: 7
