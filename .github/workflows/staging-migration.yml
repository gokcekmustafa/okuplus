name: Staging database migration

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Staging branch/ref to migrate
        required: true
        default: staging
        type: choice
        options:
          - staging

permissions:
  contents: read

concurrency:
  group: staging-database-migration
  cancel-in-progress: false

jobs:
  staging-migration:
    name: Apply Prisma migrations to staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      APP_ENV: staging
      NODE_ENV: test
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DB_FINGERPRINT_DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DB_FINGERPRINT_ENVIRONMENT: ${{ vars.DB_FINGERPRINT_ENVIRONMENT }}
      DB_FINGERPRINT_APPROVED_TARGET_FINGERPRINT: ${{ vars.DB_FINGERPRINT_APPROVED_TARGET_FINGERPRINT }}
      EXPECTED_STAGING_FINGERPRINT: 18b7c0ef4791f6596fe2e61879df641fb14e5a7f88e3d06c88f634c17af13b38
    steps:
      - name: Verify staging ref
        shell: bash
        env:
          TARGET_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          test "$TARGET_REF" = "staging"

      - name: Checkout selected staging ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Verify staging database identity
        shell: bash
        run: |
          set -euo pipefail
          test "$APP_ENV" = "staging"
          test "$NODE_ENV" = "test"
          test "$DB_FINGERPRINT_ENVIRONMENT" = "STAGING"
          test -n "$DATABASE_URL"
          test -n "$DB_FINGERPRINT_DATABASE_URL"
          test "$DB_FINGERPRINT_APPROVED_TARGET_FINGERPRINT" = "$EXPECTED_STAGING_FINGERPRINT"

          fingerprint_output="$RUNNER_TEMP/staging-fingerprint-before.json"
          fingerprint_error="$RUNNER_TEMP/staging-fingerprint-before.err"
          if ! npx tsx scripts/db-fingerprint.ts >"$fingerprint_output" 2>"$fingerprint_error"; then
            echo "staging database fingerprint command failed" >&2
            exit 1
          fi

          EXPECTED_STAGING_FINGERPRINT="$EXPECTED_STAGING_FINGERPRINT" \
            FINGERPRINT_OUTPUT="$fingerprint_output" \
            npx tsx -e '
          import { readdirSync, readFileSync, writeFileSync } from "node:fs";
          import {
            classifyPendingMigrations,
            evaluateMigrationGate,
            evaluateMigrationHealth,
            isMigrationRecord,
          } from "./scripts/staging-migration-precondition.ts";
          import {
            assertCatalogEnvironmentSafety,
            assertLiveCatalogTargetIdentity,
            parseCatalogTargetUrl,
            targetFingerprint,
          } from "./src/curriculum/catalog-target-verification.ts";

          const expected = process.env.EXPECTED_STAGING_FINGERPRINT;
          const report = JSON.parse(readFileSync(process.env.FINGERPRINT_OUTPUT, "utf8"));
          const migrationRows = Array.isArray(report.migrations?.rows) && report.migrations.rows.every(isMigrationRecord)
            ? report.migrations.rows
            : null;
          const foundation = "20260914100000_add_learning_experience_foundation";
          const reconciliation = "20260917120000_reconcile_release_0_6_schema";
          const allowedPendingMigrationPolicy = [foundation, reconciliation];
          const approvedHistoricalMigrationPolicy = [
            {
              name: "20260907170000_add_gp_achievement_metadata",
              checksum: "541bcf696c4b08d337c80f0bbfc2462ad749d92336225398653aca8eb32fce3b",
            },
          ];
          const repositoryMigrationNames = new Set(
            readdirSync("prisma/migrations", { withFileTypes: true })
              .filter((entry) => entry.isDirectory())
              .map((entry) => entry.name),
          );
          const migrationHealth = migrationRows
            ? evaluateMigrationHealth(
                migrationRows,
                [...repositoryMigrationNames],
                approvedHistoricalMigrationPolicy,
              )
            : null;
          const pendingMigrations = migrationHealth?.missingFromDb ?? null;
          const pendingClassification = pendingMigrations
            ? classifyPendingMigrations(pendingMigrations, new Set(allowedPendingMigrationPolicy))
            : null;
          const allowedPendingMigrations = pendingClassification?.allowedPendingMigrations ?? null;
          const unexpectedPendingMigrations = pendingClassification?.unexpectedPendingMigrations ?? null;
          const unresolvedFailedMigrations = migrationHealth
            ? migrationHealth.unresolvedFailedMigrationNames.map((name) => ({
                name,
                rolledBack: migrationHealth.unresolvedRolledBackMigrationNames.includes(name),
              }))
            : null;
          const historicalRolledBackMigrations = migrationHealth
            ? migrationHealth.historicalRolledBackMigrationNames.map((name) => ({
                name,
                rolledBack: true,
              }))
            : null;
          const formatMigrationList = (names) =>
            names === null ? "NOT_AVAILABLE" : names.length === 0 ? "NONE" : names.join(",");
          const target = parseCatalogTargetUrl(process.env.DB_FINGERPRINT_DATABASE_URL, "STAGING");
          const identity = {
            database: report.database?.database,
            db_user: report.database?.currentUser,
          };
          assertCatalogEnvironmentSafety(target, { rejectTestDatabase: true });
          assertLiveCatalogTargetIdentity(target, identity);
          const actual = targetFingerprint(target, identity);

          const gate = migrationHealth
            ? evaluateMigrationGate({
                health: migrationHealth,
                pendingMigrations,
                allowedPendingMigrations: allowedPendingMigrationPolicy,
                requireNoPending: false,
                fingerprintPass: actual === expected && /^[a-f0-9]{64}$/u.test(actual),
                identityPass: report.target?.environment === "STAGING",
                prismaStatusCurrent: true,
                schemaDiffClean: true,
              })
            : {
                pass: false,
                checks: { migrationCollections: false },
                failedChecks: ["migrationCollections"],
                unexpectedPendingMigrations: [],
              };
          const checks = gate.checks;
          const failedChecks = gate.failedChecks;
          writeFileSync(
            `${process.env.RUNNER_TEMP}/staging-migration-precondition.json`,
            JSON.stringify(
              {
                result: failedChecks.length === 0 ? "PASS" : "FAIL",
                pendingMigrations,
                allowedPendingMigrations,
                unexpectedPendingMigrations: gate.unexpectedPendingMigrations,
                historicalRolledBackMigrations,
                unresolvedFailedMigrations,
                migrationRows: report.migrations?.rows ?? null,
                repositoryMigrationNames: migrationHealth?.repositoryMigrationNames ?? null,
                activeAppliedMigrationNames: migrationHealth?.activeAppliedMigrationNames ?? null,
                rolledBackMigrationNames: migrationHealth?.rolledBackMigrationNames ?? null,
                missingFromDb: migrationHealth?.missingFromDb ?? null,
                extraActiveInDb: migrationHealth?.extraActiveInDb ?? null,
                duplicateActiveNames: migrationHealth?.duplicateActiveNames ?? null,
                unexpectedActiveMigrationNames: migrationHealth?.unexpectedActiveMigrationNames ?? null,
                approvedHistoricalActiveMigrationNames:
                  migrationHealth?.approvedHistoricalActiveMigrationNames ?? null,
                approvedHistoricalMigrationPolicy,
                allowedPendingMigrationPolicy,
                failedChecks,
                checks,
              },
              null,
              2,
            ),
          );

          if (failedChecks.length > 0) {
            throw new Error(
              `staging precondition failed: ${failedChecks.join(",")}; pendingMigrations=${formatMigrationList(
                pendingMigrations,
              )}; allowedPendingMigrations=${formatMigrationList(
                allowedPendingMigrations,
              )}; unexpectedPendingMigrations=${formatMigrationList(unexpectedPendingMigrations)}; unresolvedFailedMigrations=${formatMigrationList(
                unresolvedFailedMigrations?.map((migration) => migration.name) ?? null,
              )}`,
            );
          }

          writeFileSync(
            `${process.env.RUNNER_TEMP}/staging-migration-preflight.json`,
            JSON.stringify(
              {
                environment: "STAGING",
                fingerprint: actual,
                migrationStatus: report.status,
                migrationHistoryCount: report.migrations?.appliedCount ?? null,
                migrationHistoryRowCount: report.migrations?.allRowsCount ?? null,
                activeAppliedCount: report.migrations?.activeAppliedCount ?? null,
                rolledBackCount: report.migrations?.rolledBackCount ?? null,
                unresolvedFailedCount: report.migrations?.unresolvedFailedCount ?? null,
                pendingMigrations,
                allowedPendingMigrations,
                unexpectedPendingMigrations,
                allowedPendingMigrationPolicy,
                historicalRolledBackMigrations,
                unresolvedFailedMigrations,
                migrationRows: report.migrations?.rows ?? null,
                repositoryMigrationNames: migrationHealth?.repositoryMigrationNames ?? null,
                activeAppliedMigrationNames: migrationHealth?.activeAppliedMigrationNames ?? null,
                rolledBackMigrationNames: migrationHealth?.rolledBackMigrationNames ?? null,
                missingFromDb: migrationHealth?.missingFromDb ?? null,
                extraActiveInDb: migrationHealth?.extraActiveInDb ?? null,
                duplicateActiveNames: migrationHealth?.duplicateActiveNames ?? null,
                unexpectedActiveMigrationNames: migrationHealth?.unexpectedActiveMigrationNames ?? null,
                approvedHistoricalActiveMigrationNames:
                  migrationHealth?.approvedHistoricalActiveMigrationNames ?? null,
                approvedHistoricalMigrationPolicy,
                failedMigrations: unresolvedFailedMigrations?.length ?? null,
                rolledBackMigrations: historicalRolledBackMigrations?.length ?? null,
              },
              null,
              2,
            ),
          );
          console.log("staging fingerprint=PASS");
          '

      - name: Apply staging Prisma migrations
        id: apply
        run: npx prisma migrate deploy

      - name: Verify staging migration and schema
        id: verify
        shell: bash
        run: |
          set -euo pipefail

          migration_status="$RUNNER_TEMP/staging-migrate-status.txt"
          if ! npx prisma migrate status --schema=prisma/schema.prisma >"$migration_status" 2>&1; then
            echo "staging migration status check failed" >&2
            exit 1
          fi

          schema_diff="$RUNNER_TEMP/staging-schema-diff.txt"
          set +e
          npx prisma migrate diff \
            --exit-code \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel prisma/schema.prisma >"$schema_diff" 2>&1
          schema_diff_exit=$?
          set -e
          if test "$schema_diff_exit" -eq 2; then
            echo "staging schema drift detected" >&2
            exit 1
          fi
          if test "$schema_diff_exit" -ne 0; then
            echo "staging schema drift check failed" >&2
            exit 1
          fi

          fingerprint_output="$RUNNER_TEMP/staging-fingerprint-after.json"
          fingerprint_error="$RUNNER_TEMP/staging-fingerprint-after.err"
          if ! npx tsx scripts/db-fingerprint.ts >"$fingerprint_output" 2>"$fingerprint_error"; then
            echo "staging post-migration fingerprint command failed" >&2
            exit 1
          fi

          EXPECTED_STAGING_FINGERPRINT="$EXPECTED_STAGING_FINGERPRINT" \
            FINGERPRINT_OUTPUT="$fingerprint_output" \
            MIGRATION_STATUS_OUTPUT="$migration_status" \
            npx tsx -e '
          import { readdirSync, readFileSync, writeFileSync } from "node:fs";
          import {
            classifyPendingMigrations,
            evaluateMigrationGate,
            evaluateMigrationHealth,
            isMigrationRecord,
          } from "./scripts/staging-migration-precondition.ts";
          import {
            assertCatalogEnvironmentSafety,
            assertLiveCatalogTargetIdentity,
            parseCatalogTargetUrl,
            targetFingerprint,
          } from "./src/curriculum/catalog-target-verification.ts";

          const expected = process.env.EXPECTED_STAGING_FINGERPRINT;
          const report = JSON.parse(readFileSync(process.env.FINGERPRINT_OUTPUT, "utf8"));
          const migrationRows = Array.isArray(report.migrations?.rows) && report.migrations.rows.every(isMigrationRecord)
            ? report.migrations.rows
            : null;
          const foundation = "20260914100000_add_learning_experience_foundation";
          const reconciliation = "20260917120000_reconcile_release_0_6_schema";
          const allowedPendingMigrationPolicy = [foundation, reconciliation];
          const approvedHistoricalMigrationPolicy = [
            {
              name: "20260907170000_add_gp_achievement_metadata",
              checksum: "541bcf696c4b08d337c80f0bbfc2462ad749d92336225398653aca8eb32fce3b",
            },
          ];
          const repositoryMigrationNames = new Set(
            readdirSync("prisma/migrations", { withFileTypes: true })
              .filter((entry) => entry.isDirectory())
              .map((entry) => entry.name),
          );
          const migrationHealth = migrationRows
            ? evaluateMigrationHealth(
                migrationRows,
                [...repositoryMigrationNames],
                approvedHistoricalMigrationPolicy,
              )
            : null;
          const pendingMigrations = migrationHealth?.missingFromDb ?? null;
          const pendingClassification = pendingMigrations
            ? classifyPendingMigrations(pendingMigrations, new Set(allowedPendingMigrationPolicy))
            : null;
          const allowedPendingMigrations = pendingClassification?.allowedPendingMigrations ?? null;
          const unexpectedPendingMigrations = pendingClassification?.unexpectedPendingMigrations ?? null;
          const unresolvedFailedMigrations = migrationHealth
            ? migrationHealth.unresolvedFailedMigrationNames.map((name) => ({
                name,
                rolledBack: migrationHealth.unresolvedRolledBackMigrationNames.includes(name),
              }))
            : null;
          const historicalRolledBackMigrations = migrationHealth
            ? migrationHealth.historicalRolledBackMigrationNames.map((name) => ({
                name,
                rolledBack: true,
              }))
            : null;
          const formatMigrationList = (names) =>
            names === null ? "NOT_AVAILABLE" : names.length === 0 ? "NONE" : names.join(",");
          const target = parseCatalogTargetUrl(process.env.DB_FINGERPRINT_DATABASE_URL, "STAGING");
          const identity = {
            database: report.database?.database,
            db_user: report.database?.currentUser,
          };
          assertCatalogEnvironmentSafety(target, { rejectTestDatabase: true });
          assertLiveCatalogTargetIdentity(target, identity);
          const actual = targetFingerprint(target, identity);

          const gate = migrationHealth
            ? evaluateMigrationGate({
                health: migrationHealth,
                pendingMigrations,
                allowedPendingMigrations: allowedPendingMigrationPolicy,
                requireNoPending: true,
                fingerprintPass: actual === expected && /^[a-f0-9]{64}$/u.test(actual),
                identityPass: report.target?.environment === "STAGING",
                prismaStatusCurrent: /database schema is up to date|no pending migrations/iu.test(
                  readFileSync(process.env.MIGRATION_STATUS_OUTPUT, "utf8"),
                ),
                schemaDiffClean: true,
              })
            : {
                pass: false,
                checks: { migrationCollections: false },
                failedChecks: ["migrationCollections"],
                unexpectedPendingMigrations: [],
              };
          const checks = gate.checks;
          const failedChecks = gate.failedChecks;
          writeFileSync(
            `${process.env.RUNNER_TEMP}/staging-migration-postcondition.json`,
            JSON.stringify(
              {
                result: failedChecks.length === 0 ? "PASS" : "FAIL",
                pendingMigrations,
                allowedPendingMigrations,
                unexpectedPendingMigrations: gate.unexpectedPendingMigrations,
                historicalRolledBackMigrations,
                unresolvedFailedMigrations,
                migrationRows: report.migrations?.rows ?? null,
                repositoryMigrationNames: migrationHealth?.repositoryMigrationNames ?? null,
                activeAppliedMigrationNames: migrationHealth?.activeAppliedMigrationNames ?? null,
                rolledBackMigrationNames: migrationHealth?.rolledBackMigrationNames ?? null,
                missingFromDb: migrationHealth?.missingFromDb ?? null,
                extraActiveInDb: migrationHealth?.extraActiveInDb ?? null,
                duplicateActiveNames: migrationHealth?.duplicateActiveNames ?? null,
                unexpectedActiveMigrationNames: migrationHealth?.unexpectedActiveMigrationNames ?? null,
                approvedHistoricalActiveMigrationNames:
                  migrationHealth?.approvedHistoricalActiveMigrationNames ?? null,
                approvedHistoricalMigrationPolicy,
                allowedPendingMigrationPolicy,
                failedChecks,
                checks,
              },
              null,
              2,
            ),
          );

          if (failedChecks.length > 0) {
            throw new Error(
              `staging migration or schema validation failed: ${failedChecks.join(",")}; pendingMigrations=${formatMigrationList(
                pendingMigrations,
              )}; unresolvedFailedMigrations=${formatMigrationList(
                unresolvedFailedMigrations?.map((migration) => migration.name) ?? null,
              )}`,
            );
          }

          writeFileSync(
            `${process.env.RUNNER_TEMP}/staging-migration-verification.json`,
            JSON.stringify(
              {
                environment: "STAGING",
                fingerprint: actual,
                migrationStatus: gate.checks.prismaStatusCurrent ? "CURRENT" : "NOT_CURRENT",
                migrationHistoryCount: report.migrations?.appliedCount ?? null,
                migrationHistoryRowCount: report.migrations?.allRowsCount ?? null,
                activeAppliedCount: report.migrations?.activeAppliedCount ?? null,
                rolledBackCount: report.migrations?.rolledBackCount ?? null,
                unresolvedFailedCount: report.migrations?.unresolvedFailedCount ?? null,
                repositoryMigrationNames: migrationHealth?.repositoryMigrationNames ?? null,
                activeAppliedMigrationNames: migrationHealth?.activeAppliedMigrationNames ?? null,
                migrationRows: report.migrations?.rows ?? null,
                rolledBackMigrationNames: migrationHealth?.rolledBackMigrationNames ?? null,
                missingFromDb: migrationHealth?.missingFromDb ?? null,
                extraActiveInDb: migrationHealth?.extraActiveInDb ?? null,
                duplicateActiveNames: migrationHealth?.duplicateActiveNames ?? null,
                unexpectedActiveMigrationNames: migrationHealth?.unexpectedActiveMigrationNames ?? null,
                historicalRolledBackMigrations,
                unresolvedFailedMigrations,
                failedMigrations: unresolvedFailedMigrations?.length ?? null,
                rolledBackMigrations: historicalRolledBackMigrations?.length ?? null,
                schema: "PASS",
                schemaDrift: false,
                result: "PASS",
              },
              null,
              2,
            ),
          );
          console.log("staging migration=PASS schema=PASS schemaDrift=FALSE");
          '

      - name: Publish sanitized staging migration summary
        if: always()
        shell: bash
        env:
          APPLY_OUTCOME: ${{ steps.apply.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          import { existsSync, readFileSync } from "node:fs";

          const readJson = (path) => (existsSync(path) ? JSON.parse(readFileSync(path, "utf8")) : null);
          const preflight = readJson(`${process.env.RUNNER_TEMP}/staging-migration-preflight.json`);
          const precondition = readJson(`${process.env.RUNNER_TEMP}/staging-migration-precondition.json`);
          const verification = readJson(`${process.env.RUNNER_TEMP}/staging-migration-verification.json`);
          const safe = verification ?? preflight;
          const source = verification ?? precondition ?? preflight;
          const migrationRows = source?.migrationRows ?? null;
          const repositoryMigrationNames = source?.repositoryMigrationNames ?? null;
          const activeAppliedMigrationNames = source?.activeAppliedMigrationNames ?? null;
          const rolledBackMigrationNames = source?.rolledBackMigrationNames ?? null;
          const missingFromDb = source?.missingFromDb ?? null;
          const extraActiveInDb = source?.extraActiveInDb ?? null;
          const duplicateActiveNames = source?.duplicateActiveNames ?? null;
          const unexpectedActiveMigrationNames = source?.unexpectedActiveMigrationNames ?? null;
          const migrationHistoryRowCount = source?.migrationHistoryRowCount ?? null;
          const activeAppliedCount = source?.activeAppliedCount ?? null;
          const rolledBackCount = source?.rolledBackCount ?? null;
          const unresolvedFailedCount = source?.unresolvedFailedCount ?? null;
          const pendingMigrations =
            verification?.pendingMigrations ?? precondition?.pendingMigrations ?? preflight?.pendingMigrations ?? null;
          const allowedPendingMigrations =
            verification?.allowedPendingMigrations ??
            precondition?.allowedPendingMigrations ??
            preflight?.allowedPendingMigrations ??
            null;
          const unexpectedPendingMigrations =
            verification?.unexpectedPendingMigrations ??
            precondition?.unexpectedPendingMigrations ??
            preflight?.unexpectedPendingMigrations ??
            null;
          const historicalRolledBackMigrations =
            verification?.historicalRolledBackMigrations ??
            precondition?.historicalRolledBackMigrations ??
            preflight?.historicalRolledBackMigrations ??
            null;
          const unresolvedFailedMigrations =
            verification?.unresolvedFailedMigrations ??
            precondition?.unresolvedFailedMigrations ??
            preflight?.unresolvedFailedMigrations ??
            null;
          const formatMigrationList = (names) =>
            Array.isArray(names) ? (names.length ? names.join(", ") : "NONE") : "NOT_AVAILABLE";
          const formatMigrationObjectList = (migrations) =>
            Array.isArray(migrations)
              ? formatMigrationList(migrations.map((migration) => migration.name))
              : "NOT_AVAILABLE";

          console.log("## Staging database migration");
          console.log(`- targetEnvironment: ${safe?.environment ?? "STAGING"}`);
          console.log(`- targetFingerprint: ${safe?.fingerprint ?? "NOT_AVAILABLE"}`);
          console.log(`- migrationHistoryCount: ${safe?.migrationHistoryCount ?? "NOT_AVAILABLE"}`);
          console.log(`- migrationHistoryRowCount: ${migrationHistoryRowCount ?? "NOT_AVAILABLE"}`);
          console.log(`- activeAppliedCount: ${activeAppliedCount ?? "NOT_AVAILABLE"}`);
          console.log(`- rolledBackCount: ${rolledBackCount ?? "NOT_AVAILABLE"}`);
          console.log(`- unresolvedFailedCount: ${unresolvedFailedCount ?? "NOT_AVAILABLE"}`);
          console.log(`- migrationStatus: ${verification?.migrationStatus ?? preflight?.migrationStatus ?? "NOT_RUN"}`);
          console.log(`- repositoryMigrationNames: ${formatMigrationList(repositoryMigrationNames)}`);
          console.log(`- activeAppliedMigrationNames: ${formatMigrationList(activeAppliedMigrationNames)}`);
          console.log(`- rolledBackMigrationNames: ${formatMigrationList(rolledBackMigrationNames)}`);
          console.log(`- missingFromDb: ${formatMigrationList(missingFromDb)}`);
          console.log(`- extraActiveInDb: ${formatMigrationList(extraActiveInDb)}`);
          console.log(`- duplicateActiveNames: ${formatMigrationList(duplicateActiveNames)}`);
          console.log(`- unexpectedActiveMigrationNames: ${formatMigrationList(unexpectedActiveMigrationNames)}`);
          console.log("- migrationRows:");
          console.log("```json");
          console.log(JSON.stringify(migrationRows ?? "NOT_AVAILABLE", null, 2));
          console.log("```");
          console.log(`- pendingMigrations: ${formatMigrationList(pendingMigrations)}`);
          console.log(`- allowedPendingMigrations: ${formatMigrationList(allowedPendingMigrations)}`);
          console.log(`- unexpectedPendingMigrations: ${formatMigrationList(unexpectedPendingMigrations)}`);
          console.log(`- historicalRolledBackMigrations: ${formatMigrationObjectList(historicalRolledBackMigrations)}`);
          console.log(`- unresolvedFailedMigrations: ${formatMigrationObjectList(unresolvedFailedMigrations)}`);
          console.log(`- failedMigrations: ${verification?.failedMigrations ?? preflight?.failedMigrations ?? "NOT_VERIFIED"}`);
          console.log(`- rolledBackMigrations: ${verification?.rolledBackMigrations ?? preflight?.rolledBackMigrations ?? "NOT_VERIFIED"}`);
          console.log(`- schema: ${verification?.schema ?? "NOT_VERIFIED"}`);
          console.log(`- schemaDrift: ${verification?.schemaDrift === false ? "false" : "NOT_VERIFIED"}`);
          console.log(`- migrateDeploy: ${process.env.APPLY_OUTCOME === "success" ? "PASS" : process.env.APPLY_OUTCOME ?? "NOT_RUN"}`);
          console.log(`- verification: ${process.env.VERIFY_OUTCOME === "success" ? "PASS" : process.env.VERIFY_OUTCOME ?? "NOT_RUN"}`);
          console.log(`- result: ${verification?.result ?? "FAIL_OR_NOT_RUN"}`);
          NODE
