name: Mobile native builds

on:
  pull_request:
    paths:
      - "mobile/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/mobile-native-builds.yml"
  push:
    branches:
      - master
    paths:
      - "mobile/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/mobile-native-builds.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK and unsigned release validation
    # Build APKs on the standard hosted runner; native instrumentation requires an explicitly configured KVM runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OKUPRATIK_ANDROID_SIGNING_MODE: ephemeral-debug
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36"

      - name: Install mobile dependencies
        run: npm ci --prefix mobile

      - name: Sync Capacitor web assets
        run: npm run sync --prefix mobile

      - name: Configure optional stable Android test signing
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        shell: bash
        env:
          ANDROID_TEST_KEYSTORE_BASE64: ${{ secrets.ANDROID_TEST_KEYSTORE_BASE64 }}
          ANDROID_TEST_STORE_PASSWORD: ${{ secrets.ANDROID_TEST_STORE_PASSWORD }}
          ANDROID_TEST_KEY_ALIAS: ${{ secrets.ANDROID_TEST_KEY_ALIAS }}
          ANDROID_TEST_KEY_PASSWORD: ${{ secrets.ANDROID_TEST_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          values=("$ANDROID_TEST_KEYSTORE_BASE64" "$ANDROID_TEST_STORE_PASSWORD" "$ANDROID_TEST_KEY_ALIAS" "$ANDROID_TEST_KEY_PASSWORD")
          configured=0
          for value in "${values[@]}"; do
            if [ -n "$value" ]; then configured=$((configured + 1)); fi
          done
          if [ "$configured" -eq 0 ]; then
            echo "OKUPRATIK_ANDROID_SIGNING_MODE=ephemeral-debug" >> "$GITHUB_ENV"
            echo "Test APK uses the runner's debug key; its SHA-1 may differ on another runner." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$configured" -ne "${#values[@]}" ]; then
            echo "::error::Stable Android test signing secrets are only partially configured."
            exit 1
          fi
          keystore="$RUNNER_TEMP/okupratik-android-test-signing.jks"
          printf '%s' "$ANDROID_TEST_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          test -s "$keystore"
          chmod 600 "$keystore"
          {
            echo "OKUPRATIK_ANDROID_TEST_KEYSTORE_PATH=$keystore"
            echo "OKUPRATIK_ANDROID_SIGNING_MODE=stable-test-key"
          } >> "$GITHUB_ENV"
          echo "Test APK uses the configured stable test signing key." >> "$GITHUB_STEP_SUMMARY"

      - name: Build Android debug APK, instrumentation test APK, and unsigned release bundle
        id: android-build
        working-directory: mobile/android
        env:
          OKUPRATIK_ANDROID_TEST_STORE_PASSWORD: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && secrets.ANDROID_TEST_STORE_PASSWORD || '' }}
          OKUPRATIK_ANDROID_TEST_KEY_ALIAS: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && secrets.ANDROID_TEST_KEY_ALIAS || '' }}
          OKUPRATIK_ANDROID_TEST_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && secrets.ANDROID_TEST_KEY_PASSWORD || '' }}
        run: |
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew assembleDebug assembleDebugAndroidTest bundleRelease --no-daemon --stacktrace --console=plain 2>&1 | tee "$RUNNER_TEMP/android-gradle.log"; then
            diagnostic="$(awk '/^\* What went wrong:/ { print; for (i = 0; i < 8; i++) { if (getline) print; else exit } }' "$RUNNER_TEMP/android-gradle.log" | head -n 9 | tr '\n' ' ' | sed -E 's#https?://[^[:space:]]+#\[URL\]#g; s#(password|token|secret)[=:][^[:space:]]+#\1=[REDACTED]#Ig')"
            if [ -z "$diagnostic" ]; then
              diagnostic="Gradle failed; detailed diagnostic section was unavailable."
            fi
            diagnostic="${diagnostic//'%'/'%25'}"
            diagnostic="${diagnostic//$'\r'/'%0D'}"
            diagnostic="${diagnostic//$'\n'/'%0A'}"
            echo "::error title=Android Gradle failure::$diagnostic"
            exit 1
          fi

      - name: Locate generated Android debug APK
        id: debug-apk
        if: always() && steps.android-build.outcome == 'success'
        shell: bash
        run: |
          apk="$(find mobile/android/app/build/outputs -type f -name 'app-debug.apk' -print -quit 2>/dev/null || true)"
          if [ -z "$apk" ] || [ ! -s "$apk" ]; then
            echo "::error::Gradle completed but no non-empty app-debug.apk was found. Available APK outputs:"
            find mobile/android/app/build/outputs -type f -name '*.apk' -print 2>/dev/null || true
            exit 1
          fi
          printf 'path=%s\n' "$apk" >> "$GITHUB_OUTPUT"

      - name: Verify Android test package and signing fingerprint
        id: debug-apk-identity
        if: always() && steps.debug-apk.outcome == 'success'
        shell: bash
        env:
          APK_PATH: ${{ steps.debug-apk.outputs.path }}
        run: |
          set -euo pipefail
          aapt=""
          apksigner=""
          for build_tools in "$ANDROID_HOME"/build-tools/*; do
            if [ -x "$build_tools/aapt" ]; then aapt="$build_tools/aapt"; fi
            if [ -x "$build_tools/apksigner" ]; then apksigner="$build_tools/apksigner"; fi
          done
          test -n "$aapt" && test -n "$apksigner"
          badging="$("$aapt" dump badging "$APK_PATH")"
          package_name="$(printf '%s\n' "$badging" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" | head -n 1)"
          version_name="$(printf '%s\n' "$badging" | sed -n "s/^package:.*versionName='\\([^']*\\)'.*/\\1/p" | head -n 1)"
          certificate="$("$apksigner" verify --print-certs "$APK_PATH" 2>&1)"
          sha1="$(printf '%s\n' "$certificate" | awk '
            {
              line = tolower($0)
              if (line ~ /sha[- ]?1/ && line ~ /digest/) {
                sub(/^.*digest[[:space:]]*:[[:space:]]*/, "", line)
                gsub(/[^0-9a-f]/, "", line)
                if (length(line) == 40) {
                  print toupper(line)
                  exit
                }
              }
            }
          ')"
          if [ "$package_name" != "com.okupratik.app" ]; then
            echo "::error::Unexpected Android package name in debug APK."
            exit 1
          fi
          if ! [[ "$sha1" =~ ^[0-9A-F]{40}$ ]]; then
            sha1_lines="$(printf '%s\n' "$certificate" | grep -icE 'sha[- ]?1.*digest' || true)"
            echo "::error::Could not verify the Android debug APK signing certificate fingerprint (SHA-1 digest line count: $sha1_lines)."
            exit 1
          fi
          {
            echo "package_name=$package_name"
            echo "version_name=$version_name"
            echo "sha1=$sha1"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Android test APK identity"
            echo "- Package: \`$package_name\`"
            echo "- Version: \`$version_name\`"
            echo "- Signing certificate SHA-1: \`$sha1\`"
            echo "- Signing mode: \`$OKUPRATIK_ANDROID_SIGNING_MODE\`"
            echo "- Android OAuth package/SHA-1 match is not queried by this workflow."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Locate generated Android instrumentation APK
        id: instrumentation-apk
        if: always() && steps.android-build.outcome == 'success'
        shell: bash
        run: |
          apk="$(find mobile/android/app/build/outputs -type f -name 'app-debug-androidTest.apk' -print -quit 2>/dev/null || true)"
          if [ -z "$apk" ] || [ ! -s "$apk" ]; then
            echo "::error::Gradle completed but no non-empty app-debug-androidTest.apk was found."
            exit 1
          fi
          printf 'path=%s\n' "$apk" >> "$GITHUB_OUTPUT"

      - name: Upload Android debug APK
        if: always() && steps.debug-apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: okupratik-android-debug-${{ github.sha }}
          path: ${{ steps.debug-apk.outputs.path }}
          if-no-files-found: error

      - name: Upload Android instrumentation APK
        if: always() && steps.instrumentation-apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: okupratik-android-instrumentation-${{ github.sha }}
          path: ${{ steps.instrumentation-apk.outputs.path }}
          if-no-files-found: error

  android-hosted-kvm-instrumentation:
    name: Check hosted KVM and run Android Secure Storage round-trip when available
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
    needs: android
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      kvm_available: ${{ steps.kvm.outputs.available }}
    steps:
      - name: Download Android debug APK
        uses: actions/download-artifact@v4
        with:
          name: okupratik-android-debug-${{ github.sha }}
          path: mobile/android-test-inputs/app

      - name: Download Android instrumentation APK
        uses: actions/download-artifact@v4
        with:
          name: okupratik-android-instrumentation-${{ github.sha }}
          path: mobile/android-test-inputs/instrumentation

      - name: Set up Java for Android instrumentation
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools emulator system-images;android-30;aosp_atd;x86"

      - name: Check GitHub-hosted Linux KVM capability
        id: kvm
        shell: bash
        env:
          ANDROID_SECURE_STORAGE_RUNNER_LABEL: ${{ vars.ANDROID_SECURE_STORAGE_RUNNER_LABEL }}
        run: |
          set -euo pipefail
          if [ -r /dev/kvm ] && [ -w /dev/kvm ] && "$ANDROID_HOME/emulator/emulator" -accel-check >"$RUNNER_TEMP/kvm-check.log" 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "GITHUB_HOSTED_KVM=AVAILABLE; native Secure Storage test will run here" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            if [ -n "$ANDROID_SECURE_STORAGE_RUNNER_LABEL" ]; then
              echo "GITHUB_HOSTED_KVM=UNAVAILABLE; configured self-hosted runner fallback will be used" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "GITHUB_HOSTED_KVM=UNAVAILABLE; native Secure Storage test=NOT_RUN; configure a real KVM-enabled runner before claiming round-trip coverage" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - name: Start Android Debug Bridge on hosted runner
        if: steps.kvm.outputs.available == 'true'
        run: adb start-server

      - name: Run Secure Storage instrumentation test on GitHub-hosted KVM
        if: steps.kvm.outputs.available == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 12
        with:
          api-level: 30
          target: aosp_atd
          arch: x86
          channel: canary
          cores: 2
          force-avd-creation: true
          emulator-boot-timeout: 180
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            set -euo pipefail
            app_apk="$GITHUB_WORKSPACE/mobile/android-test-inputs/app/app-debug.apk"
            test_apk="$GITHUB_WORKSPACE/mobile/android-test-inputs/instrumentation/app-debug-androidTest.apk"
            test -s "$app_apk"
            test -s "$test_apk"
            adb install -r "$app_apk"
            adb install -r "$test_apk"
            adb shell am instrument -w -r com.okupratik.app.test/androidx.test.runner.AndroidJUnitRunner | tee "$RUNNER_TEMP/android-instrumentation.log"
            grep -Eq '^OK \([1-9][0-9]* tests?\)$' "$RUNNER_TEMP/android-instrumentation.log"
            if grep -q '^FAILURES!!!$' "$RUNNER_TEMP/android-instrumentation.log"; then
              exit 1
            fi

  android-instrumentation:
    name: Android Secure Storage native round-trip
    if: ${{ vars.ANDROID_SECURE_STORAGE_RUNNER_LABEL != '' && github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && needs.android-hosted-kvm-instrumentation.outputs.kvm_available != 'true' }}
    needs: [android, android-hosted-kvm-instrumentation]
    runs-on: ${{ vars.ANDROID_SECURE_STORAGE_RUNNER_LABEL }}
    timeout-minutes: 30
    steps:
      - name: Download Android debug APK
        uses: actions/download-artifact@v4
        with:
          name: okupratik-android-debug-${{ github.sha }}
          path: mobile/android-test-inputs/app

      - name: Download Android instrumentation APK
        uses: actions/download-artifact@v4
        with:
          name: okupratik-android-instrumentation-${{ github.sha }}
          path: mobile/android-test-inputs/instrumentation

      - name: Set up Java for Android instrumentation
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools emulator system-images;android-30;aosp_atd;x86"

      - name: Verify KVM before starting the emulator
        shell: bash
        run: |
          test -r /dev/kvm && test -w /dev/kvm || { echo "::error::The configured runner does not provide usable /dev/kvm; instrumentation was not started."; exit 1; }
          "$ANDROID_HOME/emulator/emulator" -accel-check

      - name: Start Android Debug Bridge
        run: adb start-server

      - name: Run Secure Storage instrumentation test on KVM emulator
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 12
        with:
          api-level: 30
          target: aosp_atd
          arch: x86
          channel: canary
          cores: 2
          force-avd-creation: true
          emulator-boot-timeout: 180
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            set -euo pipefail
            app_apk="$GITHUB_WORKSPACE/mobile/android-test-inputs/app/app-debug.apk"
            test_apk="$GITHUB_WORKSPACE/mobile/android-test-inputs/instrumentation/app-debug-androidTest.apk"
            test -s "$app_apk"
            test -s "$test_apk"
            adb install -r "$app_apk"
            adb install -r "$test_apk"
            adb shell am instrument -w -r com.okupratik.app.test/androidx.test.runner.AndroidJUnitRunner | tee "$RUNNER_TEMP/android-instrumentation.log"
            grep -Eq '^OK \([1-9][0-9]* tests?\)$' "$RUNNER_TEMP/android-instrumentation.log"
            if grep -q '^FAILURES!!!$' "$RUNNER_TEMP/android-instrumentation.log"; then
              exit 1
            fi

  ios:
    name: iOS simulator build
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm ci --prefix mobile

      - name: Sync Capacitor web assets
        run: npm run sync --prefix mobile

      - name: Build iOS simulator app
        run: |
          xcodebuild \
            -project mobile/ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath mobile/ios/build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build unsigned iOS release archive for validation
        run: |
          xcodebuild \
            -project mobile/ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath mobile/ios/build/Archive/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Upload iOS simulator app
        uses: actions/upload-artifact@v4
        with:
          name: okupratik-ios-simulator-${{ github.sha }}
          path: mobile/ios/build/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: error
