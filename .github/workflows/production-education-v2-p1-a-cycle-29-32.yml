name: Manual Education V2 P1-A Cycles 29–32 production provision

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "PLAN_ONLY is read-only; APPLY creates only missing Cycle 29–32 graphs after same-run PITR verification"
        required: true
        type: choice
        options:
          - PLAN_ONLY
          - APPLY
        default: PLAN_ONLY
      confirm_cycle29_32:
        description: "Type the exact operation confirmation for Cycles 29–32"
        required: true
        type: string
      production_release_id:
        description: "Exact content-addressed Cycle 29–32 release ID"
        required: true
        type: string
      production_release_commit:
        description: "Exact master commit selected for this run (must equal GITHUB_SHA)"
        required: true
        type: string
      production_editorial_approval:
        description: "For APPLY, exact product-owner approval containing release fingerprint and commit"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: production-education-v2-p1-a-cycle-29-32
  cancel-in-progress: false

jobs:
  provision-cycle-29-32:
    name: Plan or apply Education V2 P1-A Cycles 29–32 only
    runs-on: ubuntu-latest
    environment:
      name: production-migration
    timeout-minutes: 45
    env:
      APP_ENV: production
      NODE_ENV: production
      DB_FINGERPRINT_ENVIRONMENT: PRODUCTION
      EDUCATION_V2_P1_A_CYCLE_29_32_ENVIRONMENT: PRODUCTION
      PRODUCTION_DB_APPROVED_TARGET_FINGERPRINT: ${{ vars.PRODUCTION_DB_APPROVED_TARGET_FINGERPRINT }}
      PRODUCTION_DB_APPROVED_PROVIDER: ${{ vars.PRODUCTION_DB_APPROVED_PROVIDER }}
      PRODUCTION_DB_APPROVED_HOST: ${{ vars.PRODUCTION_DB_APPROVED_HOST }}
      PRODUCTION_DB_APPROVED_PORT: ${{ vars.PRODUCTION_DB_APPROVED_PORT }}
      PRODUCTION_DB_APPROVED_DATABASE: ${{ vars.PRODUCTION_DB_APPROVED_DATABASE }}
      PRODUCTION_DB_APPROVED_USER: ${{ vars.PRODUCTION_DB_APPROVED_USER }}
      PRODUCTION_DB_APPROVED_HISTORICAL_MIGRATION_CHECKSUMS: ${{ vars.PRODUCTION_DB_APPROVED_HISTORICAL_MIGRATION_CHECKSUMS }}
      EDUCATION_V2_P1_A_CYCLE_29_32_PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      DB_FINGERPRINT_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      EDUCATION_V2_P1_A_CYCLE_29_32_PRODUCTION_DATABASE_NAME: ${{ vars.PRODUCTION_DB_APPROVED_DATABASE }}
      EDUCATION_V2_P1_A_CYCLE_29_32_PRODUCTION_DATABASE_HOST: ${{ vars.PRODUCTION_DB_APPROVED_HOST }}
      EDUCATION_V2_P1_A_CYCLE_29_32_PRODUCTION_RELEASE_ID: ${{ inputs.production_release_id }}
      EDUCATION_V2_P1_A_CYCLE_29_32_PRODUCTION_RELEASE_COMMIT: ${{ inputs.production_release_commit }}
      EDUCATION_V2_P1_A_CYCLE_29_32_PRODUCTION_APPROVAL: ${{ inputs.production_editorial_approval }}
      EDUCATION_V2_P1_A_CYCLE_29_32_APPROVED_TARGET_FINGERPRINT: ${{ vars.PRODUCTION_DB_APPROVED_TARGET_FINGERPRINT }}
      CYCLE2932_OPERATION: ${{ inputs.operation }}
      CYCLE2932_GRAPH_SCOPE: CYCLES_29_TO_32
      CYCLE2932_CONFIRMATION: ${{ inputs.confirm_cycle29_32 }}
      CYCLE2932_RELEASE_ID: ${{ inputs.production_release_id }}
      CYCLE2932_RELEASE_COMMIT: ${{ inputs.production_release_commit }}
      CYCLE2932_PRODUCTION_APPROVAL: ${{ inputs.production_editorial_approval }}
      CYCLE2932_PITR_EVIDENCE_PATH: cycle29-32-pitr-restore-evidence.json
      CYCLE_PITR_SCOPE: cycle29-32
      CYCLE_PITR_EVIDENCE_PATH: cycle29-32-pitr-restore-evidence.json

    steps:
      - name: Checkout selected master release
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Verify protected dispatch and immutable release approval
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "FAIL: $1" >&2; exit 1; }
          require_equal() { [[ "$2" == "$3" ]] || fail "$1"; }
          require_present() { [[ -n "$2" ]] || fail "$1"; }
          require_equal "workflow must be manually dispatched" "${GITHUB_EVENT_NAME}" "workflow_dispatch"
          require_equal "workflow ref must be master" "${GITHUB_REF}" "refs/heads/master"
          checked_out_commit="$(git rev-parse HEAD)"
          require_equal "checked-out commit must match the dispatched commit" "${checked_out_commit}" "${GITHUB_SHA}"
          require_equal "application environment must be production" "${APP_ENV}" "production"
          require_equal "node environment must be production" "${NODE_ENV}" "production"
          require_equal "database fingerprint environment must be production" "${DB_FINGERPRINT_ENVIRONMENT}" "PRODUCTION"
          require_equal "provisioner environment must be production" "${EDUCATION_V2_P1_A_CYCLE_29_32_ENVIRONMENT}" "PRODUCTION"
          require_present "production database secret is missing" "${EDUCATION_V2_P1_A_CYCLE_29_32_PRODUCTION_DATABASE_URL}"
          require_present "approved production database name is missing" "${EDUCATION_V2_P1_A_CYCLE_29_32_PRODUCTION_DATABASE_NAME}"
          require_present "approved production database host is missing" "${EDUCATION_V2_P1_A_CYCLE_29_32_PRODUCTION_DATABASE_HOST}"
          require_present "approved production provider is missing" "${PRODUCTION_DB_APPROVED_PROVIDER}"
          require_present "approved production port is missing" "${PRODUCTION_DB_APPROVED_PORT}"
          require_present "approved production database variable is missing" "${PRODUCTION_DB_APPROVED_DATABASE}"
          require_present "approved production database user variable is missing" "${PRODUCTION_DB_APPROVED_USER}"
          [[ "${PRODUCTION_DB_APPROVED_TARGET_FINGERPRINT}" =~ ^[0-9a-fA-F]{64}$ ]] || fail "approved production target fingerprint is missing or malformed"
          [[ "${CYCLE2932_RELEASE_COMMIT}" =~ ^[0-9a-fA-F]{40}$ ]] || fail "selected release commit is not a full Git SHA"
          require_equal "selected release commit must match the dispatched commit" "${CYCLE2932_RELEASE_COMMIT,,}" "${GITHUB_SHA,,}"
          if ! release_meta="$(npx --no-install tsx -e 'import { EDUCATION_V2_P1_A_CYCLE_29_32_RELEASE_ID, EDUCATION_V2_P1_A_CYCLE_29_32_RELEASE_FINGERPRINT } from "./src/curriculum/education-v2-p1-a-cycle-29-32-release.ts"; process.stdout.write(`${EDUCATION_V2_P1_A_CYCLE_29_32_RELEASE_ID} ${EDUCATION_V2_P1_A_CYCLE_29_32_RELEASE_FINGERPRINT}`)')"; then
            fail "could not calculate the immutable Cycle 29–32 release identity"
          fi
          read -r expected_release_id release_fingerprint <<< "${release_meta}"
          require_equal "submitted release ID does not match the current source fingerprint" "${CYCLE2932_RELEASE_ID}" "${expected_release_id}"
          require_equal "provisioner release ID differs from the submitted release ID" "${EDUCATION_V2_P1_A_CYCLE_29_32_PRODUCTION_RELEASE_ID}" "${expected_release_id}"
          require_equal "graph scope must be exactly CYCLES_29_TO_32" "${CYCLE2932_GRAPH_SCOPE}" "CYCLES_29_TO_32"
          case "${CYCLE2932_OPERATION}" in
            PLAN_ONLY)
              require_equal "PLAN_ONLY confirmation text is invalid" "${CYCLE2932_CONFIRMATION}" "PLAN_EDUCATION_V2_P1_A_CYCLES_29_TO_32"
              echo "BACKUP_RESTORE_EVIDENCE=NOT_REQUIRED_FOR_READ_ONLY_PLAN" >> "${GITHUB_STEP_SUMMARY}"
              ;;
            APPLY)
              require_equal "APPLY confirmation text is invalid" "${CYCLE2932_CONFIRMATION}" "APPLY_EDUCATION_V2_P1_A_CYCLES_29_TO_32"
              expected_approval="I_HAVE_REVIEWED_EDUCATION_V2_P1_A_CYCLES_29_TO_32_PRODUCTION_RELEASE_${release_fingerprint^^}_AT_${GITHUB_SHA^^}"
              require_equal "product-owner approval does not match the current release and commit" "${CYCLE2932_PRODUCTION_APPROVAL}" "${expected_approval}"
              npx --no-install tsx -e 'import { EDUCATION_V2_P1_A_CYCLE_29_32_RELEASE_DECISIONS as decisions } from "./src/curriculum/education-v2-p1-a-cycle-29-32-release.ts"; if (decisions.length !== 4 || decisions.some((item) => item.status !== "OWNER_RELEASE_APPROVED" || item.explicitPublicationApproved !== true)) process.exit(1)'
              echo "BACKUP_RESTORE_EVIDENCE=REQUIRED_FROM_SAME_RUN_PITR" >> "${GITHUB_STEP_SUMMARY}"
              ;;
            *) fail "invalid operation" ;;
          esac
          echo "CYCLE2932_RELEASE_ID=${expected_release_id}" >> "${GITHUB_STEP_SUMMARY}"
          echo "CYCLE2932_RELEASE_COMMIT=${GITHUB_SHA}" >> "${GITHUB_STEP_SUMMARY}"
          echo "CYCLE2932_GRAPH_SCOPE=${CYCLE2932_GRAPH_SCOPE}" >> "${GITHUB_STEP_SUMMARY}"
          echo "CYCLE2932_SELECTED_SEQUENCES=29 30 31 32" >> "${GITHUB_STEP_SUMMARY}"
          echo "PREVIOUS_172_STATIONS=NOT_TOUCHED" >> "${GITHUB_STEP_SUMMARY}"
          echo "STUDENT_ASSIGNMENTS_AND_PROGRESS=NOT_TOUCHED" >> "${GITHUB_STEP_SUMMARY}"
          echo "MIGRATIONS=NOT_RUN" >> "${GITHUB_STEP_SUMMARY}"

      - name: Revalidate production target and migration policy
        env:
          DB_FINGERPRINT_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          PRODUCTION_DB_APPROVED_HISTORICAL_MIGRATION_CHECKSUMS: ${{ vars.PRODUCTION_DB_APPROVED_HISTORICAL_MIGRATION_CHECKSUMS }}
        shell: bash
        run: |
          set -euo pipefail
          fingerprint_report="$(npx --no-install tsx scripts/db-fingerprint.ts)"
          read -r status target_identity <<<"$(printf '%s' "${fingerprint_report}" | node --input-type=commonjs -e 'let input="";process.stdin.on("data",c=>input+=c);process.stdin.on("end",()=>{const v=JSON.parse(input);process.stdout.write(`${v.status??""} ${v.targetIdentityFingerprint??""}`)})')"
          if [ "${status}" = "PASS" ]; then echo "GENERAL_MIGRATION_FINGERPRINT=PASS" >> "${GITHUB_STEP_SUMMARY}"; else echo "GENERAL_MIGRATION_FINGERPRINT=REVIEW_REQUIRED" >> "${GITHUB_STEP_SUMMARY}"; fi
          test "${target_identity}" = "${PRODUCTION_DB_APPROVED_TARGET_FINGERPRINT}" || { echo "FAIL: production target fingerprint changed"; exit 1; }
          echo "PRODUCTION_TARGET_FINGERPRINT=PASS" >> "${GITHUB_STEP_SUMMARY}"
          migration_report_file="$RUNNER_TEMP/cycle29-32-production-migration-forensics.json"
          npx --no-install tsx scripts/production-migration-forensics.ts >"${migration_report_file}"
          cp "${migration_report_file}" cycle29-32-production-migration-forensics.json
          migration_gate_report_file="$RUNNER_TEMP/cycle29-32-migration-gate.json"
          MIGRATION_FORENSICS_REPORT_FILE="${migration_report_file}" CYCLE2932_OPERATION="${CYCLE2932_OPERATION}" npx --no-install tsx scripts/verify-cycle5-8-production-migration-gate.ts >"${migration_gate_report_file}"
          cat "${migration_gate_report_file}" >> "${GITHUB_STEP_SUMMARY}"
          MIGRATION_GATE_REPORT="${migration_gate_report_file}" node --input-type=commonjs -e '
            const fs=require("node:fs"),r=JSON.parse(fs.readFileSync(process.env.MIGRATION_GATE_REPORT,"utf8"));
            if(r.operation==="PLAN_ONLY"&&r.decision==="READ_ONLY_PLAN_ALLOWED"){
              console.log(`PLAN_ONLY_MIGRATION_POLICY=${r.migrationPolicyStatus}`);
              console.log(`PENDING_MIGRATIONS=${r.pendingMigrations.join(",")||"NONE"}`);
            } else if(r.operation==="APPLY"&&r.decision==="APPLY_PREFLIGHT_ALLOWED") {
              if(r.migrationPolicyStatus==="PASS"&&r.graphOnlyExceptionApplied===false) console.log("APPLY_PREFLIGHT=PASS; MIGRATIONS=NOT_RUN");
              else if(r.migrationPolicyStatus==="REVIEW_REQUIRED"&&r.graphOnlyExceptionApplied===true) console.log(`APPLY_PREFLIGHT=GRAPH_ONLY; PENDING_MIGRATIONS_NOT_RUN=${r.pendingMigrations.join(",")}`);
              else process.exit(1);
            } else process.exit(1);'

      - name: Run read-only plan for Cycles 29–32
        shell: bash
        run: |
          set -euo pipefail
          for sequence in 29 30 31 32; do
            export CYCLE2932_SEQUENCE="${sequence}"
            export CYCLE2932_PLAN_REPORT_FILE="cycle${sequence}-plan-before.json"
            export CYCLE2932_EXPECTED_RELEASE_ID="${CYCLE2932_RELEASE_ID}"
            export CYCLE2932_EXPECTED_RELEASE_COMMIT="${CYCLE2932_RELEASE_COMMIT}"
            npx --no-install tsx scripts/seed-education-v2-p1-a-cycle-5-8.ts --dry-run >"${CYCLE2932_PLAN_REPORT_FILE}"
            npx --no-install tsx scripts/verify-cycle29-32-plan-report.ts
          done

      - name: Create and verify isolated Neon PITR restore evidence for Cycles 29–32
        if: ${{ inputs.operation == 'APPLY' }}
        env:
          NEON_MANAGEMENT_API_KEY: ${{ secrets.NEON_API_KEY }}
        shell: bash
        run: npx --no-install tsx scripts/production-cycle4-pitr-restore-evidence.ts

      - name: Enforce same-run Cycle 29–32 PITR evidence
        if: ${{ inputs.operation == 'APPLY' }}
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install tsx scripts/verify-cycle29-32-pitr-evidence.ts
          echo "PITR_RESTORE_EVIDENCE=PASS" >> "${GITHUB_STEP_SUMMARY}"

      - name: Apply only missing Cycle 29–32 graphs
        if: ${{ inputs.operation == 'APPLY' }}
        shell: bash
        run: |
          set -euo pipefail
          for sequence in 29 30 31 32; do
            export CYCLE2932_SEQUENCE="${sequence}"
            npx --no-install tsx scripts/seed-education-v2-p1-a-cycle-5-8.ts --apply >"cycle${sequence}-apply.json"
            node --input-type=commonjs -e '
              const fs=require("node:fs"),s=Number(process.env.CYCLE2932_SEQUENCE),r=JSON.parse(fs.readFileSync(`cycle${s}-apply.json`,`utf8`));
              if(r.status!=="PASS"||!((r.dbChanged===true&&["MISSING","SKILL_LINKS_REPAIRED"].includes(r.state))||(r.dbChanged===false&&r.state==="EXISTING"))){console.error(`FAIL: Cycle ${s} graph apply failed`);process.exit(1)}'
            cat "cycle${sequence}-apply.json" >> "${GITHUB_STEP_SUMMARY}"
          done

      - name: Verify Cycle 29–32 graph postconditions
        if: ${{ inputs.operation == 'APPLY' }}
        shell: bash
        run: |
          set -euo pipefail
          for sequence in 29 30 31 32; do
            export CYCLE2932_SEQUENCE="${sequence}"
            npx --no-install tsx scripts/seed-education-v2-p1-a-cycle-5-8.ts --dry-run >"cycle${sequence}-plan-after.json"
            node --input-type=commonjs -e '
              const fs=require("node:fs"),s=Number(process.env.CYCLE2932_SEQUENCE),r=JSON.parse(fs.readFileSync(`cycle${s}-plan-after.json`,`utf8`));
              if(r.status!=="PASS"||r.dbChanged!==false||r.state!=="EXISTING"){console.error(`FAIL: Cycle ${s} postcondition failed`);process.exit(1)}'
            cat "cycle${sequence}-plan-after.json" >> "${GITHUB_STEP_SUMMARY}"
          done
          echo "CYCLE2932_GRAPH_POSTCONDITION=EXISTING" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload sanitized Cycle 29–32 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-education-v2-p1-a-cycle-29-32
          path: |
            cycle29-32-*.json
            cycle29-*.json
            cycle30-*.json
            cycle31-*.json
            cycle32-*.json
          if-no-files-found: ignore
          retention-days: 7
