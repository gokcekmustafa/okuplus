name: Manual Education V2 P1-A Cycle 4 production provision

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "PLAN_ONLY is read-only; APPLY requires release approval and verified PITR restore"
        required: true
        type: choice
        options:
          - PLAN_ONLY
          - APPLY
        default: PLAN_ONLY
      confirm_cycle4:
        description: "Type PLAN_EDUCATION_V2_P1_A_CYCLE_4 or APPLY_EDUCATION_V2_P1_A_CYCLE_4"
        required: true
        type: string
      production_release_id:
        description: "Exact immutable Cycle 4 release ID shown below"
        required: true
        type: string
      production_release_commit:
        description: "Exact Cycle 4 content source commit"
        required: true
        type: string
      production_editorial_approval:
        description: "For APPLY, type the exact product-owner release approval shown below"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: production-education-v2-p1-a-cycle-4
  cancel-in-progress: false

jobs:
  production-education-v2-p1-a-cycle-4:
    name: Plan or apply Education V2 P1-A Cycle 4 only
    runs-on: ubuntu-latest
    environment:
      name: production-migration
    timeout-minutes: 20
    env:
      APP_ENV: production
      NODE_ENV: production
      DB_FINGERPRINT_ENVIRONMENT: PRODUCTION
      EDUCATION_V2_P1_A_CYCLE_4_ENVIRONMENT: PRODUCTION
      PRODUCTION_DB_APPROVED_TARGET_FINGERPRINT: ${{ vars.PRODUCTION_DB_APPROVED_TARGET_FINGERPRINT }}
      PRODUCTION_DB_APPROVED_PROVIDER: ${{ vars.PRODUCTION_DB_APPROVED_PROVIDER }}
      PRODUCTION_DB_APPROVED_HOST: ${{ vars.PRODUCTION_DB_APPROVED_HOST }}
      PRODUCTION_DB_APPROVED_PORT: ${{ vars.PRODUCTION_DB_APPROVED_PORT }}
      PRODUCTION_DB_APPROVED_DATABASE: ${{ vars.PRODUCTION_DB_APPROVED_DATABASE }}
      PRODUCTION_DB_APPROVED_USER: ${{ vars.PRODUCTION_DB_APPROVED_USER }}
      PRODUCTION_DB_APPROVED_HISTORICAL_MIGRATION_CHECKSUMS: ${{ vars.PRODUCTION_DB_APPROVED_HISTORICAL_MIGRATION_CHECKSUMS }}
      EDUCATION_V2_P1_A_CYCLE_4_PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      DB_FINGERPRINT_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      EDUCATION_V2_P1_A_CYCLE_4_PRODUCTION_DATABASE_NAME: ${{ vars.PRODUCTION_DB_APPROVED_DATABASE }}
      EDUCATION_V2_P1_A_CYCLE_4_PRODUCTION_DATABASE_HOST: ${{ vars.PRODUCTION_DB_APPROVED_HOST }}
      EDUCATION_V2_P1_A_CYCLE_4_PRODUCTION_RELEASE_ID: ${{ inputs.production_release_id }}
      EDUCATION_V2_P1_A_CYCLE_4_PRODUCTION_RELEASE_COMMIT: ${{ inputs.production_release_commit }}
      EDUCATION_V2_P1_A_CYCLE_4_PRODUCTION_APPROVAL: ${{ inputs.production_editorial_approval }}
      EDUCATION_V2_P1_A_CYCLE_4_APPROVED_TARGET_FINGERPRINT: ${{ vars.PRODUCTION_DB_APPROVED_TARGET_FINGERPRINT }}
      CYCLE4_OPERATION: ${{ inputs.operation }}
      CYCLE4_CONFIRMATION: ${{ inputs.confirm_cycle4 }}
      CYCLE4_EDITORIAL_APPROVAL: ${{ inputs.production_editorial_approval }}
      CYCLE4_RELEASE_ID: ${{ inputs.production_release_id }}
      CYCLE4_RELEASE_COMMIT: ${{ inputs.production_release_commit }}
      CYCLE4_PITR_EVIDENCE_PATH: cycle4-pitr-restore-evidence.json

    steps:
      - name: Checkout selected master release
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Verify Cycle 4 production gate
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = "workflow_dispatch"
          test "${GITHUB_REF}" = "refs/heads/master"
          test "${APP_ENV}" = "production"
          test "${NODE_ENV}" = "production"
          test "${DB_FINGERPRINT_ENVIRONMENT}" = "PRODUCTION"
          test "${EDUCATION_V2_P1_A_CYCLE_4_ENVIRONMENT}" = "PRODUCTION"
          test -n "${EDUCATION_V2_P1_A_CYCLE_4_PRODUCTION_DATABASE_URL}"
          test -n "${EDUCATION_V2_P1_A_CYCLE_4_PRODUCTION_DATABASE_NAME}"
          test -n "${EDUCATION_V2_P1_A_CYCLE_4_PRODUCTION_DATABASE_HOST}"
          test -n "${PRODUCTION_DB_APPROVED_PROVIDER}"
          test -n "${PRODUCTION_DB_APPROVED_PORT}"
          test -n "${PRODUCTION_DB_APPROVED_DATABASE}"
          test -n "${PRODUCTION_DB_APPROVED_USER}"
          test "${CYCLE4_RELEASE_ID}" = "OKU-EDUCATION-V2-P1-A-MEANING-STRUCTURE-CYCLE-4@v4:f0166391faa1cfef4857097ad0deb127668bbda2"
          test "${CYCLE4_RELEASE_COMMIT}" = "f0166391faa1cfef4857097ad0deb127668bbda2"
          [[ "${PRODUCTION_DB_APPROVED_TARGET_FINGERPRINT}" =~ ^[0-9a-fA-F]{64}$ ]]
          git cat-file -e "${CYCLE4_RELEASE_COMMIT}^{commit}"
          git merge-base --is-ancestor "${CYCLE4_RELEASE_COMMIT}" HEAD
          approved_content_sha="$(git show "${CYCLE4_RELEASE_COMMIT}:src/curriculum/education-v2-p1-a-cycle-4-program.ts" | sha256sum | awk '{print $1}')"
          current_content_sha="$(git show "HEAD:src/curriculum/education-v2-p1-a-cycle-4-program.ts" | sha256sum | awk '{print $1}')"
          test "${approved_content_sha}" = "${current_content_sha}"
          echo "CYCLE4_RELEASE_COMMIT=PASS" >> "${GITHUB_STEP_SUMMARY}"
          case "${CYCLE4_OPERATION}" in
            PLAN_ONLY)
              test "${CYCLE4_CONFIRMATION}" = "PLAN_EDUCATION_V2_P1_A_CYCLE_4"
              echo "BACKUP_RESTORE_EVIDENCE=NOT_REQUIRED_FOR_READ_ONLY_PLAN" >> "${GITHUB_STEP_SUMMARY}"
              ;;
            APPLY)
              test "${CYCLE4_CONFIRMATION}" = "APPLY_EDUCATION_V2_P1_A_CYCLE_4"
              test "${CYCLE4_EDITORIAL_APPROVAL}" = "I_HAVE_REVIEWED_EDUCATION_V2_P1_A_CYCLE_4_PRODUCTION_EDITORIAL_RELEASE_F0166391FAA1CFEF4857097AD0DEB127668BBDA2"
              echo "BACKUP_RESTORE_EVIDENCE=REQUIRED_FROM_LIVE_PITR_VALIDATION" >> "${GITHUB_STEP_SUMMARY}"
              ;;
            *)
              echo "FAIL: invalid Cycle 4 operation"
              exit 1
              ;;
          esac
          echo "CYCLE4_SCOPE=CANONICAL_GRAPH_ONLY" >> "${GITHUB_STEP_SUMMARY}"
          echo "PREVIOUS_47_STATIONS=NOT_TOUCHED" >> "${GITHUB_STEP_SUMMARY}"
          echo "STUDENT_ASSIGNMENTS_AND_PROGRESS=NOT_TOUCHED" >> "${GITHUB_STEP_SUMMARY}"
          echo "MIGRATIONS=NOT_RUN" >> "${GITHUB_STEP_SUMMARY}"

      - name: Revalidate production target and migration policy
        env:
          DB_FINGERPRINT_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          PRODUCTION_DB_APPROVED_HISTORICAL_MIGRATION_CHECKSUMS: ${{ vars.PRODUCTION_DB_APPROVED_HISTORICAL_MIGRATION_CHECKSUMS }}
        shell: bash
        run: |
          set -euo pipefail
          fingerprint_report="$(npx --no-install tsx scripts/db-fingerprint.ts)"
          read -r status target_identity <<EOF
          $(printf '%s' "${fingerprint_report}" | node --input-type=commonjs -e '
            let input = "";
            process.stdin.on("data", (chunk) => { input += chunk; });
            process.stdin.on("end", () => {
              const value = JSON.parse(input);
              process.stdout.write(`${value.status ?? ""} ${value.targetIdentityFingerprint ?? ""}`);
            });
          ')
          EOF
          if [ "${status}" = "PASS" ]; then
            echo "GENERAL_MIGRATION_FINGERPRINT=PASS" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "GENERAL_MIGRATION_FINGERPRINT=REVIEW_REQUIRED; evaluating explicit migration policy"
            echo "GENERAL_MIGRATION_FINGERPRINT=REVIEW_REQUIRED" >> "${GITHUB_STEP_SUMMARY}"
          fi
          test "${target_identity}" = "${PRODUCTION_DB_APPROVED_TARGET_FINGERPRINT}" || {
            echo "FAIL: production target fingerprint changed"
            exit 1
          }
          echo "PRODUCTION_TARGET_FINGERPRINT=PASS" >> "${GITHUB_STEP_SUMMARY}"
          migration_report_file="$RUNNER_TEMP/cycle4-production-migration-forensics.json"
          npx --no-install tsx scripts/production-migration-forensics.ts >"${migration_report_file}"
          cp "${migration_report_file}" cycle4-production-migration-forensics.json
          MIGRATION_FORENSICS_REPORT_FILE="${migration_report_file}" \
            npx --no-install tsx scripts/verify-canonical-placement-migration-policy.ts
          echo "PRODUCTION_MIGRATION_POLICY=PASS" >> "${GITHUB_STEP_SUMMARY}"

      - name: Run live read-only Cycle 4 plan
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install tsx scripts/seed-education-v2-p1-a-cycle-4.ts --dry-run \
            > cycle4-plan-before.json
          node --input-type=commonjs -e '
            const fs = require("node:fs");
            const report = JSON.parse(fs.readFileSync("cycle4-plan-before.json", "utf8"));
            if (report.status !== "PASS" || report.dbChanged !== false) process.exit(1);
            if (!["MISSING", "EXISTING", "SKILL_LINKS_MISSING"].includes(report.state)) process.exit(1);
          '
          cat cycle4-plan-before.json >> "${GITHUB_STEP_SUMMARY}"

      - name: Create and verify isolated Neon PITR restore evidence
        if: ${{ inputs.operation == 'APPLY' }}
        env:
          NEON_MANAGEMENT_API_KEY: ${{ secrets.NEON_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install tsx scripts/production-cycle4-pitr-restore-evidence.ts

      - name: Enforce PITR evidence before Cycle 4 apply
        if: ${{ inputs.operation == 'APPLY' }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=commonjs -e '
            const fs = require("node:fs");
            const evidence = JSON.parse(fs.readFileSync(process.env.CYCLE4_PITR_EVIDENCE_PATH, "utf8"));
            const target = evidence.targetBranch || {};
            const schema = evidence.schemaComparison || {};
            const data = evidence.dataChecks || {};
            const restored = evidence.restoredDatabaseIdentity || {};
            const unchanged = evidence.productionSourceUnchanged || {};
            const verifiedParentTimestamp = Date.parse(evidence.parentTimestamp || "");
            const requestedParentTimestamp = Date.parse(evidence.requestedParentTimestamp || "");
            const verifiedTimestampAge = Date.now() - verifiedParentTimestamp;
            const requestedTimestampAge = Date.now() - requestedParentTimestamp;
            if (evidence.status !== "PASS" || evidence.schemaVersion !== 2 ||
                evidence.projectId !== "aged-snow-31166248" ||
                evidence.sourceBranchId !== "br-damp-truth-b17y4gog" ||
                target.id === evidence.sourceBranchId || target.projectId !== evidence.projectId ||
                target.parentId !== evidence.sourceBranchId || target.default !== false || target.state !== "ready" ||
                target.annotationMatchesRun !== true ||
                evidence.parentTimestamp !== target.parentTimestamp ||
                !Number.isFinite(verifiedTimestampAge) || verifiedTimestampAge < 30000 || verifiedTimestampAge > 21570000 ||
                !Number.isFinite(requestedTimestampAge) || requestedTimestampAge < 30000 || requestedTimestampAge > 21570000 ||
                schema.result !== "PASS" || schema.method !== "NEON_COMPARE_SCHEMA_API" ||
                schema.endpoint !== `/projects/${evidence.projectId}/branches/${target.id}/compare_schema` ||
                schema.httpStatus !== 200 || schema.baseBranchId !== evidence.sourceBranchId ||
                schema.targetBranchId !== target.id || schema.database !== process.env.PRODUCTION_DB_APPROVED_DATABASE ||
                schema.baseTimestamp !== evidence.parentTimestamp || schema.diffIsEmpty !== true ||
                schema.matches !== true || data.result !== "PASS" ||
                data.queryMode !== "READ_ONLY" || restored.result !== "PASS" ||
                restored.transactionReadOnly !== true || unchanged.result !== "PASS" ||
                evidence.productionDatabaseWrites !== false || evidence.studentProgressChanged !== false) {
              process.stderr.write("PITR evidence is missing, failed, or incomplete; Cycle 4 APPLY is blocked.\n");
              process.exit(1);
            }
          '
          echo "PITR_RESTORE_EVIDENCE=PASS" >> "${GITHUB_STEP_SUMMARY}"

      - name: Apply Cycle 4 graph only
        if: ${{ inputs.operation == 'APPLY' }}
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install tsx scripts/seed-education-v2-p1-a-cycle-4.ts --apply \
            > cycle4-apply.json
          node --input-type=commonjs -e '
            const fs = require("node:fs");
            const report = JSON.parse(fs.readFileSync("cycle4-apply.json", "utf8"));
            if (report.status !== "PASS" ||
                !((report.dbChanged === true && ["MISSING", "SKILL_LINKS_REPAIRED"].includes(report.state)) ||
                  (report.dbChanged === false && report.state === "EXISTING"))) process.exit(1);
          '
          cat cycle4-apply.json >> "${GITHUB_STEP_SUMMARY}"

      - name: Verify complete Cycle 4 graph postconditions
        if: ${{ inputs.operation == 'APPLY' }}
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install tsx scripts/seed-education-v2-p1-a-cycle-4.ts --dry-run \
            > cycle4-plan-after.json
          node --input-type=commonjs -e '
            const fs = require("node:fs");
            const report = JSON.parse(fs.readFileSync("cycle4-plan-after.json", "utf8"));
            if (report.status !== "PASS" || report.dbChanged !== false || report.state !== "EXISTING") process.exit(1);
          '
          cat cycle4-plan-after.json >> "${GITHUB_STEP_SUMMARY}"
          echo "CYCLE4_GRAPH_POSTCONDITION=EXISTING" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload sanitized Cycle 4 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-education-v2-p1-a-cycle-4
          path: cycle4-*.json
          if-no-files-found: ignore
          retention-days: 7
