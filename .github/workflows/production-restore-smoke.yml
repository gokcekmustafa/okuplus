name: Manual isolated production-restore application smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-restore-smoke
  cancel-in-progress: false

jobs:
  isolated-restore-smoke:
    name: Read-only smoke on the approved isolated restore branch
    runs-on: ubuntu-latest
    environment:
      name: production-migration
    timeout-minutes: 20
    env:
      NODE_ENV: production

    steps:
      - name: Enforce master-only manual execution
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = "workflow_dispatch"
          test "${GITHUB_REF}" = "refs/heads/master"

      - name: Checkout canonical master
        uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Run isolated restore read-only application smoke
        env:
          ISOLATED_RESTORE_DATABASE_URL: ${{ secrets.ISOLATED_RESTORE_DATABASE_URL }}
          ISOLATED_RESTORE_DATABASE_HOST: ${{ vars.ISOLATED_RESTORE_DATABASE_HOST }}
          PRODUCTION_DB_APPROVED_HOST: ${{ vars.PRODUCTION_DB_APPROVED_HOST }}
        shell: bash
        run: |
          set -euo pipefail
          report_file="${RUNNER_TEMP}/production-restore-smoke.json"
          stderr_file="${RUNNER_TEMP}/production-restore-smoke.stderr"
          set +e
          npx tsx scripts/production-restore-smoke.ts >"${report_file}" 2>"${stderr_file}"
          smoke_exit_code=$?
          set -e

          node --input-type=module - "${report_file}" "${smoke_exit_code}" <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";

          const source = process.argv[2];
          const smokeExitCode = Number(process.argv[3]);
          const fallback = {
            targetValidation: { status: "FAIL", reason: "SANITIZED_REPORT_UNAVAILABLE" },
            checks: {
              environmentValidation: "NOT_RUN",
              moduleLoading: "NOT_RUN",
              appBuild: "NOT_RUN",
              fastifyReady: "NOT_RUN",
              appInitialization: "NOT_RUN",
              health: "NOT_RUN",
              healthDb: "NOT_RUN",
              ready: "NOT_RUN",
              accountDeletionRequestSchema: "NOT_RUN",
            },
            databaseRolePrivileges: {
              status: "NOT_RUN",
              isSuperuser: null,
              bypassesRls: null,
            },
            commitSha: process.env.GITHUB_SHA ?? "UNKNOWN",
            failureDiagnostic: null,
          };

          let report = fallback;
          try {
            const parsed = JSON.parse(readFileSync(source, "utf8"));
            const validCheck = (value) => ["NOT_RUN", "PASS", "FAIL"].includes(value);
            const diagnosticStages = [
              "TARGET_VALIDATION",
              "ENVIRONMENT_VALIDATION",
              "MODULE_LOADING",
              "APP_BUILD",
              "FASTIFY_READY",
              "HEALTH",
              "HEALTH_DB",
              "READY",
              "ACCOUNT_DELETION_SCHEMA",
              "DATABASE_ROLE_PRIVILEGES",
            ];
            const diagnosticClasses = [
              "Error",
              "TypeError",
              "SyntaxError",
              "ReferenceError",
              "RangeError",
              "AggregateError",
              "ZodError",
              "FastifyError",
              "PrismaClientInitializationError",
              "PrismaClientKnownRequestError",
              "OtherError",
            ];
            const diagnosticCodes = [
              "ERR_MODULE_NOT_FOUND",
              "ERR_PACKAGE_PATH_NOT_EXPORTED",
              "ERR_REQUIRE_ESM",
              "MODULE_NOT_FOUND",
              "ENOENT",
              "EACCES",
              "ECONNREFUSED",
              "ETIMEDOUT",
              "ENOTFOUND",
              "P1000",
              "P1001",
              "P1012",
              "P2021",
              "P2022",
            ];
            const diagnostic = parsed?.failureDiagnostic;
            const validDiagnostic =
              diagnostic === null ||
              (diagnostic &&
                typeof diagnostic === "object" &&
                diagnosticStages.includes(diagnostic.stage) &&
                diagnosticClasses.includes(diagnostic.errorClass) &&
                (diagnostic.errorCode === null || diagnosticCodes.includes(diagnostic.errorCode)));
            const valid =
              parsed &&
              typeof parsed === "object" &&
              ["NOT_RUN", "PASS", "BLOCKED", "FAIL"].includes(parsed.targetValidation?.status) &&
              typeof parsed.targetValidation.reason === "string" &&
              [
                "environmentValidation",
                "moduleLoading",
                "appBuild",
                "fastifyReady",
                "appInitialization",
                "health",
                "healthDb",
                "ready",
                "accountDeletionRequestSchema",
              ].every((key) => validCheck(parsed.checks?.[key])) &&
              validDiagnostic &&
              validCheck(parsed.databaseRolePrivileges?.status) &&
              (parsed.databaseRolePrivileges.isSuperuser === null ||
                typeof parsed.databaseRolePrivileges.isSuperuser === "boolean") &&
              (parsed.databaseRolePrivileges.bypassesRls === null ||
                typeof parsed.databaseRolePrivileges.bypassesRls === "boolean") &&
              typeof parsed.commitSha === "string";
            if (valid) {
              report = {
                targetValidation: parsed.targetValidation,
                checks: {
                  environmentValidation: parsed.checks.environmentValidation,
                  moduleLoading: parsed.checks.moduleLoading,
                  appBuild: parsed.checks.appBuild,
                  fastifyReady: parsed.checks.fastifyReady,
                  appInitialization: parsed.checks.appInitialization,
                  health: parsed.checks.health,
                  healthDb: parsed.checks.healthDb,
                  ready: parsed.checks.ready,
                  accountDeletionRequestSchema: parsed.checks.accountDeletionRequestSchema,
                },
                databaseRolePrivileges: {
                  status: parsed.databaseRolePrivileges.status,
                  isSuperuser: parsed.databaseRolePrivileges.isSuperuser,
                  bypassesRls: parsed.databaseRolePrivileges.bypassesRls,
                },
                commitSha: /^[a-f0-9]{40}$/u.test(parsed.commitSha) ? parsed.commitSha : "UNKNOWN",
                failureDiagnostic:
                  diagnostic === null
                    ? null
                    : {
                        stage: diagnostic.stage,
                        errorClass: diagnostic.errorClass,
                        errorCode: diagnostic.errorCode,
                      },
              };
            }
          } catch {
            // Keep a minimal sanitized failure report; never print raw stderr or input.
          }

          const json = `${JSON.stringify(report, null, 2)}\n`;
          writeFileSync(source, json, "utf8");
          const lines = [
            "## Isolated restore application smoke",
            "",
            `- Target validation: ${report.targetValidation.status} (${report.targetValidation.reason})`,
            `- Environment validation: ${report.checks.environmentValidation}`,
            `- Module loading: ${report.checks.moduleLoading}`,
            `- App build: ${report.checks.appBuild}`,
            `- Fastify ready: ${report.checks.fastifyReady}`,
            `- App initialization: ${report.checks.appInitialization}`,
            `- GET /health: ${report.checks.health}`,
            `- GET /health/db: ${report.checks.healthDb}`,
            `- GET /ready: ${report.checks.ready}`,
            `- AccountDeletionRequest schema: ${report.checks.accountDeletionRequestSchema}`,
            `- DB role flags: ${JSON.stringify(report.databaseRolePrivileges)}`,
            `- Failure diagnostic: ${report.failureDiagnostic ? JSON.stringify(report.failureDiagnostic) : "none"}`,
            `- Commit: ${report.commitSha}`,
          ];
          writeFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join("\n")}\n`, "utf8");
          if (smokeExitCode !== 0 || report.targetValidation.status !== "PASS") {
            console.log("Isolated restore smoke did not pass; see the sanitized summary.");
            process.exitCode = 1;
          }
          NODE

      - name: Upload sanitized smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-restore-smoke-summary
          path: ${{ runner.temp }}/production-restore-smoke.json
          if-no-files-found: warn
